ng:10px 14px;border:2px solid #111;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.12)}button{border:0;background:var(--red);color:#fff;font-size:17px;font-weight:900;padding:10px 18px;border-radius:999px;cursor:pointer}#count{font-weight:900;font-size:15px;min-width:94px}.notes{position:fixed;top:14px;left:14px;right:14px;background:#111;color:#fff;padding:12px 16px;border-radius:12px;z-index:30;display:none;font-size:16px;line-height:1.35;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.25)}.notes.show{display:block}.progress{position:fixed;top:0;left:0;right:0;height:7px;background:#eee;z-index:25}.bar{height:100%;width:0%;background:var(--red);transition:.2s}.brand{position:fixed;top:18px;left:22px;z-index:10;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.hint{position:fixed;top:18px;right:22px;z-index:10;font-size:12px;color:#777;font-weight:800}.emoji-strip{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:12px;z-index:3}.emoji-strip span{width:42px;height:42px;display:grid;place-items:center;border:3px solid #111;border-radius:12px;background:#fff;font-size:25px;box-shadow:4px 4px 0 #111}@media(max-width:800px){.slide{padding:10vw 5vw 22vw}h1{font-size:clamp(36px,11vw,68px)}p{font-size:clamp(21px,6.6vw,36px)}.has-photo .inner{margin-right:0;text-align:center}.has-photo .icon-badge{margin-left:auto}.has-photo h1,.has-photo p{text-align:center}.photo{opacity:.12;right:-18vw;bottom:14vh;width:84vw;height:84vw}.nav{bottom:10px;padding:8px 10px}button{font-size:14px;padding:9px 12px}#count{font-size:13px;min-width:78px}.hint{display:none}.brand{font-size:11px;left:12px;top:12px}.emoji-strip{bottom:76px}.emoji-strip span{width:32px;height:32px;font-size:20px;border-width:2px}}

    const deck=document.getElementById('deck'),count=document.getElementById('count'),notes=document.getElementById('notes'),bar=document.getElementById('bar');let current=0;
    function cards(s){if(!s.cards)return'';return`<div class="grid">${s.cards.map(c=>`<div class="card"><span>${c.split(' ')[0]}</span>${c.substring(c.indexOf(' ')+1)}</div>`).join('')}</div>`}
    for(const s of slides){const sec=document.createElement('section');sec.className='slide'+(s.img?' has-photo':'');const image=s.img?`<img class="photo" src="${s.img}" alt="Sean Ali webinar visual" loading="lazy">`:'';let body=`<p>${s.b}</p>${cards(s)}`;if(s.type==='choice')body='<div class="grid"><div class="card"><span>📚</span>$197<br>Tools</div><div class="card"><span>👑</span>$497<br>Guided System</div></div><p class="tiny">'+s.b+'</p>';if(s.type==='price197')body='<div class="price">$197</div><p>📚 Complete Library</p>';if(s.type==='price497')body='<div class="price">$497</div><p>👑 Everything Bundle</p>';sec.innerHTML=`<div class="inner"><div class="icon-badge">${s.i}</div><h1>${s.t}</h1>${body}</div>${image}<div class="emoji-strip"><span>${s.i}</span><span>💰</span><span>➡️</span></div>`;deck.appendChild(sec)}
    const els=[...document.querySelectorAll('.slide')];function show(i){current=(i+slides.length)%slides.length;els.forEach((e,n)=>e.classList.toggle('active',n===current));count.textContent=`${current+1} / ${slides.length}`;notes.textContent=`Speaker note: ${slides[current].n}`;bar.style.width=`${((current+1)/slides.length)*100}%`}
    document.getElementById('next').onclick=()=>show(current+1);document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('noteBtn').onclick=()=>notes.classList.toggle('show');window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key.toLowerCase()==='n')notes.classList.toggle('show')});show(0);
