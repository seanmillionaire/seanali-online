gba(255,255,255,.45),transparent 20%),linear-gradient(135deg,#ff2a5f,#ff8a22,#ffd84d);border:4px solid var(--orange);box-shadow:0 0 22px rgba(255,138,34,.80);color:#111;font-size:28px;font-weight:1000;letter-spacing:-1px}.teacher-label{display:inline-flex;width:max-content;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:linear-gradient(90deg,#ff2a5f,#ff6c3d);font-size:19px;font-weight:1000;letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}.teacher-quote{font-size:32px;line-height:1.05;font-weight:1000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.tile{min-height:114px;padding:22px;border-radius:26px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 22px rgba(255,255,255,.04);font-size:28px;line-height:1.08;font-weight:950}.tile.bad{border-color:rgba(255,42,95,.60);box-shadow:0 0 22px rgba(255,42,95,.18),inset 0 0 18px rgba(255,42,95,.05)}.tile.good{border-color:rgba(255,216,77,.60);box-shadow:0 0 22px rgba(255,216,77,.14),inset 0 0 18px rgba(255,216,77,.05)}.steps{margin-top:22px;display:grid;gap:15px}.step{display:grid;grid-template-columns:62px 1fr;gap:16px;align-items:center;border-radius:24px;padding:18px 22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}.num{width:54px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--yellow),#ff8a22);color:#111;font-weight:1000;font-size:24px;box-shadow:0 0 18px rgba(255,216,77,.45)}.step div:last-child{font-size:29px;font-weight:920;line-height:1.08}.cta{margin-top:28px;padding:26px 30px;border-radius:30px;background:linear-gradient(90deg,#ffd84d,#ff8a22);color:#111;font-size:38px;line-height:1.05;font-weight:1000;box-shadow:0 0 28px rgba(255,216,77,.38)}.creator-footer{position:absolute;left:58px;right:58px;bottom:104px;z-index:18;display:flex;align-items:center;justify-content:center;gap:12px;height:34px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.62);font-size:17px;font-weight:750;letter-spacing:.1px;backdrop-filter:blur(12px);box-shadow:inset 0 0 18px rgba(255,255,255,.035)}.creator-footer strong{color:#fff;font-weight:950}.creator-footer a{color:rgba(255,216,77,.88);text-decoration:none;font-weight:850}.creator-footer a:hover{color:#fff;text-shadow:0 0 14px rgba(255,216,77,.55)}.controls{position:absolute;left:58px;right:58px;bottom:34px;height:64px;display:grid;grid-template-columns:175px 1fr 175px;gap:22px;align-items:center;z-index:20}.nav-btn{height:64px;border:0;border-radius:999px;font-size:23px;font-weight:1000;color:white;cursor:pointer;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 18px rgba(255,255,255,.05)}.nav-btn.next{background:linear-gradient(90deg,#ff2a5f,#ff6b32);box-shadow:0 0 24px rgba(255,42,95,.55)}.progress{height:44px;border-radius:999px;background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;gap:9px;overflow:hidden}.dot{width:36px;height:8px;border-radius:999px;background:rgba(255,255,255,.20)}.dot.on{background:linear-gradient(90deg,#ff2a5f,#ff6b32);box-shadow:0 0 14px rgba(255,42,95,.75)}@media(max-width:1080px){body{overflow:auto}.stage{width:100vw;height:100vw}.deck{width:94vw;height:94vw;border-radius:5vw;padding:5vw}.slide{inset:5vw 5vw 15vw}h1{font-size:7.4vw}h2{font-size:6.1vw}.copy p{font-size:3.15vw}.badge{font-size:2.4vw}.mini-icon{width:5.5vw;height:5.5vw;font-size:3vw}.teacher-card{grid-template-columns:8.4vw 1fr;padding:2vw}.author-photo-wrap,.avatar-fallback{width:8vw;height:8vw}.avatar-fallback{font-size:2.5vw}.teacher-label{font-size:1.75vw}.teacher-quote{font-size:2.8vw}.icon-line{grid-template-columns:5.3vw 1fr}.icon-bubble{width:5vw;height:5vw;font-size:2.6vw}.icon-line span{font-size:2.8vw}.tile{font-size:2.55vw;min-height:9vw}.step div:last-child{font-size:2.65vw}.creator-footer{left:5vw;right:5vw;bottom:9.2vw;height:3.6vw;font-size:1.55vw;gap:1vw;padding:0 1.5vw}.controls{left:5vw;right:5vw;bottom:3vw;height:5.6vw;grid-template-columns:16vw 1fr 16vw}.nav-btn{height:5.6vw;font-size:2vw}}</style></head><body><div class='stage'><div class='bolt'>ϟ</div><div class='star'></div><div class='deck'><div id='slides'></div><div class='creator-footer'><span>Created by <strong>Sean Ali</strong></span><a href='https://seanali.online' target='_blank' rel='noopener'>SeanAli.online</a><span>•</span><a href='https://hypnoticmeditations.ai' target='_blank' rel='noopener'>Hypnotic Meditations</a><span>•</span><a href='https://manifestationgenie.app' target='_blank' rel='noopener'>Manifestation Genie</a></div><div class='controls'><button class='nav-btn' onclick='prevSlide()'>← Prev</button><div class='progress' id='progress'></div><button class='nav-btn next' onclick='nextSlide()'>Next →</button></div></div></div><script>const AUTHOR_PHOTOS={'Neville Goddard':'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Neville_Goddard.jpg/250px-Neville_Goddard.jpg','Napoleon Hill':'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Napoleon_Hill_headshot.jpg/250px-Napoleon_Hill_headshot.jpg','Wallace Wattles':'https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/The_Science_of_Getting_Rich_-_Frontispiece.jpg/250px-The_Science_of_Getting_Rich_-_Frontispiece.jpg'};const slides=[{hero:true,icon:'🧠',headline:`<span class='white'>Why</span> <span class='grad'>Visualization</span><br><span class='red'>Does Not</span><br><span class='white'>Work For Most People</span>`,copy:[`🧠 Most people think <span class='mark'>the picture is the method.</span>`,`❌ It is not.`,`✅ The state the picture creates is the method.`],pill:`🎯 Imagine from the end, not from the wanting.`},{icon:'🎬',headline:`The real mistake`,copy:[`🎬 You visualize once.`,`😰 Then you worry all day.`,`🔁 The old state gets more repetition.`],callout:`The stronger practice wins.`},{icon:'📘',headline:`Neville Goddard’s real point`,copy:[`Neville Goddard was not teaching daydreaming.`,`Neville Goddard was teaching assumption.`,`You enter the state of the person who already has it.`],teacher:{name:'Neville Goddard',quote:`Live from <span class='mark'>the end</span>.`}},{icon:'❌',headline:`Wrong visualization`,copy:[`This is what most people accidentally practice.`],grid:[['bad','❌ Picture the money.'],['bad','😰 Feel desperate after.'],['bad','🔍 Check reality all day.'],['bad','🔁 Repeat the old story.']]},{icon:'✅',headline:`Right visualization`,copy:[`The scene should train a new inner position.`],grid:[['good','✅ Choose one short scene.'],['good','🏁 Make it after the win.'],['good','😌 Feel it as normal.'],['good','⚡ Act from that identity.']]},{icon:'🏁',headline:`The scene must imply it is done`,copy:[`❌ Not: “I hope money comes.”`,`✅ Instead: <span class='mark'>“The money issue is handled.”</span>`,`That is a completely different signal.`],callout:`The word is: already.`},{icon:'🧠',headline:`Joseph Murphy explains why`,copy:[`Joseph Murphy taught that the subconscious accepts repetition.`,`If you visualize once and rehearse worry all day,`,`worry gets the stronger vote.`],teacher:{name:'Joseph Murphy',quote:`What you repeat impresses the <span class='mark'>subconscious.</span>`}},{icon:'🔁',headline:`The real question`,copy:[`What am I rehearsing more?`,`✅ The fulfilled state?`,`❌ Or the missing state?`],callout:`Your day is the real practice field.`},{icon:'💰',headline:`Money example`,copy:[`💰 You picture a paid invoice.`,`😰 Then you spend the day saying, “I am behind.”`,`🧠 Your body follows the second message.`],callout:`The action reveals the real assumption.`},{icon:'🔥',headline:`Confidence example`,copy:[`🔥 You picture yourself being seen.`,`🚫 Then you avoid the post, the call, the offer.`,`⚡ That means the old identity is still driving.`],callout:`Visualization must change your next move.`},{icon:'⚡',headline:`The 4-step practice`,copy:[`Use visualization like training, not entertainment.`],steps:[`🎬 Pick one finished scene.`,`😌 Feel relief, not hunger.`,`🌙 Repeat it before sleep.`,`⚡ Take one action from that state tomorrow.`]},{icon:'😌',headline:`Do not chase intensity`,copy:[`The goal is not to feel excited.`,`The goal is to make the new reality feel normal.`,`<span class='mark'>Normal is what the subconscious accepts.</span>`],callout:`Excitement spikes. Normal installs.`},{icon:'🎯',headline:`What actually changes?`,copy:[`This is the real mechanism.`],grid:[['good','👁️ Attention changes.'],['good','⚡ Behavior changes.'],['good','🧠 Identity changes.'],['good','📈 Your odds improve.']]},{icon:'🚫',headline:`Visualization works when it trains you`,copy:[`🚫 Not when it entertains you.`,`🚫 Not when it becomes escape.`,`✅ It works when it changes your next move.`],callout:`The method should change the operator.`},{icon:'🔥',headline:`The picture is not the power.<br>The state is.`,copy:[`Visualization works when it changes who you are being.`,`Not just what you are picturing.`,`Train the state. Then move from it.`],cta:`Subscribe for more real manifestation breakdowns.`}];let current=0;function initials(name){return name.split(' ').filter(Boolean).map(p=>p[0]).join('').slice(0,2).toUpperCase()}function badge(i){return `<div class='topbar'><div class='badge'><span>${String(i+1).padStart(2,'0')}</span> / <span class='total'>${slides.length}</span></div><div class='mini-icon'>${slides[i].icon||'🔥'}</div></div>`}function renderAuthorVisual(name){const photo=AUTHOR_PHOTOS[name];if(photo){return `<div class='author-photo-wrap'><img class='author-photo' src='${photo}' alt='${name} portrait' loading='lazy' referrerpolicy='no-referrer' onerror='this.parentElement.outerHTML="<div class=\'avatar-fallback\'>${initials(name)}</div>"'></div>`}return `<div class='avatar-fallback'>${initials(name)}</div>`}function renderSlide(s,i){let html=badge(i);html+=s.hero?`<h1>${s.headline}</h1>`:`<h2>${s.headline}</h2>`;if(s.copy)html+=`<div class='copy'>${s.copy.map(x=>`<p>${x}</p>`).join('')}</div>`;if(s.grid)html+=`<div class='grid'>${s.grid.map(([kind,text])=>`<div class='tile ${kind}'>${text}</div>`).join('')}</div>`;if(s.teacher)html+=`<div class='teacher-card'>${renderAuthorVisual(s.teacher.name)}<div><div class='teacher-label'>${s.teacher.name} ✦</div><div class='teacher-quote'>${s.teacher.quote}</div></div></div>`;if(s.callout)html+=`<div class='callout'><p>${s.callout}</p></div>`;if(s.steps)html+=`<div class='steps'>${s.steps.map((x,idx)=>`<div class='step'><div class='num'>${idx+1}</div><div>${x}</div></div>`).join('')}</div>`;if(s.pill)html+=`<div class='icon-lines'><div class='icon-line'><div class='icon-bubble'>✦</div><span>${s.pill}</span></div></div>`;if(s.cta)html+=`<div class='cta'>${s.cta}</div>`;return `<section class='slide'>${html}</section>`}function render(){document.getElementById('slides').innerHTML=slides.map(renderSlide).join('');document.getElementById('progress').innerHTML=slides.map(()=>`<div class='dot'></div>`).join('');showSlide(0)}function showSlide(i){current=(i+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((s,idx)=>{const on=idx===current;s.classList.toggle('active',on);s.style.display=on?'flex':'none';s.style.visibility=on?'visible':'hidden';s.style.opacity=on?'1':'0'});document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx<=current))}function nextSlide(){showSlide(current+1)}function prevSlide(){showSlide(current-1)}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')prevSlide()});render();</script></body></html>
