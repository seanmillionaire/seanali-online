<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanitation · full game local QA</title><link rel="stylesheet" href="/games/adventure/style.css"><link rel="stylesheet" href="/games/adventure/mobile-play.css"><link rel="stylesheet" href="/games/adventure/expedition.css"></head><body data-scene="explore"><main class="explore-world" id="host"></main><dialog id="dialog"></dialog><script type="module">
import {createExplore} from '/games/adventure/explore.js';import {createDelight} from '/games/adventure/delight.js';import {fresh,normalize} from '/games/adventure/state.js';import * as T from '/games/adventure/vendor/three.module.min.js';
const key='sanitation-complete-qa';let raw=null;try{raw=JSON.parse(localStorage.getItem(key));}catch{}const state=raw?normalize(raw):fresh();state.lang=new URLSearchParams(location.search).get('lang')==='es'?'es':'en';state.started=true;state.sound=false;state.world.flight=0;state.world.x=370;state.world.z=-54;
const save=()=>localStorage.setItem(key,JSON.stringify(state)),joy=createDelight({soundEnabled:()=>false,motionEnabled:()=>true,language:()=>state.lang});joy.setScene('explore');
const game=createExplore(document.querySelector('#host'),{state,save,joy,motion:()=>true,startInCityBalloon:false,openBook(){},openHome(){},load:async()=>({...T,WebGLRenderer:class extends T.WebGLRenderer{constructor(o){super(o);const render=this.render.bind(this);this.render=(scene,camera)=>{window.qaScene=scene;window.qaCamera=camera;render(scene,camera);};}}})});
window.qa={state,game,save,reset(){localStorage.removeItem(key);location.reload();},position(id){const p=window.qaScene.getObjectByName('Sanitation '+id);if(!p)throw Error('Station not found: '+id);state.world.x=p.position.x;state.world.z=p.position.z+1.8;return {x:state.world.x,z:state.world.z};},stations(){const result=[];window.qaScene.traverse(g=>{if(/^Sanitation (city|gorgona|colon|chiriqui|east)-\d$/.test(g.name))result.push({id:g.name.slice(11),x:g.position.x,z:g.position.z,visible:g.visible});});return result;}};
</script></body></html>
