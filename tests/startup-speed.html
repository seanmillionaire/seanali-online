<!doctype html><meta charset="utf-8"><title>Game startup timing</title><style>body{margin:0;background:#123;color:white;font:16px system-ui}iframe{width:100%;height:82vh;border:0}output{display:block;padding:8px}</style><button id="phone">Phone</button><button id="desktop">Desktop</button><button id="play">Measure Play</button><output id="result">Loading…</output><iframe src="/games/panama/"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('output'),start=performance.now();let entryMs=0,playStart=0,oldCanvas;
const poll=setInterval(()=>{const doc=frame.contentDocument;if(!doc)return;if(!entryMs&&doc.querySelector('.showcase-ready')){entryMs=Math.round(performance.now()-start);out.textContent='Entry ready: '+entryMs+' ms';}if(playStart&&doc.body.dataset.scene==='explore'&&doc.querySelector('.explore-ready')){out.textContent+=' · Play ready: '+Math.round(performance.now()-playStart)+' ms · Same canvas: '+(oldCanvas===doc.querySelector('canvas.explore-canvas'));playStart=0;}},50);
document.querySelector('#play').onclick=()=>{oldCanvas=frame.contentDocument.querySelector('canvas.explore-canvas');playStart=performance.now();frame.contentDocument.querySelector('.enter-world').click();};
document.querySelector('#phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px';};document.querySelector('#desktop').onclick=()=>{frame.style.width='1280px';frame.style.height='800px';};
</script>
