<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruta Tropical recording check</title><h1>🎶 Fruta Tropical</h1><button>Play supplied recording</button><output></output><script type="module">const audio=new Audio('/games/adventure/assets/audio/music/fruta-tropical.mp3');document.querySelector('button').onclick=()=>audio.play();setInterval(()=>{const r={playing:!audio.paused,time:audio.currentTime,duration:audio.duration,ready:audio.readyState,error:audio.error?.message||''};document.body.dataset.checks=JSON.stringify(r);document.querySelector('output').textContent=JSON.stringify(r);},250);addEventListener('pagehide',()=>audio.pause());</script>
