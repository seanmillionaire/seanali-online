<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorded city sound check</title><style>body{font:18px system-ui;padding:30px;background:#edf2ea;color:#193b3b}button{font:inherit;padding:16px;margin:6px}output{display:block;white-space:pre-wrap;margin:20px}</style><h1>🚓 Recorded city sounds</h1><button id="check">Verify recorded audio</button><button id="horn">📣 Horn</button><button id="siren">🚨 Siren</button><button id="engine">🚙 Engine</button><button id="mute">🔇 Stop / mute</button><output id="status">Ready</output><script type="module">
import {createDelight} from '/games/adventure/delight.js?v=207';
let enabled=true;const joy=createDelight({soundEnabled:()=>enabled,motionEnabled:()=>false}),out=document.querySelector('output');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#check').onclick=async()=>{try{enabled=true;joy.gesture();joy.sync();const ctx=new AudioContext();const info=[];for(const name of ['horn','siren','engine','footsteps','crash','splash']){const r=await fetch('/games/adventure/assets/audio/'+name+'.mp3');if(!r.ok)throw Error(name+' missing');const b=await ctx.decodeAudioData(await r.arrayBuffer());let peak=0;for(const n of b.getChannelData(0))peak=Math.max(peak,Math.abs(n));if(peak<.001||b.duration<.1)throw Error(name+' silent');info.push(name+': '+b.duration.toFixed(2)+' seconds');}await ctx.close();await wait(1000);if(!joy.recordedSound('horn'))throw Error('recorded horn did not start');enabled=false;joy.sync();await wait(100);if(joy.voiceCount)throw Error('mute left playing voices');out.textContent='PASS six recordings decode and contain audio; playback starts; mute stops active voices.\n'+info.join('\n');}catch(e){out.textContent='FAIL '+e.message;}};
for(const name of ['horn','siren','engine'])document.querySelector('#'+name).onclick=()=>{enabled=true;joy.gesture();joy.sync();if(name==='engine')joy.carEngine(15,true);else joy.recordedSound(name,{volume:.4,duration:name==='siren'?7:null,offset:name==='siren'?10:0});};document.querySelector('#mute').onclick=()=>{enabled=false;joy.sync();};window.addEventListener('pagehide',()=>joy.destroy());
</script>
