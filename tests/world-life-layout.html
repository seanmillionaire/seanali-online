<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#102f3b;color:white;font:14px system-ui}nav{height:45px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}button{padding:6px;border-radius:5px;border:0}#frame{border:0;transform-origin:top left}#wrap{margin:auto;overflow:hidden}</style></head><body><nav><button onclick="size(1280,800)">Desktop</button><button onclick="size(768,1024)">Tablet</button><button onclick="size(390,844)">Phone</button><button onclick="act('beach')">Day</button><button onclick="act('night')">Night</button><button onclick="act('island')">Island</button><button onclick="act('traffic')">Traffic</button><button onclick="act('city')">City</button><button onclick="act('clean')">Clean</button><button onclick="act('verify')">Verify</button><output id="viewport"></output></nav><div id="wrap"><iframe id="frame" src="world-life-preview.html"></iframe></div><script>const frame=document.querySelector('#frame');function size(w,h){const scale=Math.min(innerWidth/w,(innerHeight-60)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.querySelector('#wrap').style.width=w*scale+'px';document.querySelector('#wrap').style.height=h*scale+'px';document.querySelector('#viewport').textContent=w+' × '+h;}function act(id){frame.contentDocument.querySelector('#'+id).click();}size(1280,800);</script></body></html>
