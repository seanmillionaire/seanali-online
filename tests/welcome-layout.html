<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#102f3b;color:white;font:14px system-ui}nav{height:45px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}button{padding:6px;border-radius:5px;border:0}#frame{border:0;transform-origin:top left}#wrap{margin:auto;overflow:hidden}</style></head><body><nav><button onclick="size(1280,800)">Desktop</button><button onclick="size(390,844)">Phone</button><button onclick="size(320,568)">Small phone</button><button onclick="verifyWelcome()">Verify welcome</button><output id="result"></output><output id="viewport"></output></nav><div id="wrap"><iframe id="frame" src="/games/panama/"></iframe></div><script>let savedBefore=null;async function verifyWelcome(){const d=frame.contentDocument;try{if(localStorage.getItem('isla-adventure-v1')!==savedBefore)throw Error('preview changed saved progress');if(d.querySelector('.welcome-world canvas'))throw Error('landing constructed the full world before Play');for(const [w,h]of [[320,568],[375,667],[390,844],[430,844],[768,1024],[1280,800]]){size(w,h);await new Promise(r=>setTimeout(r,160));const r=d.querySelector('.enter-world').getBoundingClientRect();if(r.left<0||r.right>w+1||r.bottom>h+1)throw Error('Play outside '+w);if(d.documentElement.scrollWidth>w+1)throw Error('Horizontal overflow '+w);const brand=d.querySelector('.brand').getBoundingClientRect(),tools=d.querySelector('.tools').getBoundingClientRect();if(brand.right>tools.left+2)throw Error('Header overlap '+w);}document.querySelector('#result').textContent='PASS 320–1280: Play visible, no horizontal overflow or header overlap; lightweight landing and save preserved';}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;}}const frame=document.querySelector('#frame');frame.addEventListener('load',()=>{savedBefore=localStorage.getItem('isla-adventure-v1');});function size(w,h){const scale=Math.min(innerWidth/w,(innerHeight-60)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';document.querySelector('#wrap').style.width=w*scale+'px';document.querySelector('#wrap').style.height=h*scale+'px';document.querySelector('#viewport').textContent=w+' × '+h;}function act(id){frame.contentDocument.querySelector('#'+id).click();}size(1280,800);</script></body></html>
