<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/games/adventure/style.css?v=227"><link rel="stylesheet" href="/games/adventure/mobile-play.css"><link rel="stylesheet" href="/games/adventure/expedition.css?v=233"></head><body data-scene="explore"><main class="explore-world"></main><aside style="position:fixed;top:55px;left:10px;z-index:1000;padding:8px;background:white;max-width:90vw"><button id="city">City approach</button><button id="middle">Gorgona highway</button><button id="volcan">Volcán turnoff</button><button id="drive">Driving view</button><button id="verify">Verify driving</button><button id="hide">Hide checks</button><output id="result">Loading…</output></aside><script type="module">
import * as T from '/games/adventure/vendor/three.module.min.js';import {fresh} from '/games/adventure/state.js?v=225';import {createExplore} from '/games/adventure/explore.js?v=225';import {HIGHWAY_CURVES} from '/games/adventure/explore-state.js?v=225';
const state=fresh();state.lang='en';state.world.dayTime=75;let scene,view=true,site,errors=[];const wait=ms=>new Promise(r=>setTimeout(r,ms)),out=document.querySelector('output');function locate(route,want){const path=HIGHWAY_CURVES[route];let i=1;for(let j=1;j<path.length-1;j++)if(Math.abs(path[j][0]-want)<Math.abs(path[i][0]-want))i=j;const p=path[i],a=path[i-1],b=path[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]),nx=(b[1]-a[1])/l,nz=-(b[0]-a[0])/l;site={x:p[0],z:p[1]};Object.assign(state.world.city.car,{x:p[0]+nx*2.3,z:p[1]+nz*2.3,heading:Math.atan2(b[0]-a[0],b[1]-a[1])});state.world.x=state.world.city.car.x+2;state.world.z=state.world.city.car.z;}
locate('cityToBaru',-190);addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const W={...T,WebGLRenderer:class extends T.WebGLRenderer{constructor(o){super(o);const render=this.render.bind(this);this.render=(s,c)=>{scene=s;if(view){const v=c.clone(),car=s.getObjectByName('Angelique’s golden Lamborghini'),y=car?.position.y||1;v.position.set(site.x+19,y+30,site.z+28);v.lookAt(site.x,y,site.z);render(s,v);}else render(s,c);};}}};
const game=createExplore(document.querySelector('main'),{state,save(){},joy:{effect(){},gesture(){},note(){},boat(){}},motion:()=>true,load:()=>Promise.resolve(W),openBook(){},openHome(){}});function jump(route,x){const exit=[...document.querySelectorAll('button')].find(b=>!b.hidden&&b.textContent.includes('Get out of car'));exit?.click();locate(route,x);view=true;}
document.querySelector('#city').onclick=()=>jump('cityToGorgona',245);document.querySelector('#middle').onclick=()=>jump('cityToBaru',-190);document.querySelector('#volcan').onclick=()=>jump('cityToBaru',-370);document.querySelector('#drive').onclick=()=>view=false;document.querySelector('#hide').onclick=()=>document.querySelector('aside').hidden=true;
document.querySelector('#verify').onclick=async()=>{try{const car=scene.getObjectByName('Angelique’s golden Lamborghini'),button=[...document.querySelectorAll('button')].find(b=>!b.hidden&&b.textContent.includes('Drive Lamborghini'));if(!button)throw Error('drive action missing');button.click();const start=car.position.clone();document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await wait(1100);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowLeft',bubbles:true}));if(car.position.distanceTo(start)<20)throw Error('car blocked on widened highway');if(errors.length)throw Error(errors.join('; '));out.textContent='PASS driving along four-lane highway, no rendering/runtime errors';}catch(e){out.textContent='FAIL '+e.message;}};
for(let i=0;i<400&&!scene?.getObjectByName('Angelique’s golden Lamborghini');i++)await wait(100);out.textContent=scene?'Ready':'FAIL world load';
</script></body></html>
