import {CITY_ALL_PLOTS} from '/games/adventure/city-layout.js?v=221';

const errors=[];window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const state=fresh();state.lang='en';let scene,camera,lastSave;
const W={...T,WebGLRenderer:class extends T.WebGLRenderer{constructor(o){super(o);this.debug.onShaderError=(gl,p)=>errors.push('Shader: '+gl.getProgramInfoLog(p));const render=this.render.bind(this);this.render=(s,c)=>{scene=s;camera=c;render(s,c);};}}};

const status=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));

function rewardPosition(name){const root=scene.getObjectByName('Main road destination rewards'),g=root.children.find(g=>g.name===name);if(!g)throw Error('Missing '+name);return g.position;}
 document.querySelector('#volcanReward').onclick=()=>{const p=rewardPosition('Volcán scooter');move(p.x,p.z+3);};
 document.querySelector('#rewards').onclick=async()=>{try{
 closePanels();const root=scene.getObjectByName('Main road destination rewards');if(root.children.length!==7)throw Error('Missing road rewards');
 let p=rewardPosition('Volcán scooter');move(p.x,p.z+3);await wait(500);document.querySelector('.world-action[data-words*="Use"]').click();await wait(200);if(state.world.travelMode!=='scooter')throw Error('scooter did not activate');const start=state.world.x;document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(600);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));if(Math.abs(state.world.x-start)<1)throw Error('scooter did not move');
 p=rewardPosition('Jet ski');move(p.x,p.z+3);await wait(500);document.querySelector('.world-action[data-words*="Use"]').click();await wait(400);if(!scene.getObjectByName('Rideable coastal jet ski').visible)throw Error('jet ski did not board');document.querySelector('.world-jump').click();await wait(400);if(Math.hypot(state.world.x-p.x,state.world.z-p.z)>5)throw Error('jet ski shore return failed');
 p=rewardPosition('Barú sky ride');move(p.x,p.z+3);await wait(500);document.querySelector('.world-action[data-words*="Use"]').click();await wait(900);if(!state.world.flight)throw Error('balloon did not launch');if(errors.length)throw Error(errors.join(';'));status.textContent='PASS seven visible rewards, scooter rides, jet ski boards and returns to shore, Barú balloon launches; no browser errors';
 }catch(e){status.textContent='FAIL '+e.message;throw e;}};
document.querySelector('#collision').onclick=async()=>{
 try{
 closePanels();move(CITY_HOSPITAL.x,CITY_HOSPITAL.z+8);await wait(300);
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));await wait(1800);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true}));
 if(state.world.z<CITY_HOSPITAL.z+4.7)throw Error('walk entered hospital');
 const air=createCityAirCollision(T,scene,()=>0),tower=air.boxes.find(p=>p.id==='tower');if(tower.top<12)throw Error('tower height missing');
 move(tower.x,tower.z+14);state.world.friends.called=['ollie'];await wait(700);const mount=document.querySelector('.animal-ride-quick');if(mount.hidden)throw Error('bird unavailable');mount.click();await wait(1400);
 state.world.x=tower.x;state.world.z=tower.z+14;
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));await wait(2200);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true}));
 if(state.world.z<tower.z+tower.d/2+1)throw Error('bird entered tower');
 if(errors.length)throw Error(errors.join(';'));status.textContent='PASS actual hospital walking barrier and mounted bird blocked by tower; road clearance and fast car controller covered by unit tests';
 }catch(e){status.textContent='FAIL '+e.message;throw e;}
};
document.querySelector('#verify').onclick=async()=>{
 try{closePanels();if(errors.length)throw Error(errors[0]);const root=scene.getObjectByName('Living Panama · visitors traffic and flyovers');if(!root)throw Error('ambience missing');const people=root.children.filter(c=>c.name.startsWith('Visitor · ')),cars=root.children.filter(c=>c.name.startsWith('Roaming car · '));if(cars.length!==16||people.length<25)throw Error('population missing');
 move(4,10);await wait(300);const start=state.world.z;document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));await wait(1000);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true}));if(Math.abs(state.world.z-start)<.1)throw Error('walking did not move');
 move(4,10);document.querySelector('.camera-view-toggle').click();await wait(400);const position={x:state.world.x,z:state.world.z},direction=new T.Vector3();camera.getWorldDirection(direction);const beforeDirection=direction.clone();document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(700);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));await wait(300);camera.getWorldDirection(direction);if(direction.distanceTo(beforeDirection)<.1)throw Error('right arrow did not turn first person');if(Math.hypot(state.world.x-position.x,state.world.z-position.z)>.05)throw Error('turning strafes');document.querySelector('.camera-view-toggle').click();
 move(345,-61);Object.assign(state.world.city.car,{x:345,z:-61,heading:Math.PI/2});await wait(400);
 const drive=document.querySelector('.world-action[data-words*="Drive car"]');if(!drive||drive.hidden)throw Error('drive action missing');drive.click();const carX=state.world.city.car.x;document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(900);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));if(state.world.city.car.x<=carX+.05)throw Error('driving did not move');document.querySelector('.world-action[data-words*="Get out of car"]')?.click();
 move(4,10,180);await wait(400);if(!scene.getObjectByName('Moon').visible||scene.getObjectByName('Sun').visible)throw Error('moon state wrong');if(!scene.background.isColor||scene.background.r<.12)throw Error('night too dark');
 for(const selector of ['.mobile-dock-map','.mobile-dock-build','.mobile-dock-friend']){document.querySelector(selector)?.click();await wait(100);closePanels();document.querySelector('.friend-close')?.click();}
 const explorer=scene.getObjectByName('Angelique');if(explorer.userData.humanRig)throw Error('Angelique replaced by NPC');if(!explorer.children.some(o=>o.isMesh&&o.material.color.getHexString()==='b8a6d7'))throw Error('original lavender outfit missing');if(!scene.environment||!scene.getObjectByName('Tropical atmospheric sky'))throw Error('atmosphere missing');
 const maps=new Set();scene.traverse(o=>{for(const m of Array.isArray(o.material)?o.material:[o.material])if(m?.map?.image?.currentSrc?.includes('/assets/terrain/'))maps.add(m.map.image.currentSrc);});if(maps.size<4)throw Error('local material maps missing: '+maps.size);
 if(!document.querySelector('.mobile-dock-icon svg'))throw Error('new control icons missing');
 if(parent!==window){for(const [w,h]of [[320,568],[375,667],[390,844],[430,844],[768,1024],[1280,800]]){parent.size(w,h);await wait(220);for(const selector of ['.mobile-dock-map','.mobile-dock-build','.mobile-dock-friend','.explore-stick']){const r=document.querySelector(selector).getBoundingClientRect();if(r.width<44||r.height<44||r.left<-.1||r.right>innerWidth+.1||r.bottom>innerHeight+.1)throw Error('control bounds '+selector+' '+w);}}}
 const mounted=document.querySelector('.animal-ride-quick');if(mounted&&!mounted.hidden&&/Dismount|Bajar/.test(mounted.dataset.words))mounted.click();if(errors.length)throw Error(errors[0]);move(4,10);status.textContent='PASS: local textures, sky, original Angelique, first-person turning, SVG controls, driving, six viewport sizes; '+cars.length+' cars, '+people.length+' visitors, walking, moonlit night, map/bag/friends. Saved inventory '+state.world.food.banana+'/'+state.world.food.coconut;
 }catch(e){status.textContent='FAIL: '+e.message;throw e;}
};

</script></body></html>
