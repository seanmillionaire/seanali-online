<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/games/adventure/style.css?v=227"><link rel="stylesheet" href="/games/adventure/mobile-play.css"><link rel="stylesheet" href="/games/adventure/expedition.css?v=233"></head><body data-scene="explore"><main class="explore-world"></main><aside style="position:fixed;top:50px;left:10px;z-index:1000;background:white;padding:8px;max-width:90vw"><button id="yard">Yard view</button><button id="car">Car detail</button><button id="verify">Verify garage</button><button id="balloon">Visit yard balloon</button><button id="clean">Hide checks</button><output id="result">Loading…</output></aside><script type="module">
import * as T from '/games/adventure/vendor/three.module.min.js';import {fresh,normalize} from '/games/adventure/state.js?v=225';import {createExplore} from '/games/adventure/explore.js?v=225';import {chooseHome,homeLot,homeYard} from '/games/adventure/mansion-state.js?v=225';import {createDelight} from '/games/adventure/delight.js?v=225';
const state=fresh();state.lang='en';chooseHome(state.world,new URLSearchParams(location.search).get('lot')||'gorgona','immediate',0);const lot=homeLot(state.world),yard=homeYard(lot);state.world.x=yard.car.x+2;state.world.z=yard.car.z;state.world.dayTime=90;let scene,view='yard',saved,errors=[];const out=document.querySelector('output'),wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(b,m)=>{if(!b)throw Error(m);};addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const W={...T,WebGLRenderer:class extends T.WebGLRenderer{constructor(o){super(o);const render=this.render.bind(this);this.render=(s,c)=>{scene=s;if(view){const camera=c.clone(),car=s.getObjectByName('Angelique’s golden Lamborghini'),y=car?.position.y||0;if(view==='car'&&car){camera.position.set(car.position.x+5,y+2.5,car.position.z+6);camera.lookAt(car.position.x,y+.15,car.position.z);}else{camera.position.set(lot.x+39,y+35,lot.z+66);camera.lookAt(lot.x,y+3,lot.z+10);}render(s,camera);}else render(s,c);};}}};
const joy=createDelight({soundEnabled:()=>true,motionEnabled:()=>true});joy.setScene('explore');const game=createExplore(document.querySelector('main'),{state,save(){saved=JSON.stringify(state);},joy,motion:()=>true,load:()=>Promise.resolve(W),openBook(){},openHome(){}});document.querySelector('#yard').onclick=()=>view='yard';document.querySelector('#car').onclick=()=>view='car';document.querySelector('#balloon').onclick=()=>{view=null;state.world.x=yard.balloon.x;state.world.z=yard.balloon.z;};document.querySelector('#clean').onclick=()=>document.querySelector('aside').hidden=true;
const key=(type,key)=>document.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true}));
document.querySelector('#verify').onclick=async()=>{try{joy.gesture();const car=scene.getObjectByName('Angelique’s golden Lamborghini');assert(car,'gold car exists');let cars=0;scene.traverse(o=>{if(o.name==='Angelique’s golden Lamborghini')cars++;});assert(cars===1,'one saved car');assert(Math.hypot(car.position.x-yard.car.x,car.position.z-yard.car.z)<.1,'parked in driveway');assert(scene.getObjectByName('Mansion yard balloon'),'yard balloon stays present');const drive=[...document.querySelectorAll('button')].find(b=>!b.hidden&&b.textContent.includes('Drive Lamborghini'));assert(drive,'nearby drive action');drive.click();const x=state.world.city.car.x;key('keydown','ArrowLeft');await wait(750);key('keyup','ArrowLeft');assert(Math.abs(state.world.city.car.x-x)>12,'fast driving on grass');assert(car.children.filter(o=>o.name==='Rear exhaust flame').every(f=>f.visible),'moving exhaust flames');await wait(150);assert(car.children.filter(o=>o.name==='Rear exhaust flame').every(f=>!f.visible),'flames stop when parked');assert(scene.getObjectByName('Mansion yard balloon'),'balloon remains home after driving');key('keydown',' ');key('keyup',' ');const reloaded=normalize(JSON.parse(saved));assert(reloaded.world.mansion.lot===lot.id,'home save retained');assert(Number.isFinite(reloaded.world.city.car.x),'car position retained');assert(!errors.length,errors.join('; '));out.textContent='PASS single parked gold car, grass driving, twin moving flames, braking, permanent yard balloon, saved home/car, no runtime errors';}catch(e){out.textContent='FAIL '+e.message;console.error(e);}};
for(let i=0;i<400&&!scene?.getObjectByName('Angelique’s golden Lamborghini');i++)await wait(100);out.textContent=scene?'Ready':'FAIL world loading';
</script></body></html>
