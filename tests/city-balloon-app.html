<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/games/adventure/style.css?v=227"><link rel="stylesheet" href="/games/adventure/mobile-play.css?v=195"><link rel="stylesheet" href="/games/adventure/expedition.css?v=248"><div id="app"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module">
import {fresh,SAVE_KEY} from '/games/adventure/state.js';import {chooseHome} from '/games/adventure/mansion-state.js';
const initial=fresh();initial.lang='en';initial.started=true;initial.sound=false;chooseHome(initial.world,'boquete','immediate',0);Object.assign(initial.world,{x:-385,z:-30,flight:0,dayTime:60});initial.world.food.banana=19;const memory=new Map([[SAVE_KEY,JSON.stringify(initial)],['isla-adventure-camera-v1','close']]);Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear()}});
