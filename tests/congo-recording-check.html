<!doctype html><meta charset="utf-8"><title>Congo recording check</title><h1>🥁 Los Congos de Panamá</h1><button>Play and measure rhythm</button><output></output><script>const audio=new Audio('/games/adventure/assets/audio/music/viene-la-ola.mp3');let beats=[],duration=0,error='';document.querySelector('button').onclick=async()=>{try{await audio.play();const ctx=new AudioContext(),r=await fetch(audio.src),b=await ctx.decodeAudioData(await r.arrayBuffer());duration=b.duration;const a=b.getChannelData(0),stride=Math.round(b.sampleRate*.025),energy=[];for(let i=0;i<a.length;i+=stride){let sum=0;for(let j=i;j<Math.min(a.length,i+stride);j++)sum+=a[j]*a[j];energy.push(Math.sqrt(sum/stride));}const flux=energy.map((v,i)=>Math.max(0,v-energy[Math.max(0,i-1)])),peak=Math.max(...flux);for(let i=1;i<flux.length-1;i++)if(flux[i]>.13*peak&&flux[i]>=flux[i-1]&&flux[i]>flux[i+1]&&(!beats.length||i*.025-beats.at(-1)>.22))beats.push(Math.round(i*25)/1000);ctx.close();}catch(e){error=String(e);}};setInterval(()=>{const report={playing:!audio.paused,time:audio.currentTime,duration,ready:audio.readyState,beats,error};document.body.dataset.checks=JSON.stringify(report);document.querySelector('output').textContent=JSON.stringify({...report,beats:beats.length});},250);addEventListener('pagehide',()=>audio.pause());</script>
