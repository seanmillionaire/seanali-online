<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/games/adventure/style.css?v=227"><link rel="stylesheet" href="/games/adventure/mobile-play.css?v=195"><link rel="stylesheet" href="/games/adventure/expedition.css?v=248"><div id="app"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module">
import {fresh,SAVE_KEY} from '/games/adventure/state.js';import {chooseHome} from '/games/adventure/mansion-state.js';
const initial=fresh();initial.lang='en';initial.started=true;initial.sound=true;chooseHome(initial.world,'boquete','immediate',0);Object.assign(initial.world,{x:-385,z:-30,flight:0,dayTime:20});initial.world.food.banana=19;const memory=new Map([[SAVE_KEY,JSON.stringify(initial)],['isla-adventure-camera-v1','close']]);Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear()}});
const media=[],samples=[];let latestGain;const BaseContext=window.AudioContext;window.AudioContext=class extends BaseContext{createGain(){const g=super.createGain();latestGain=g;return g;}createMediaElementSource(audio){media.push({audio,gain:latestGain});return super.createMediaElementSource(audio);}};
const errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const manifest=await (await fetch('/games/adventure/bundle-manifest.json')).json();await import('/games/adventure/app.bundle.js?v='+manifest.digest.slice(0,12));setInterval(()=>{const world=document.querySelector('.explore-world'),view=world?.style.getPropertyValue('--welcome-view'),track=media.find(p=>p.audio.src.includes('panama-morning-theme'));if(view)samples.push({view:Number(view),gain:track?.gain.gain.value||0,time:track?.audio.currentTime||0});const s=JSON.parse(memory.get(SAVE_KEY)),report={viewport:[innerWidth,innerHeight],scene:document.body.dataset.scene,ready:!!document.querySelector('.explore-ready'),x:s.world.x,z:s.world.z,flight:s.world.flight,home:s.world.mansion.lot,stage:s.world.mansion.stage,banana:s.world.food.banana,tracks:media.map(p=>({src:p.audio.src,time:p.audio.currentTime,gain:p.gain.gain.value,paused:p.audio.paused})),samples:samples.slice(0,25),errors};document.body.dataset.checks=JSON.stringify(report);if(parent!==window)parent.postMessage({balloonReport:report},location.origin);},500);
</script>
