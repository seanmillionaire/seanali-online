<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/games/adventure/style.css?v=227"><style>body{background:#b7d5cc;padding:16px}.explore-panel{position:relative;inset:auto;margin:auto;max-width:430px;max-height:90vh}nav{display:flex;gap:10px;justify-content:center;margin-bottom:12px}button{min-height:44px}output{display:block;text-align:center}</style><nav><button id="ice">🍧 Raspao</button><button id="chef">🍳 Chef</button></nav><output id="status">Choose an order · 20 coins</output><section class="explore-panel" id="panel"></section><script type="module">
import {watchFoodPreparation} from '/games/adventure/street-food-preparation.js';

</script>
