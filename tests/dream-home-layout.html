<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#303b4f}nav{display:flex;gap:8px;padding:8px;background:#fff}button{min-height:44px}iframe{border:0;display:block;margin:auto;width:1280px;height:800px}</style><nav><button onclick="size(390,844)">Phone</button><button onclick="size(1280,800)">Desktop</button><button id="check">Check all sizes</button><output id="result"></output></nav><iframe id="f" src="/tests/dream-home-preview.html"></iframe><script>function size(w,h){f.style.width=w+'px';f.style.height=h+'px'}document.querySelector('#check').onclick=async()=>{try{for(const [w,h]of [[320,568],[375,667],[390,844],[430,844],[768,1024],[1280,800]]){size(w,h);await new Promise(r=>setTimeout(r,160));const p=f.contentDocument.querySelector('.explore-panel:not([hidden])');if(!p)throw Error('Open an activity first');const b=p.getBoundingClientRect();if(b.left<0||b.right>w+1||b.top<0||b.bottom>h+1||p.scrollWidth>p.clientWidth+1)throw Error('Overflow '+w);if([...p.querySelectorAll('button')].some(e=>e.getBoundingClientRect().height<44))throw Error('Touch target '+w);}result.textContent='PASS 320, 375, 390, 430, 768, 1280: bounds, no horizontal overflow, 44px controls';}catch(e){result.textContent='FAIL '+e.message;}}</script>
