<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">The Borrowed Map Test</title>
  <desc id="desc">A four-part framework for checking whether a life goal came from an old rule or a chosen direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ef"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#101010" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="42" fill="url(#bg)"/>
  <text x="700" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#101010">The Borrowed Map Test</text>
  <text x="700" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#525b66">Before you chase the goal, check the map.</text>
  <g filter="url(#shadow)">
    <rect x="86" y="238" width="278" height="292" rx="28" fill="#ffffff"/>
    <rect x="407" y="238" width="278" height="292" rx="28" fill="#ffffff"/>
    <rect x="728" y="238" width="278" height="292" rx="28" fill="#ffffff"/>
    <rect x="1049" y="238" width="278" height="292" rx="28" fill="#ffffff"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="225" cy="302" r="32" fill="#ff542e"/>
    <text x="225" y="313" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">1</text>
    <text x="225" y="372" text-anchor="middle" font-size="32" font-weight="900" fill="#101010">Source</text>
    <text x="225" y="417" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">Where did this rule</text>
    <text x="225" y="449" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">come from?</text>
    <circle cx="546" cy="302" r="32" fill="#1f62ff"/>
    <text x="546" y="313" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">2</text>
    <text x="546" y="372" text-anchor="middle" font-size="32" font-weight="900" fill="#101010">Cost</text>
    <text x="546" y="417" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">What does obeying it</text>
    <text x="546" y="449" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">keep costing me?</text>
    <circle cx="867" cy="302" r="32" fill="#0f9f6e"/>
    <text x="867" y="313" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">3</text>
    <text x="867" y="372" text-anchor="middle" font-size="32" font-weight="900" fill="#101010">Truth</text>
    <text x="867" y="417" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">Would I choose it</text>
    <text x="867" y="449" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">today?</text>
    <circle cx="1188" cy="302" r="32" fill="#df1722"/>
    <text x="1188" y="313" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff">4</text>
    <text x="1188" y="372" text-anchor="middle" font-size="32" font-weight="900" fill="#101010">Move</text>
    <text x="1188" y="417" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">What choice proves</text>
    <text x="1188" y="449" text-anchor="middle" font-size="22" font-weight="750" fill="#4d5662">the new map?</text>
  </g>
  <path d="M371 384H398" stroke="#101010" stroke-width="8" stroke-linecap="round"/>
  <path d="M692 384H719" stroke="#101010" stroke-width="8" stroke-linecap="round"/>
  <path d="M1013 384H1040" stroke="#101010" stroke-width="8" stroke-linecap="round"/>
  <rect x="314" y="612" width="772" height="74" rx="37" fill="#101010"/>
  <text x="700" y="659" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="850" fill="#ffffff">Keep the goal. Change the reason. Or release the map.</text>
</svg>
