<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Law of Assumption vs Law of Attraction in 3 Steps</title>
  <desc id="desc">Custom SeanAli.online thumbnail using a real Sean Ali ocean laptop photo with readable title text: Assume, Align, Act.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#080a12" stop-opacity=".92"/>
      <stop offset=".58" stop-color="#080a12" stop-opacity=".60"/>
      <stop offset="1" stop-color="#080a12" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff542e"/>
      <stop offset="1" stop-color="#ff9a22"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>
  <image href="/assets/sean-life/sean-laptop-ocean-view.jpg" width="1200" height="1600" y="-385" preserveAspectRatio="xMidYMin slice"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <rect x="70" y="54" width="318" height="52" rx="26" fill="url(#warm)" filter="url(#softShadow)"/>
  <text x="96" y="88" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">UNIVERSAL LAWS</text>
  <text x="70" y="182" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="900">Law of Assumption</text>
  <text x="70" y="260" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="900">vs Law of Attraction</text>
  <text x="70" y="343" fill="#ffe6d7" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="900">Assume. Align. Act.</text>
  <rect x="70" y="406" width="590" height="74" rx="37" fill="#fff" opacity=".96"/>
  <text x="102" y="453" fill="#111" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">3-step practice without passive waiting</text>
  <text x="72" y="566" fill="#fff" opacity=".9" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="2">SEANALI.ONLINE</text>
</svg>
