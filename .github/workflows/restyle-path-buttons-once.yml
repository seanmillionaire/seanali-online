name: Restyle path buttons once

on:
  push:
    paths:
      - '.github/path-button-restyle-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle path buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('links.html')
          html = p.read_text()

          for css in [
            '.path-number{display:inline-flex;align-items:center;justify-content:center;margin-bottom:7px;padding:5px 9px;border-radius:999px;font-size:10px;line-height:1;font-weight:950;letter-spacing:.11em;text-transform:uppercase}\n',
            '.path-number.money{background:#e8f8ee;color:#08763d;border:1px solid #bde8cd}\n',
            '.path-number.peace{background:#eaf4ff;color:#075fb8;border:1px solid #bddcff}\n',
            '.path-number.change{background:#f7eafe;color:#8b2bb0;border:1px solid #e2bdf3}\n',
          ]:
              html = html.replace(css, '')

          html = html.replace('<span class="path-number money">Path 1</span>', '')
          html = html.replace('<span class="path-number peace">Path 2</span>', '')
          html = html.replace('<span class="path-number change">Path 3</span>', '')

          old = '.link-card{position:relative;display:grid;grid-template-columns:52px 1fr 24px;gap:14px;align-items:center;min-height:88px;padding:16px 18px;border:1px solid #d8d2c8;border-radius:12px;background:rgba(255,255,255,.96);text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.055);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}'
          new = '.link-card{position:relative;display:grid;grid-template-columns:52px 1fr 38px;gap:14px;align-items:center;min-height:92px;padding:16px 18px;border:2px solid #d0cac1;border-radius:14px;background:#fff;text-decoration:none;box-shadow:0 8px 0 #d8d2c8,0 16px 28px rgba(0,0,0,.08);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}'
          html = html.replace(old, new)

          old = '.link-card:hover,.link-card:focus-visible{transform:translateY(-3px);border-color:#aaa39a;box-shadow:0 18px 36px rgba(0,0,0,.1);outline:none}'
          new = '.link-card:hover,.link-card:focus-visible{transform:translateY(-2px);border-color:#9f978c;box-shadow:0 6px 0 #bfb7ac,0 18px 32px rgba(0,0,0,.12);outline:none}.link-card:active{transform:translateY(4px);box-shadow:0 2px 0 #bfb7ac,0 8px 16px rgba(0,0,0,.08)}'
          html = html.replace(old, new)

          old = '.link-card.featured{border:2px solid var(--orange);background:linear-gradient(135deg,#fff 0%,#fff7f1 100%);box-shadow:0 16px 34px rgba(255,84,46,.14)}'
          new = '.link-card.featured{border-color:var(--orange);background:linear-gradient(135deg,#fff 0%,#fff7f1 100%);box-shadow:0 8px 0 #ffb299,0 16px 30px rgba(255,84,46,.16)}'
          html = html.replace(old, new)

          html = html.replace('.arrow{color:#777;font-size:22px;font-weight:900;text-align:right}', '.arrow{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#151515;color:#fff;font-size:24px;font-weight:900;text-align:center;line-height:1;box-shadow:0 5px 12px rgba(0,0,0,.18)}')
          html = html.replace('.featured .arrow{color:var(--orange)}', '.featured .arrow{background:var(--orange);color:#fff}')

          p.write_text(html)
          PY
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/restyle-path-buttons-once.yml .github/path-button-restyle-trigger.txt
          git add links.html .github/workflows/restyle-path-buttons-once.yml .github/path-button-restyle-trigger.txt
          git commit -m "Restyle path choices as buttons"
          git push
