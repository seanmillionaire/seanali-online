name: Update links subheadline

on:
  push:
    paths:
      - '.github/workflows/update-links-subheadline.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace links page subheadline
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('links.html')
          text = path.read_text(encoding='utf-8')
          old = '<p class="bio">Choose what you want to change. Start with the path that fits your life right now.</p>'
          new = '<p class="bio">Reclaim Your Freedom And Manifest Lifelong Abundance</p>'
          if old not in text:
              raise SystemExit('Expected links-page subheadline was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/update-links-subheadline.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/update-links-subheadline.yml
          git commit -m "Match links subheadline to homepage hero"
          git push