name: Remove Links Footer Once

on:
  push:
    paths:
      - '.github/remove-links-footer-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove lower links block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('links.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('  <div class="section-label">Follow Sean</div>')
          end_marker = '  <footer class="footer">© 2026 Sean Ali. Mind. Money. Identity. Freedom.</footer>'
          end = s.find(end_marker)
          if start == -1 or end == -1:
              raise SystemExit('Target lower block not found')
          end += len(end_marker)
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time files
        run: |
          rm -f .github/workflows/remove-links-footer-once.yml
          rm -f .github/remove-links-footer-trigger
      - name: Commit live change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/remove-links-footer-once.yml .github/remove-links-footer-trigger
          git commit -m "Remove lower links page footer block"
          git push
