name: Remove path number labels once

on:
  push:
    paths:
      - '.github/path-label-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('links.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n\.path-number\{[^\n]*\}\n\.path-number\.money\{[^\n]*\}\n\.path-number\.peace\{[^\n]*\}\n\.path-number\.change\{[^\n]*\}', '', s)
          s = s.replace('<span class="path-number money">Path 1</span>', '')
          s = s.replace('<span class="path-number peace">Path 2</span>', '')
          s = s.replace('<span class="path-number change">Path 3</span>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/remove-path-number-labels-once.yml .github/path-label-trigger.txt
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add links.html .github/workflows/remove-path-number-labels-once.yml .github/path-label-trigger.txt
          git diff --cached --quiet || git commit -m "Remove path number labels"
          git push
