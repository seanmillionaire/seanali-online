name: Fix links path selector

on:
  push:
    paths:
      - '.github/path-selector-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch links opt-in behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('links.html')
          s = p.read_text(encoding='utf-8')

          old_form = '<form class="optin-form" id="main-optin-form" method="post" action="https://www.aweber.com/scripts/addlead.pl">'
          new_form = '<form class="optin-form" id="main-optin-form" method="post" action="https://www.aweber.com/scripts/addlead.pl" target="aweber-main-submit-frame">'
          if old_form in s:
              s = s.replace(old_form, new_form, 1)

          iframe = '<iframe name="aweber-main-submit-frame" title="AWeber signup submission" hidden></iframe>\n'
          if 'name="aweber-main-submit-frame"' not in s:
              s = s.replace('</main>\n', '</main>\n' + iframe, 1)

          old = """  if(mainForm){\n    mainForm.addEventListener('submit',function(){\n      mainSubmit.textContent='Sending Your Tools…';\n      mainSubmit.disabled=true;\n    });\n  }"""
          new = """  if(mainForm){\n    mainForm.addEventListener('submit',function(){\n      mainSubmit.textContent='Opening Your Paths…';\n      mainSubmit.disabled=true;\n      window.setTimeout(function(){\n        profile.classList.add('is-focused');\n        mainOptin.hidden=true;\n        selector.classList.add('revealed');\n        selector.hidden=false;\n        selector.scrollIntoView({behavior:'smooth',block:'start'});\n      },180);\n    });\n  }"""
          if old not in s:
              raise SystemExit('Expected old submit handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit live fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html
          git commit -m "Show path selector after links opt-in"
          git push
