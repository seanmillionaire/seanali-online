name: Script promo pricing UI

on:
  push:
    paths:
      - '.github/workflows/script-promo-price.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add promo pricing treatment to Script page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('script.html')
          s = path.read_text(encoding='utf-8')

          css_anchor = '.script-gallery-arrow:focus-visible,.script-gallery-thumb:focus-visible{outline:3px solid #957129;outline-offset:3px}\n'
          promo_css = '''.script-price-was{display:block;margin-bottom:2px;color:#8c7b5b;font-size:11px;font-weight:700;line-height:1.1;text-decoration:line-through;text-decoration-thickness:2px}\n.script-price-save{display:inline-flex;margin-top:5px;padding:4px 8px;border-radius:999px;background:#eaf7ee;color:#16723b;font-size:10px;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:.04em}\n#hero-cta .script-cta-offer{display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.05}\n#hero-cta .script-cta-promo{font-size:10px;font-weight:900;letter-spacing:.055em;text-transform:uppercase;opacity:.86}\n#hero-cta .script-cta-promo s{opacity:.78;text-decoration-thickness:2px}\n#hero-cta .script-cta-main{font-size:15px;font-weight:900;line-height:1.08}\n.promo-active-chip{display:inline-flex;align-items:center;width:max-content;margin-right:7px;padding:4px 7px;border-radius:999px;background:#eaf7ee;color:#16723b;font-size:10px;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:.05em;text-decoration:none!important}\n.promo-total s,.script-final-price s{color:#8c7b5b;text-decoration-thickness:2px}\n.promo-total em{display:block;margin-top:5px;color:#16723b;font-size:12px;font-style:normal;font-weight:900}\n.script-final-price{display:flex;flex-direction:column;align-items:flex-start;gap:5px}\n.script-final-price strong{display:block;color:inherit;font-size:34px;line-height:1;font-weight:900}\n.script-final-price small{font-size:11px;font-weight:800;color:#16723b}\n'''
          if promo_css not in s:
            if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
            s = s.replace(css_anchor, css_anchor + promo_css, 1)

          old_selector = '<div class="purchase-selector"><div class="purchase-selector__label">Your audio</div><div class="purchase-options" role="group" aria-label="Your audio"><button class="purchase-option is-selected" type="button" aria-pressed="true" data-product-image="https://hypnoticmeditations.b-cdn.net/images/7%20min%20script.png" data-product-alt="The 7-Minute Script wealth scripting audio product cover" data-product-caption="The 7-Minute Script · 7-minute wealth scripting audio" data-product-price="$37" data-checkout-url="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true" data-cta-label="RUN THE SCRIPT - $37"><span class="purchase-option__selected" aria-hidden="true">✓</span><div><strong>The 7-Minute Script</strong><span>One-time payment · Instant access</span></div><span class="purchase-price-group"><strong class="purchase-price">$37</strong></span></button></div></div>'
          new_selector = '<div class="purchase-selector"><div class="purchase-selector__label">Current promo</div><div class="purchase-options" role="group" aria-label="Your audio"><button class="purchase-option is-selected" type="button" aria-pressed="true" data-product-image="https://hypnoticmeditations.b-cdn.net/images/7%20min%20script.png" data-product-alt="The 7-Minute Script wealth scripting audio product cover" data-product-caption="The 7-Minute Script · 7-minute wealth scripting audio" data-product-price="$37" data-checkout-url="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true" data-cta-label="GET THE 7-MINUTE SCRIPT — $37"><span class="purchase-option__selected" aria-hidden="true">✓</span><div><strong>The 7-Minute Script</strong><span>One-time payment · Instant access</span></div><span class="purchase-price-group"><span class="script-price-was">$197 total value</span><strong class="purchase-price">$37</strong><span class="script-price-save">Save $160</span></span></button></div></div>'
          if old_selector in s:
            s = s.replace(old_selector, new_selector, 1)
          elif new_selector not in s:
            raise SystemExit('Purchase selector anchor not found')

          old_hero_cta = '<a id="hero-cta" class="pdp-cta" href="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true"><span>RUN THE SCRIPT - $37</span><span aria-hidden="true">&rarr;</span></a>'
          new_hero_cta = '<a id="hero-cta" class="pdp-cta" href="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true"><span class="script-cta-offer"><small class="script-cta-promo">PROMO ACTIVE · <s>$197 VALUE</s> · SAVE $160</small><span class="script-cta-main">GET THE 7-MINUTE SCRIPT — $37</span></span><span aria-hidden="true">&rarr;</span></a>'
          if old_hero_cta in s:
            s = s.replace(old_hero_cta, new_hero_cta, 1)
          elif new_hero_cta not in s:
            raise SystemExit('Hero CTA anchor not found')

          old_total = '<div class="included-total"><div><span>One-time access</span><strong>$37</strong></div><small>Instant access · No subscription</small></div>'
          new_total = '<div class="included-total promo-total"><div><span><b class="promo-active-chip">PROMO ACTIVE</b><s>$197 total value</s></span><strong>$37</strong><em>Save $160 today</em></div><small>One payment · Instant access · No subscription</small></div>'
          if old_total in s:
            s = s.replace(old_total, new_total, 1)
          elif new_total not in s:
            raise SystemExit('Included total anchor not found')

          old_final = '<div class="final-price"><span>One-time access</span><br>$37</div>'
          new_final = '<div class="final-price script-final-price"><span class="promo-active-chip">PROMO ACTIVE</span><s>$197 total value</s><strong>$37</strong><small>Save $160 · one-time payment</small></div>'
          if old_final in s:
            s = s.replace(old_final, new_final, 1)
          elif new_final not in s:
            raise SystemExit('Final price anchor not found')

          old_js = "        const cta = document.getElementById('hero-cta');\n        if (!options.length || !productImage || !productThumb || !productCaption || !price || !cta) return;"
          new_js = "        const cta = document.getElementById('hero-cta');\n        const ctaLabel = cta && cta.querySelector('.script-cta-main');\n        if (!options.length || !productImage || !productThumb || !productCaption || !price || !cta || !ctaLabel) return;"
          if old_js in s:
            s = s.replace(old_js, new_js, 1)
          elif new_js not in s:
            raise SystemExit('CTA JS anchor not found')

          old_js_label = "            cta.querySelector('span').textContent = option.dataset.ctaLabel;"
          new_js_label = "            ctaLabel.textContent = option.dataset.ctaLabel;"
          if old_js_label in s:
            s = s.replace(old_js_label, new_js_label, 1)
          elif new_js_label not in s:
            raise SystemExit('CTA label JS anchor not found')

          mobile_anchor = '  .pdp-cta{min-height:54px;padding:13px 12px}\n'
          mobile_css = '  #hero-cta .script-cta-offer{align-items:center;text-align:center}\n  #hero-cta .script-cta-promo{font-size:9px}\n  #hero-cta .script-cta-main{font-size:13px}\n'
          if mobile_css not in s:
            if mobile_anchor not in s:
              raise SystemExit('Mobile CTA anchor not found')
            s = s.replace(mobile_anchor, mobile_anchor + mobile_css, 1)

          path.write_text(s, encoding='utf-8')
          Path('.github/workflows/script-promo-price.yml').unlink(missing_ok=True)
          PY
      - name: Commit promo pricing UI
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.html
          git rm .github/workflows/script-promo-price.yml || true
          git commit -m "Make Script price look like active promo"
          git push
