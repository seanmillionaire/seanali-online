name: Update links bio once

on:
  push:
    paths:
      - '.github/workflows/update-links-bio-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bio text
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('links.html')
          text = path.read_text(encoding='utf-8')
          old = '<p class="bio">Reclaim Your Freedom And Manifest Lifelong Abundance</p>'
          new = '<p class="bio">I will help you to reclaim your freedom.</p>'
          if old not in text:
              raise SystemExit('Expected links-page bio text was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/update-links-bio-once.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/update-links-bio-once.yml
          git commit -m "Update links page bio line"
          git push