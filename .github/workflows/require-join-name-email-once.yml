name: Require join name and email once

on:
  push:
    paths:
      - '.github/require-join-fields-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require both fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('join.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('id="main-optin-name" type="text" name="name" placeholder="FIRST NAME" autocomplete="given-name">', 'id="main-optin-name" type="text" name="name" placeholder="FIRST NAME" autocomplete="given-name" required>')
          s = s.replace('<input type="hidden" name="meta_required" value="email">', '<input type="hidden" name="meta_required" value="name,email">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/require-join-name-email-once.yml .github/require-join-fields-trigger.txt
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add join.html .github/workflows/require-join-name-email-once.yml .github/require-join-fields-trigger.txt
          git diff --cached --quiet || git commit -m "Require name and email on join page"
          git push
