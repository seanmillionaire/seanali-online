name: Update join page copy once
on:
  push:
    paths:
      - '.deploy-join-copy'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update join page copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('join.html')
          s = p.read_text()
          s = s.replace('Change Your Mind, Change What’s Possible.', 'Get Access To My Most Popular Mind Rewiring Tools, Audios And More')
          s = s.replace('Enter your details below to receive my most popular mind rewiring tools, audios and more.', 'Just tell me where to send you access below:')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add join.html
          git commit -m "Update join page headline and subheadline" || exit 0
          git push
