name: Connect links forms to Sean Ali AWeber list

on:
  push:
    paths:
      - '.github/workflows/connect-links-to-sean-ali-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AWeber list routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('links.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r'(<input[^>]+name="listname"[^>]+value=")awlist\d+("[^>]*>)',
              r'\1awlist6946418\2',
              s,
          )
          s = re.sub(r'data-list="awlist\d+"', 'data-list="awlist6946418"', s)

          if 'awlist6946418' not in s:
              raise SystemExit('Sean Ali list ID was not added')

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/connect-links-to-sean-ali-list.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/connect-links-to-sean-ali-list.yml
          git commit -m "Route links opt-ins to Sean Ali AWeber list"
          git push