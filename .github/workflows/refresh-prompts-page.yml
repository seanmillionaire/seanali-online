name: Refresh Claude27 prompts page

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-prompts-page.yml

permissions:
  contents: write

jobs:
  refresh-prompts-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply limited-release design and copy
        run: node scripts/refresh-prompts-page.mjs

      - name: Validate the page
        shell: bash
        run: |
          grep -Fq 'LIMITED FREE RELEASE:' prompts.html
          grep -Fq 'Popular Free Guide' prompts.html
          grep -Fq 'Free access is open right now' prompts.html
          grep -Fq 'UNLOCK THE 27 PROMPTS FREE →' prompts.html
          grep -Fq 'Claude27 is normally $47' prompts.html
          grep -Fq 'action="https://www.aweber.com/scripts/addlead.pl"' prompts.html
          grep -Fq 'value="awlist6946418"' prompts.html
          grep -Fq 'value="http://seanali.online/prompts-sent"' prompts.html

      - name: Remove one-time updater and commit
        shell: bash
        run: |
          rm -f scripts/refresh-prompts-page.mjs
          rm -f .github/workflows/refresh-prompts-page.yml
          git config user.name 'SEAN ALI'
          git config user.email '158592572+seanmillionaire@users.noreply.github.com'
          git add prompts.html
          git add -u scripts/refresh-prompts-page.mjs .github/workflows/refresh-prompts-page.yml
          git commit -m 'Add limited-release energy to prompts page'
          git push origin HEAD:main
