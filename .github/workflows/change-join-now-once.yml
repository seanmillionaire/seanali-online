name: Change homepage nav to Join Now once

on:
  push:
    paths:
      - '.github/join-now-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Join label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="nav-cta" href="/join.html">Join</a>'
          new = '<a class="nav-cta" href="/join.html">Join Now</a>'
          if old not in s and new not in s:
              raise SystemExit('Homepage Join CTA not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/change-join-now-once.yml .github/join-now-trigger.txt
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add index.html .github/workflows/change-join-now-once.yml .github/join-now-trigger.txt
          git diff --cached --quiet || git commit -m "Change homepage nav CTA to Join Now"
          git push
