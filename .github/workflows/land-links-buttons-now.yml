name: Land links buttons now

on:
  push:
    paths:
      - '.github/workflows/land-links-buttons-now.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update links selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('links.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('I’m Ready To Change My Life', 'I Want To Change My Life', 1)
          start = s.find('    <button class="link-card featured path-choice" type="button" data-choice="More Freedom"')
          if start == -1:
              raise SystemExit('AI Freedom button not found')
          end = s.find('    </button>', start)
          if end == -1:
              raise SystemExit('AI Freedom button end not found')
          end += len('    </button>\n')
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/land-links-buttons-now.yml
          rm -f .github/workflows/simplify-links-selector-once.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/land-links-buttons-now.yml .github/workflows/simplify-links-selector-once.yml
          git commit -m "Simplify links page buttons"
          git push