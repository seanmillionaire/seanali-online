name: Update Linktree bio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-linktree-bio.yml

permissions:
  contents: write

jobs:
  update-linktree-bio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Linktree bio
        run: node scripts/update-linktree-bio.mjs

      - name: Validate and clean up
        shell: bash
        run: |
          grep -Fq 'I help people escape poverty, tap into abundance' linktree.html
          ! grep -Fq 'Marketer, media buyer, founder, and AI systems builder' linktree.html
          rm -f scripts/update-linktree-bio.mjs
          rm -f .github/workflows/update-linktree-bio.yml

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'SEAN ALI'
          git config user.email '158592572+seanmillionaire@users.noreply.github.com'
          git add linktree.html
          git add -u scripts/update-linktree-bio.mjs .github/workflows/update-linktree-bio.yml
          git commit -m 'Update Linktree bio'
          git push origin HEAD:main
