name: Blog hero proper case
on:
  push:
    paths:
      - '.github/workflows/script-promo-center.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update blog hero capitalization
        shell: python
        run: |
          from pathlib import Path
          p = Path('blog/index.html')
          text = p.read_text()
          old = 'I’ve learned most of this the hard way. Maybe you won’t have to.'
          new = 'I’ve Learned Most of This the Hard Way. Maybe You Won’t Have To.'
          if old not in text:
              raise SystemExit('Target blog hero text not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html
          git commit -m "Proper case blog hero headline"
          git push
