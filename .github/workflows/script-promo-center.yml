name: Script promo announcement bar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move promo above nav and simplify mobile header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.html')
          s = p.read_text()

          old_css = '''.script-promo-box{max-width:440px;margin:18px auto 12px;padding:16px 18px 15px;border:2px solid #e5b44e;border-radius:14px;background:linear-gradient(180deg,#fffdf6 0%,#fff7df 100%);box-shadow:0 10px 28px rgba(91,62,11,.10);text-align:center}\n.script-promo-badge{display:inline-flex;margin:0 auto 10px;padding:5px 11px;border-radius:999px;background:#9f1d1d;color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}\n.script-promo-value{display:flex;align-items:center;justify-content:center;gap:8px;color:#675b45;font-size:13px;font-weight:800}\n.script-promo-value s{font-size:20px;color:#8c7b5b;text-decoration-thickness:2px}\n.script-promo-price{display:flex;align-items:baseline;justify-content:center;gap:9px;margin-top:4px}\n.script-promo-price span{font-size:13px;font-weight:800;color:#2a241b}\n.script-promo-price strong{font-size:44px;line-height:1;color:#17130d;font-weight:900;letter-spacing:-.04em}\n.script-promo-save{display:inline-flex;margin-top:8px;padding:5px 10px;border-radius:999px;background:#eaf7ee;color:#16723b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}\n'''
          new_css = '''.script-announcement{background:#b42318;color:#fff;text-align:center;padding:9px 14px;font-size:12px;font-weight:900;line-height:1.25;letter-spacing:.035em;text-transform:uppercase}\n.script-announcement s{opacity:.78;text-decoration-thickness:2px}\n.script-announcement strong{font-size:13px}\n'''
          if old_css not in s:
              raise SystemExit('promo box CSS not found')
          s = s.replace(old_css, new_css, 1)

          s = s.replace('''  .script-promo-box{margin:12px auto 10px;padding:13px 12px}\n  .script-promo-price strong{font-size:38px}\n''', '''  .header-benefits{display:none!important}\n  .site-header__inner{justify-content:space-between}\n  .script-announcement{padding:8px 10px;font-size:10px;letter-spacing:.025em}\n  .script-announcement strong{font-size:11px}\n''', 1)

          old_header = '''  <div class="pdp-site">\n    <header class="site-header">'''
          new_header = '''  <div class="pdp-site">\n    <div class="script-announcement" role="status">Current Promo &nbsp;·&nbsp; <s>$197 Value</s> &nbsp;→&nbsp; <strong>$37 Today</strong> &nbsp;·&nbsp; Save $160</div>\n    <header class="site-header">'''
          if old_header not in s:
              raise SystemExit('header insertion point not found')
          s = s.replace(old_header, new_header, 1)

          promo_box = '''            <div class="script-promo-box" aria-label="Current promotional price"><span class="script-promo-badge">Current Promo</span><div class="script-promo-value"><span>Regular total value</span><s>$197</s></div><div class="script-promo-price"><span>Current promo price</span><strong>$37</strong></div><div class="script-promo-save">You save $160</div></div>\n'''
          if promo_box not in s:
              raise SystemExit('hero promo box not found')
          s = s.replace(promo_box, '', 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.html
          git commit -m "Move Script promo to top announcement bar"
          git push
