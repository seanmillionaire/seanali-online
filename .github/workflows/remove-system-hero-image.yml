name: Remove system hero image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-system-hero-image.yml

permissions:
  contents: write

jobs:
  update-system-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove Sean image from hero
        run: node scripts/remove-system-hero-image.mjs

      - name: Validate removal
        shell: bash
        run: |
          ! grep -Fq '<img class="avatar"' system.html
          grep -Fq '<div class="hero-badge">The Simple AI Income System</div>' system.html
          grep -Fq 'Use AI To Build <strong>More Income</strong>' system.html

      - name: Remove updater and commit
        shell: bash
        run: |
          rm -f scripts/remove-system-hero-image.mjs
          rm -f .github/workflows/remove-system-hero-image.yml
          git config user.name 'SEAN ALI'
          git config user.email '158592572+seanmillionaire@users.noreply.github.com'
          git add system.html
          git add -u scripts/remove-system-hero-image.mjs .github/workflows/remove-system-hero-image.yml
          git commit -m 'Remove Sean image from system hero'
          git push origin HEAD:main
