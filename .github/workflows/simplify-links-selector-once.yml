name: Simplify links selector once

on:
  push:
    paths:
      - '.github/workflows/simplify-links-selector-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('links.html')
          text = path.read_text(encoding='utf-8')

          old_label = '<span class="link-copy"><strong>I’m Ready To Change My Life</strong><span>Choose your goal and get personalized guidance for your next step.</span></span>'
          new_label = '<span class="link-copy"><strong>I Want To Change My Life</strong><span>Choose your goal and get personalized guidance for your next step.</span></span>'
          if old_label not in text:
              raise SystemExit('Third selector label not found')
          text = text.replace(old_label, new_label, 1)

          block = '''    <button class="link-card featured path-choice" type="button" data-choice="More Freedom" data-list="awlist6923562" data-destination="https://seanali.online/system" data-tags="links-page,freedom" data-gift-title="Use AI To Build More Income Without Starting Your Life Over" data-gift-copy="A focused AI business blueprint designed to simplify your path and remove unnecessary moving parts." data-gift-value="$297 Value" data-gift-cta="Send Me My Freedom Gift">
      <span class="icon orange">⚡</span>
      <span class="link-copy"><strong>I Want More Freedom</strong><span>Use AI and simple systems to build income with fewer moving parts.</span></span>
      <span class="arrow">›</span>
    </button>
'''
          if block not in text:
              raise SystemExit('AI Freedom selector block not found')
          text = text.replace(block, '', 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/simplify-links-selector-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.html .github/workflows/simplify-links-selector-once.yml
          git commit -m "Simplify links page selector"
          git push