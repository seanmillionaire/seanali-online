name: Center offer stack

on:
  push:
    paths:
      - '.github/workflows/offer-stack-fix.yml'

permissions:
  contents: write

jobs:
  center-offer-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make offer stack single-column and centered
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('script.html')
          text = path.read_text()

          replacements = [
              (
                  '<div class="pdp-container offer-simple">',
                  '<div class="pdp-container offer-simple" style="display:grid;grid-template-columns:1fr;max-width:760px;margin:0 auto;gap:32px;align-items:start;text-align:center">'
              ),
              (
                  '<div class="offer-simple__image"><img ',
                  '<div class="offer-simple__image" style="width:100%;max-width:440px;margin:0 auto"><img style="margin:0 auto" '
              ),
              (
                  '<div>\n            <div class="eyebrow">What you get</div>',
                  '<div style="width:100%;text-align:center">\n            <div class="eyebrow">What you get</div>'
              ),
              (
                  '<ul class="included-list">',
                  '<ul class="included-list" style="text-align:left">'
              ),
              (
                  '<a class="pdp-cta pdp-cta--inline" href="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true">',
                  '<a class="pdp-cta pdp-cta--inline" style="margin-left:auto;margin-right:auto" href="https://buy.hypnoticmeditations.ai/l/bqjzup?wanted=true">'
              )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected markup: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit layout change and remove one-off workflow
        run: |
          rm .github/workflows/offer-stack-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.html .github/workflows/offer-stack-fix.yml
          git commit -m "Make offer stack single-column centered"
          git push
