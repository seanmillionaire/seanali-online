name: Remove requested system page sections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-system-page-sections.yml

permissions:
  contents: write

jobs:
  update-system-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove requested sections
        run: node scripts/remove-system-sections.mjs

      - name: Validate system page
        shell: bash
        run: |
          ! grep -Fq 'The results: updated May 2026' system.html
          ! grep -Fq 'Go From “I Have No Idea What To Build” To Something You Can Launch' system.html
          ! grep -Fq 'What happens after you join?' system.html
          ! grep -Fq 'What the community is using every day' system.html
          grep -Fq '<section class="band" id="proof"><div class="wrap"><span class="eyebrow">Sean'"'"'s proof</span>' system.html

      - name: Remove updater and commit source change
        shell: bash
        run: |
          rm -f scripts/remove-system-sections.mjs
          rm -f .github/workflows/remove-system-page-sections.yml
          git config user.name 'SEAN ALI'
          git config user.email '158592572+seanmillionaire@users.noreply.github.com'
          git add system.html
          git add -u scripts/remove-system-sections.mjs .github/workflows/remove-system-page-sections.yml
          git commit -m 'Remove requested sections from system page'
          git push origin HEAD:main
