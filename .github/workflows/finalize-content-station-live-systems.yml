name: Finalize Content Station live systems

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-content-station-live-systems.yml

permissions:
  contents: write

jobs:
  finalize-content-station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node scripts/finalize-content-station-live-systems.mjs
      - run: |
          node --check content-station/app.js
          grep -Fq 'Sean Ali God Shorts' content-station/app.js
          grep -Fq 'Genie Video Factory' content-station/app.js
          grep -Fq 'Manifestation Book Review' content-station/app.js
          grep -Fq 'Jennifer / HM Sales Email' content-station/app.js
          grep -Fq 'concept.title.split(/\s+/).length <= 20' content-station/app.js
          grep -Fq 'LIVE CONTENT STATION V3' content-station/styles.css
      - run: |
          rm -f scripts/finalize-content-station-live-systems.mjs
          rm -f .github/workflows/finalize-content-station-live-systems.yml
          git config user.name 'SEAN ALI'
          git config user.email '158592572+seanmillionaire@users.noreply.github.com'
          git add content-station/app.js content-station/styles.css
          git add -u scripts/finalize-content-station-live-systems.mjs .github/workflows/finalize-content-station-live-systems.yml
          git commit -m 'Finalize Content Station live systems'
          git push origin HEAD:main
