name: Reorder AI Freedom System mechanism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reorder-system.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move 30-day mechanism directly below hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('system.html')
          s = p.read_text()
          start_marker = "  <!-- \n    ========================================\n    VISUAL MOMENTUM: Day 1 / Day 7 / Day 30 (white cards)"
          end_marker = "  <!-- \n    ========================================\n    TWO PILLARS (white cards)"
          insert_marker = "  <!-- \n    ========================================\n    CLEAR VEHICLE: WHAT EXACTLY YOU'LL BUILD"
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          block = s[start:end]
          without = s[:start] + s[end:]
          pos = without.index(insert_marker)
          updated = without[:pos] + block + "\n" + without[pos:]
          assert updated.count('Your 30-Day AI Income Momentum Plan') == 1
          assert updated.index('Your 30-Day AI Income Momentum Plan') < updated.index('What Kind of AI Income Stream Will You Build?')
          p.write_text(updated)
          PY
      - name: Commit reordered page
        run: |
          git config user.name "SEAN ALI"
          git config user.email "158592572+seanmillionaire@users.noreply.github.com"
          git add system.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Move AI income mechanism directly below hero"
            git push origin main
          fi
