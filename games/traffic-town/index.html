<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Traffic Town | Kids Driving Game</title><meta name="description" content="A colorful kids driving game where children move the car with arrows, follow the guide, park, deliver food, collect fuel, and earn rewards."><link rel="canonical" href="https://seanali.online/games/traffic-town/"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 12% 10%,#fff26f,transparent 25%),radial-gradient(circle at 92% 12%,#9fffe0,transparent 26%),linear-gradient(180deg,#8be6ff,#dffcff 46%,#9be3a9);color:#101436;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{max-width:760px;margin:0 auto;background:#fff6e6;border:5px solid #101436;border-radius:32px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.22)}.top{text-align:center;background:radial-gradient(circle at top,#ffc83d,transparent 35%),linear-gradient(135deg,#0da7ff,#7d4cff);color:#fff;padding:16px;border-bottom:5px solid #101436}.tag{display:inline-block;background:#fff;color:#101436;border:3px solid #ffc83d;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:8px}h1{font-size:clamp(40px,9vw,68px);line-height:.9;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.22)}.sub{font-size:18px;font-weight:900;color:#fff6e6;margin:8px 0 0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e8fbff;padding:9px;border-bottom:4px solid #101436}.pill{background:#fff;border:3px solid #101436;border-radius:16px;text-align:center;font-size:15px;font-weight:900;padding:7px 4px}.garage{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fffdf6;border-bottom:4px solid #101436}.car-chip{flex:0 0 auto;background:#fff;border:3px solid #101436;border-radius:999px;padding:7px 10px;font-size:15px;font-weight:900}.car-chip.locked{filter:grayscale(1);opacity:.55}.stage{padding:13px}.town{position:relative;height:390px;border:6px solid #101436;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#b8f2ff 0 28%,#93e49e 28% 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}.roadH,.roadV{position:absolute;background:#353a47;border:5px solid #101436}.roadH{left:-10px;right:-10px;top:174px;height:82px}.roadV{top:-10px;bottom:-10px;left:calc(50% - 41px);width:82px}.roadH:before{content:'';position:absolute;left:0;right:0;top:50%;height:7px;background:repeating-linear-gradient(90deg,#fff 0 34px,transparent 34px 66px);animation:dashH .55s linear infinite}.roadV:before{content:'';position:absolute;top:0;bottom:0;left:50%;width:7px;background:repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 66px);animation:dashV .55s linear infinite}.grass{position:absolute;font-size:28px;opacity:.8}.g1{left:18px;top:36px}.g2{right:22px;top:80px}.g3{left:42px;bottom:28px}.g4{right:48px;bottom:32px}.thing{position:absolute;width:64px;height:64px;border:4px solid #101436;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.22);z-index:4}.thing.guide{outline:8px solid rgba(255,200,61,.72);animation:pulse 1s infinite}.thing.bad{filter:grayscale(.2);background:#ffe3e3}.thing.done{opacity:.38;filter:grayscale(1)}.car{position:absolute;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:54px;filter:drop-shadow(0 7px 0 rgba(0,0,0,.25));transition:.23s ease;z-index:10}.car.bump{animation:bump .25s}.guide-arrow{position:absolute;z-index:12;background:#ffc83d;border:4px solid #101436;border-radius:999px;padding:7px 11px;font-size:17px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.22);animation:bob 1s infinite;pointer-events:none}.panel{margin-top:12px;background:#fff;border:5px solid #101436;border-radius:26px;padding:13px;box-shadow:0 8px 0 rgba(0,0,0,.16)}.level-title{text-align:center;font-size:24px;font-weight:900;background:#ffc83d;border:4px solid #101436;border-radius:18px;padding:9px}.prompt{font-size:24px;line-height:1.08;font-weight:900;text-align:center;margin:11px 0}.hint{text-align:center;background:#e8fbff;border:3px solid #00a7c9;border-radius:16px;padding:9px;font-size:17px;font-weight:900}.pad{display:grid;grid-template-columns:72px 72px 72px;grid-template-rows:72px 72px 72px;gap:9px;justify-content:center;margin:13px auto}.arrow{border:4px solid #101436;border-radius:22px;background:#fff26f;font-size:34px;font-weight:900;box-shadow:0 7px 0 #101436;color:#101436}.arrow:active{transform:translateY(6px);box-shadow:0 1px 0 #101436}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81;color:#101436}.reward{display:none;margin-top:12px;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:14px;text-align:center;font-size:20px;font-weight:900}.endBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.endBtns button{border:4px solid #101436;border-radius:18px;padding:13px 8px;font-size:16px;font-weight:900;background:#ffc83d;box-shadow:0 6px 0 rgba(0,0,0,.22);color:#101436}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes dashH{to{background-position:-66px 0}}@keyframes dashV{to{background-position:0 -66px}}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 26px rgba(255,200,61,.8)}}@keyframes bob{50%{transform:translateY(6px)}}@keyframes bump{50%{transform:translateX(-10px) rotate(-8deg)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:520px){body{padding:8px}.hud{grid-template-columns:repeat(2,1fr)}.town{height:350px}.thing{width:54px;height:54px;font-size:30px}.car{width:54px;height:54px;font-size:48px}.pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px 64px}.actions,.endBtns{grid-template-columns:1fr}.prompt{font-size:21px}}</style></head><body><main class="game"><section class="top"><div class="tag">🎮 Real driving game</div><h1>🚗 Traffic Town</h1><p class="sub">Move the car with arrows. Follow the guide. Reach the goal.</p></section><section class="hud"><div class="pill">⭐ XP <span id="xp">0</span></div><div class="pill">🏁 Level <span id="level">1</span>/5</div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 <span id="badges">0</span></div></section><div class="garage" id="garage"></div><section class="stage"><div class="town" id="town"><div class="roadH"></div><div class="roadV"></div><div class="grass g1">🌳</div><div class="grass g2">🌼</div><div class="grass g3">🌲</div><div class="grass g4">🌷</div><div id="scene"></div><div class="guide-arrow" id="guideArrow">Follow me ↓</div><div class="car" id="car">🚗</div></div><div class="panel"><div class="level-title" id="levelTitle">Level 1 — Left or Right</div><div class="prompt game-focus-target" id="prompt">Use the arrows to drive to the glowing goal.</div><div class="hint" id="hint">Move one space at a time. Follow the guide.</div><div class="pad" aria-label="Driving controls"><button class="arrow up" data-move="up">↑</button><button class="arrow left" data-move="left">←</button><button class="arrow right" data-move="right">→</button><button class="arrow down" data-move="down">↓</button></div><div class="actions"><button class="small" id="garageBtn">🚗 Garage</button><button class="small" id="hornBtn">📣 Horn</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></div></section></main><div class="popup" id="popup">Good drive!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let level=1,step=0,xp=0,streak=0,badges=0,unlocked=1,car={x:3,y:3},holding=null,locked=false;const W=7,H=6,$=id=>document.getElementById(id);const cars=['🚗 Red Car','🚓 Police Car','🚒 Fire Truck','🚙 Monster Truck','🏎️ Race Car','🍦 Ice Cream Truck','✨ Gold Car'];const missions=[{lvl:1,title:'Level 1 — Left or Right',hint:'Follow the glowing arrow goal.',start:{x:3,y:3},items:[{type:'goal',x:1,y:3,icon:'⬅️',need:'goal'}],q:'Drive LEFT to the glowing arrow.'},{lvl:1,title:'Level 1 — Left or Right',hint:'Now drive right.',start:{x:3,y:3},items:[{type:'goal',x:5,y:3,icon:'➡️',need:'goal'}],q:'Drive RIGHT to the glowing arrow.'},{lvl:2,title:'Level 2 — Road Signs',hint:'Drive to the correct road sign.',start:{x:3,y:5},items:[{type:'goal',x:3,y:1,icon:'🛑',need:'goal'},{type:'bad',x:1,y:1,icon:'🏁'},{type:'bad',x:5,y:1,icon:'🍬'}],q:'Road sign: STOP. Drive to the STOP sign.'},{lvl:2,title:'Level 2 — Road Signs',hint:'School zone means slow and safe.',start:{x:3,y:5},items:[{type:'goal',x:5,y:2,icon:'🏫',need:'goal'},{type:'bad',x:1,y:2,icon:'⚡'}],q:'Find the SCHOOL sign.'},{lvl:3,title:'Level 3 — Parking',hint:'Park in the matching color space.',start:{x:3,y:3},items:[{type:'goal',x:1,y:5,icon:'🟥',need:'goal'},{type:'bad',x:3,y:5,icon:'🟦'},{type:'bad',x:5,y:5,icon:'🟩'}],q:'Park in the RED space.'},{lvl:3,title:'Level 3 — Parking',hint:'Line up slowly.',start:{x:3,y:3},items:[{type:'bad',x:1,y:5,icon:'🟥'},{type:'goal',x:3,y:5,icon:'🟦',need:'goal'},{type:'bad',x:5,y:5,icon:'🟩'}],q:'Park in the BLUE space.'},{lvl:4,title:'Level 4 — Deliveries',hint:'Pick up the item first, then deliver it.',start:{x:3,y:3},items:[{type:'pickup',x:1,y:3,icon:'🍎'},{type:'goal',x:5,y:1,icon:'🏠',need:'🍎'},{type:'bad',x:5,y:5,icon:'🏫'}],q:'Pick up 🍎 apples. Deliver them to the house.'},{lvl:4,title:'Level 4 — Deliveries',hint:'Pick up milk and deliver to school.',start:{x:3,y:3},items:[{type:'pickup',x:5,y:3,icon:'🥛'},{type:'goal',x:1,y:1,icon:'🏫',need:'🥛'},{type:'bad',x:1,y:5,icon:'🏠'}],q:'Pick up 🥛 milk. Deliver it to the school.'},{lvl:5,title:'Level 5 — Fuel',hint:'Healthy food gives fuel. Candy slows the car.',start:{x:3,y:3},items:[{type:'goal',x:1,y:2,icon:'🥑',need:'goal'},{type:'bad',x:3,y:2,icon:'🍬'},{type:'goal',x:5,y:2,icon:'🥕',need:'goal'}],q:'Collect healthy fuel. Avoid candy.'},{lvl:5,title:'Level 5 — Fuel',hint:'Choose strong fuel again.',start:{x:3,y:3},items:[{type:'bad',x:1,y:2,icon:'🍩'},{type:'goal',x:3,y:1,icon:'🥛',need:'goal'},{type:'bad',x:5,y:2,icon:'🧁'}],q:'Collect healthy fuel. Avoid junk food.'}];function cellX(x){return 6+x*((100-12)/(W-1))}function cellY(y){return 6+y*((100-12)/(H-1))}function sound(n){try{window.SeanGameSounds&&SeanGameSounds[n]&&SeanGameSounds[n]()}catch(e){}}function speak(t){try{window.SeanGameVoice&&SeanGameVoice.speak&&SeanGameVoice.speak(t)}catch(e){}}function pop(t){const p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function garage(){ $('garage').innerHTML=cars.map((c,i)=>'<div class="car-chip '+(i>=unlocked?'locked':'')+'">'+(i>=unlocked?'🔒 ':c)+'</div>').join('')}function render(){if(step>=missions.length)return finish();const m=missions[step];level=m.lvl;car={...m.start};holding=null;locked=false;$('level').textContent=level;$('levelTitle').textContent=m.title;$('prompt').textContent=m.q;$('hint').textContent=m.hint;$('xp').textContent=xp;$('streak').textContent=streak;$('badges').textContent=badges;$('reward').style.display='none';renderScene();garage();speak('Use the arrows. Follow the glowing goal.')}function renderScene(){const m=missions[step];$('scene').innerHTML=m.items.map((it,i)=>'<div class="thing '+(it.type==='goal'?'guide ':'')+(it.type==='bad'?'bad ':'')+(it.done?'done ':'')+'" data-i="'+i+'" style="left:calc('+cellX(it.x)+'% - 32px);top:calc('+cellY(it.y)+'% - 32px)">'+it.icon+'</div>').join('');const c=$('car');c.style.left='calc('+cellX(car.x)+'% - 31px)';c.style.top='calc('+cellY(car.y)+'% - 31px)';const goal=m.items.find(it=>it.type==='goal'&&!it.done)||m.items.find(it=>it.type==='pickup'&&!it.done);if(goal){const a=$('guideArrow');a.style.left='calc('+cellX(goal.x)+'% - 64px)';a.style.top='calc('+cellY(goal.y)+'% - 62px)';a.textContent=goal.type==='pickup'?'Pick up ↓':'Goal ↓'}if(holding)$('hint').textContent='You have '+holding+'. Now drive to the glowing goal.'}function move(dir){if(locked||step>=missions.length)return;let nx=car.x,ny=car.y;if(dir==='left')nx--;if(dir==='right')nx++;if(dir==='up')ny--;if(dir==='down')ny++;if(nx<0||nx>=W||ny<0||ny>=H){bump('Stay on the road.');return}car.x=nx;car.y=ny;renderScene();sound('tap');check()}function check(){const m=missions[step];const hit=m.items.find(it=>!it.done&&it.x===car.x&&it.y===car.y);if(!hit)return;if(hit.type==='bad'){streak=0;$('streak').textContent=streak;bump('Wrong stop. Try the glowing guide.');sound('wrong');return}if(hit.type==='pickup'){holding=hit.icon;hit.done=true;pop('Picked up '+hit.icon);sound('coin');renderScene();return}if(hit.type==='goal'){if(hit.need&&hit.need!=='goal'&&holding!==hit.need){bump('Pick up '+hit.need+' first.');return}completeMission(hit)}}function bump(msg){const c=$('car');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');pop(msg);$('hint').textContent=msg}function completeMission(hit){locked=true;hit.done=true;xp+=50;streak++;$('xp').textContent=xp;$('streak').textContent=streak;pop('⭐ Good drive!');sound('correct');speak('Correct, you got it!');confetti();setTimeout(()=>{step++;if(step>0&&(step===2||step===4||step===6||step===8||step===10)){badges++;unlocked=Math.min(cars.length,unlocked+1)}render()},950)}function finish(){badges++;unlocked=Math.min(cars.length,unlocked+1);$('levelTitle').textContent='🏁 Traffic Town Complete';$('prompt').textContent='You reached the finish and earned a Driver Badge!';$('hint').textContent='You drove with arrows, followed the guide, parked, delivered, and collected fuel.';$('scene').innerHTML='<div class="thing guide" style="left:calc(50% - 32px);top:calc(50% - 32px)">🏆</div>';$('guideArrow').style.display='none';$('reward').style.display='block';$('reward').innerHTML='🏆 Driver Badge · ⭐ XP '+xp+'<div class="endBtns"><button onclick="location.reload()">🔁 Play Again</button><button onclick="window.dispatchEvent(new CustomEvent(\'seanGameNextLevelRequest\'))">🚀 Next Level</button><button onclick="location.href=\'/games/\'">🏠 Main Menu</button></div>';$('badges').textContent=badges;garage();sound('levelUp');confetti()}function confetti(){['⭐','🚗','🎨','🛞','✨'].forEach((x,i)=>{const d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(12+i*18+Math.random()*8)+'vw';d.style.animationDelay=(i*.05)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)})}document.querySelectorAll('.arrow').forEach(b=>b.onclick=()=>move(b.dataset.move));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move('left');if(e.key==='ArrowRight')move('right');if(e.key==='ArrowUp')move('up');if(e.key==='ArrowDown')move('down')});$('restartBtn').onclick=()=>location.reload();$('hornBtn').onclick=()=>{pop('📣 Beep beep!');sound('tap')};$('garageBtn').onclick=()=>pop('Garage: unlock more cars!');render();</script></body></html>
