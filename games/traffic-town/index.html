<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Traffic Town | Kids Driving Game</title><meta name="description" content="A colorful kids driving game with turns, signs, parking, deliveries, fuel, XP, garage rewards, and badges."><link rel="canonical" href="https://seanali.online/games/traffic-town/"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#fff26f,transparent 25%),radial-gradient(circle at 90% 12%,#9fffe0,transparent 26%),linear-gradient(180deg,#8be6ff,#dffcff 46%,#9be3a9);color:#101436;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{max-width:760px;margin:0 auto;background:#fff6e6;border:5px solid #101436;border-radius:32px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.22)}.top{text-align:center;background:radial-gradient(circle at top,#ffc83d,transparent 35%),linear-gradient(135deg,#0da7ff,#7d4cff);color:#fff;padding:16px;border-bottom:5px solid #101436}.tag{display:inline-block;background:#fff;color:#101436;border:3px solid #ffc83d;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:8px}h1{font-size:clamp(40px,9vw,68px);line-height:.9;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.22)}.sub{font-size:18px;font-weight:900;color:#fff6e6;margin:8px 0 0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e8fbff;padding:9px;border-bottom:4px solid #101436}.pill{background:#fff;border:3px solid #101436;border-radius:16px;text-align:center;font-size:15px;font-weight:900;padding:7px 4px}.garage{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fffdf6;border-bottom:4px solid #101436}.car-chip{flex:0 0 auto;background:#fff;border:3px solid #101436;border-radius:999px;padding:7px 10px;font-size:15px;font-weight:900}.car-chip.locked{filter:grayscale(1);opacity:.55}.stage{padding:13px}.town{position:relative;height:360px;border:6px solid #101436;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#b8f2ff 0 32%,#93e49e 32% 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}.cloud{position:absolute;font-size:38px;top:16px;animation:cloudMove 14s linear infinite}.cloud.c2{top:58px;animation-duration:18s;animation-delay:-6s}.house{position:absolute;font-size:46px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}.h1{left:18px;top:103px}.h2{right:26px;top:112px}.h3{left:32px;bottom:26px}.h4{right:34px;bottom:34px}.road{position:absolute;left:0;right:0;bottom:105px;height:118px;background:#353a47;border-top:6px solid #101436;border-bottom:6px solid #101436}.road:before{content:'';position:absolute;left:0;right:0;top:50%;height:8px;background:repeating-linear-gradient(90deg,#fff 0 48px,transparent 48px 82px);transform:translateY(-50%);animation:roadDash .55s linear infinite}.intersection{position:absolute;left:50%;top:31%;width:118px;height:118px;background:#353a47;border:5px solid #101436;transform:translateX(-50%);border-radius:16px}.car{position:absolute;left:45%;bottom:128px;font-size:58px;filter:drop-shadow(0 7px 0 rgba(0,0,0,.25));transition:.35s ease;z-index:8}.car.drive{animation:carBounce .5s ease infinite}.car.left{transform:translateX(-120px) rotate(-8deg)}.car.right{transform:translateX(120px) rotate(8deg)}.sign,.item,.parking,.fuel{position:absolute;font-size:46px;z-index:5;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18));animation:float 1.9s ease-in-out infinite}.sign{left:50%;top:94px;transform:translateX(-50%);font-size:54px}.parking{bottom:24px;border:5px solid #101436;border-radius:18px;min-width:92px;height:70px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:32px}.parking.red{left:50px;background:#ffdfdf}.parking.blue{left:50%;transform:translateX(-50%);background:#dff1ff}.parking.green{right:50px;background:#ddffe9}.item{top:134px}.item.i1{left:80px}.item.i2{left:50%;transform:translateX(-50%)}.item.i3{right:80px}.fuel{top:132px}.fuel.f1{left:74px}.fuel.f2{left:50%;transform:translateX(-50%)}.fuel.f3{right:74px}.panel{margin-top:12px;background:#fff;border:5px solid #101436;border-radius:26px;padding:13px;box-shadow:0 8px 0 rgba(0,0,0,.16)}.level-title{text-align:center;font-size:24px;font-weight:900;background:#ffc83d;border:4px solid #101436;border-radius:18px;padding:9px}.prompt{font-size:24px;line-height:1.08;font-weight:900;text-align:center;margin:11px 0}.hint{text-align:center;background:#e8fbff;border:3px solid #00a7c9;border-radius:16px;padding:9px;font-size:17px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}.choice{border:4px solid #101436;border-radius:22px;background:#fffdf6;min-height:76px;padding:14px;font-size:22px;font-weight:900;color:#101436;box-shadow:0 7px 0 #101436;cursor:pointer}.choice:nth-child(2){background:#b8f2ff}.choice:nth-child(3){background:#d7b9ff}.choice.good{background:linear-gradient(180deg,#d9ffe9,#7dffb0)!important}.choice.bad{background:linear-gradient(180deg,#ff3d3d,#b40020)!important;color:#fff!important}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81;color:#101436}.reward{display:none;margin-top:12px;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:14px;text-align:center;font-size:20px;font-weight:900}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes roadDash{to{background-position:-82px 0}}@keyframes cloudMove{from{left:-80px}to{left:105%}}@keyframes carBounce{50%{transform:translateY(-5px)}}@keyframes float{50%{translate:0 -7px}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:520px){body{padding:8px}.hud{grid-template-columns:repeat(2,1fr)}.town{height:330px}.choices{grid-template-columns:1fr}.choice{font-size:20px}.car{font-size:52px}.parking{min-width:78px}.parking.red{left:18px}.parking.green{right:18px}.item.i1,.fuel.f1{left:32px}.item.i3,.fuel.f3{right:32px}.actions{grid-template-columns:1fr}.prompt{font-size:21px}}</style></head><body><main class="game"><section class="top"><div class="tag">🎮 Real driving game</div><h1>🚗 Traffic Town</h1><p class="sub">Drive, choose, collect, park, deliver, and unlock cars.</p></section><section class="hud"><div class="pill">⭐ XP <span id="xp">0</span></div><div class="pill">🏁 Level <span id="level">1</span>/5</div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 <span id="badges">0</span></div></section><div class="garage" id="garage"></div><section class="stage"><div class="town" id="town"><div class="cloud">☁️</div><div class="cloud c2">☁️</div><div class="house h1">🏠</div><div class="house h2">🏡</div><div class="house h3">🏘️</div><div class="house h4">🏫</div><div class="road"></div><div class="intersection"></div><div class="car drive" id="car">🚗</div><div id="scene"></div></div><div class="panel"><div class="level-title" id="levelTitle">Level 1 — Left or Right</div><div class="prompt game-focus-target" id="prompt">Choose the safe turn.</div><div class="hint" id="hint">Look at the arrow. Then tap.</div><div class="choices" id="choices"></div><div class="actions"><button class="small" id="garageBtn">🚗 Garage</button><button class="small" id="hornBtn">📣 Horn</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></div></section></main><div class="popup" id="popup">Good drive!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let level=1,step=0,xp=0,streak=0,badges=0,unlocked=1,paint='red',voiceOn=true;const $=id=>document.getElementById(id);const cars=['🚗 Red Car','🚓 Police Car','🚒 Fire Truck','🚙 Monster Truck','🏎️ Race Car','🍦 Ice Cream Truck','✨ Gold Car'];const levels={1:{title:'Level 1 — Left or Right',hint:'Look at the arrow. Then tap.',items:[{scene:'⬅️',q:'The road arrow points left. Where do you turn?',a:['🟢 Turn left','🔴 Turn right'],good:0,move:'left'},{scene:'➡️',q:'The road arrow points right. Where do you turn?',a:['🔴 Turn right','🟢 Turn left'],good:0,move:'right'},{scene:'⬅️',q:'Follow the green arrow.',a:['🟢 Left','🔴 Right'],good:0,move:'left'}]},2:{title:'Level 2 — Road Signs',hint:'Read the sign. Pick the safe driving move.',items:[{scene:'🛑',q:'You see STOP. What do you do?',a:['Stop first','Speed up','Turn anywhere'],good:0},{scene:'🏫',q:'School sign. What is safest?',a:['Drive slow','Race fast','Honk forever'],good:0},{scene:'⚠️',q:'Yield means what?',a:['Slow and let others go','Never look','Drive faster'],good:0},{scene:'🔢 20',q:'Speed limit says 20. What should you do?',a:['Stay slow','Go super fast','Close eyes'],good:0}]},3:{title:'Level 3 — Parking',hint:'Drive into the matching color space.',items:[{scene:'P',q:'Park in the red space.',a:['Red space','Blue space','Green space'],good:0,park:'red'},{scene:'P',q:'Park in the blue space.',a:['Blue space','Green space','Red space'],good:0,park:'blue'},{scene:'P',q:'Park in the green space.',a:['Green space','Red space','Blue space'],good:0,park:'green'}]},4:{title:'Level 4 — Deliveries',hint:'Pick up the item and deliver it to the correct house.',items:[{scene:'🍎',q:'Deliver apples to the red house.',a:['Red house','School','Blue house'],good:0,item:'🍎'},{scene:'🥛',q:'Deliver milk to the school.',a:['School','Green house','Garage'],good:0,item:'🥛'},{scene:'🥕',q:'Deliver carrots to the green house.',a:['Green house','Red house','Road sign'],good:0,item:'🥕'}]},5:{title:'Level 5 — Fuel',hint:'Healthy food gives fuel. Candy slows the car.',items:[{scene:'🥑 🍬 🍎',q:'Pick the best fuel.',a:['🥑 Avocado','🍬 Candy','🍭 Lollipop'],good:0,fuel:'🥑'},{scene:'🥛 🍩 🍟',q:'Pick the better fuel.',a:['🥛 Milk','🍩 Donut','🍟 Fries'],good:0,fuel:'🥛'},{scene:'🥕 🍫 🧁',q:'Pick the healthy fuel.',a:['🥕 Carrot','🍫 Chocolate','🧁 Cupcake'],good:0,fuel:'🥕'}]}};function speak(t){if(!voiceOn)return;try{if(window.SeanGameVoice&&SeanGameVoice.speak)SeanGameVoice.speak(t)}catch(e){}}function sound(n){try{if(window.SeanGameSounds&&SeanGameSounds[n])SeanGameSounds[n]()}catch(e){}}function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((x,y)=>x.r-y.r).map(x=>x.v)}function garage(){garageEl=$('garage');garageEl.innerHTML=cars.map((c,i)=>'<div class="car-chip '+(i>=unlocked?'locked':'')+'">'+(i>=unlocked?'🔒 ':c)+'</div>').join('')}function sceneHtml(item){let h='<div class="sign">'+item.scene+'</div>';if(level===3)h+='<div class="parking red">🟥</div><div class="parking blue">🟦</div><div class="parking green">🟩</div>';if(level===4)h+='<div class="item i1">🍎</div><div class="item i2">🥛</div><div class="item i3">🥕</div>';if(level===5)h+='<div class="fuel f1">🥑</div><div class="fuel f2">🍬</div><div class="fuel f3">🥛</div>';return h}function render(){if(level>5)return finishGame();const cfg=levels[level];const item=cfg.items[step%cfg.items.length];$('level').textContent=level;$('levelTitle').textContent=cfg.title;$('hint').textContent=cfg.hint;$('prompt').textContent=item.q;$('scene').innerHTML=sceneHtml(item);$('car').className='car drive';$('xp').textContent=xp;$('streak').textContent=streak;$('badges').textContent=badges;$('reward').style.display='none';const mixed=shuffle(item.a.map((txt,i)=>({txt,ok:i===item.good,move:item.move,park:item.park})));$('choices').innerHTML=mixed.map((o,i)=>'<button class="choice" data-ok="'+o.ok+'" data-move="'+(o.move||'')+'" data-park="'+(o.park||'')+'">'+o.txt+'</button>').join('');document.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>pick(b,mixed[i],item));garage();speak('Choose the safe move.')}function pick(btn,opt,item){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(opt.ok){btn.classList.add('good');xp+=40;streak++;sound('correct');speak('Correct, you got it!');pop('⭐ Good drive!');animateCar(item,opt);setTimeout(()=>{step++;if(step>=levels[level].items.length){levelComplete()}else render()},950)}else{btn.classList.add('bad');streak=0;sound('wrong');speak('Incorrect.');pop('Slow down.');setTimeout(()=>{document.querySelectorAll('.choice').forEach(b=>{b.disabled=false;b.classList.remove('bad')})},850)}$('xp').textContent=xp;$('streak').textContent=streak}function animateCar(item,opt){const car=$('car');if(item.move)car.classList.add(item.move);else if(item.park)car.style.bottom='32px';else car.style.transform='translateX(80px)'}function levelComplete(){badges++;unlocked=Math.min(cars.length,unlocked+1);$('badges').textContent=badges;$('reward').style.display='block';$('reward').innerHTML='🏆 Driver badge unlocked!<br>🚗 New garage reward opened.';confetti();sound('levelUp');setTimeout(()=>{level++;step=0;render()},1550)}function finishGame(){$('levelTitle').textContent='🏁 Traffic Town Complete';$('prompt').textContent='You reached the finish and earned a Driver Badge!';$('hint').textContent='Garage rewards are waiting.';$('scene').innerHTML='<div class="sign">🏆</div>';$('choices').innerHTML='<button class="choice">🔁 Drive again</button><button class="choice">🏠 Main Menu</button>';$('choices').children[0].onclick=()=>location.reload();$('choices').children[1].onclick=()=>location.href='/games/';$('reward').style.display='block';$('reward').innerHTML='⭐ XP '+xp+' · 🏆 Badges '+badges+' · 🚗 Garage '+unlocked+'/'+cars.length;confetti();sound('levelUp')}function pop(t){const p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(){['⭐','🚗','🎨','🛞','✨'].forEach((x,i)=>{const d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(12+i*18+Math.random()*8)+'vw';d.style.animationDelay=(i*.05)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)})}$('restartBtn').onclick=()=>location.reload();$('hornBtn').onclick=()=>{pop('📣 Beep beep!');sound('tap')};$('garageBtn').onclick=()=>{pop('Garage: unlock more cars!')};garage();render();</script></body></html>
