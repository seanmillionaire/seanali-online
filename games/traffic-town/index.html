<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Traffic Town | Kids Driving Game</title><meta name="description" content="A colorful kids driving game where children move the car with arrows, follow clear steps, park, deliver food, collect fuel, and earn rewards."><link rel="canonical" href="https://seanali.online/games/traffic-town/"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 12% 10%,#fff26f,transparent 25%),radial-gradient(circle at 92% 12%,#9fffe0,transparent 26%),linear-gradient(180deg,#8be6ff,#dffcff 46%,#9be3a9);color:#101436;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{max-width:760px;margin:0 auto;background:#fff6e6;border:5px solid #101436;border-radius:32px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.22)}.top{text-align:center;background:radial-gradient(circle at top,#ffc83d,transparent 35%),linear-gradient(135deg,#0da7ff,#7d4cff);color:#fff;padding:16px;border-bottom:5px solid #101436}.tag{display:inline-block;background:#fff;color:#101436;border:3px solid #ffc83d;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:8px}h1{font-size:clamp(40px,9vw,68px);line-height:.9;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.22)}.sub{font-size:18px;font-weight:900;color:#fff6e6;margin:8px 0 0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e8fbff;padding:9px;border-bottom:4px solid #101436}.pill{background:#fff;border:3px solid #101436;border-radius:16px;text-align:center;font-size:15px;font-weight:900;padding:7px 4px}.garage{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fffdf6;border-bottom:4px solid #101436}.car-chip{flex:0 0 auto;background:#fff;border:3px solid #101436;border-radius:999px;padding:7px 10px;font-size:15px;font-weight:900}.car-chip.locked{filter:grayscale(1);opacity:.55}.stage{padding:13px}.town{position:relative;height:390px;border:6px solid #101436;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#b8f2ff 0 27%,#93e49e 27% 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}.roadH,.roadV{position:absolute;background:#353a47;border:5px solid #101436}.roadH{left:-10px;right:-10px;top:154px;height:86px}.roadV{top:-10px;bottom:-10px;left:calc(50% - 43px);width:86px}.roadH:before{content:'';position:absolute;left:0;right:0;top:50%;height:7px;background:repeating-linear-gradient(90deg,#fff 0 34px,transparent 34px 66px);animation:dashH .55s linear infinite}.roadV:before{content:'';position:absolute;top:0;bottom:0;left:50%;width:7px;background:repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 66px);animation:dashV .55s linear infinite}.grass{position:absolute;font-size:28px;opacity:.8}.g1{left:18px;top:36px}.g2{right:22px;top:80px}.g3{left:42px;bottom:28px}.g4{right:48px;bottom:32px}.spot{position:absolute;width:66px;height:66px;border:4px solid #101436;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.22);z-index:4}.spot.goal{outline:9px solid rgba(255,200,61,.78);animation:pulse 1s infinite}.spot.bad{background:#ffe0e0}.spot.pickup{background:#e8fbff}.spot.done{opacity:.35;filter:grayscale(1)}.car{position:absolute;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:54px;filter:drop-shadow(0 7px 0 rgba(0,0,0,.25));transition:.22s ease;z-index:10}.car.bump{animation:bump .25s}.guide-arrow{position:absolute;z-index:12;background:#ffc83d;border:4px solid #101436;border-radius:999px;padding:7px 11px;font-size:17px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.22);animation:bob 1s infinite;pointer-events:none}.panel{margin-top:12px;background:#fff;border:5px solid #101436;border-radius:26px;padding:13px;box-shadow:0 8px 0 rgba(0,0,0,.16)}.level-title{text-align:center;font-size:24px;font-weight:900;background:#ffc83d;border:4px solid #101436;border-radius:18px;padding:9px}.prompt{font-size:24px;line-height:1.08;font-weight:900;text-align:center;margin:11px 0}.hint{text-align:center;background:#e8fbff;border:3px solid #00a7c9;border-radius:16px;padding:9px;font-size:17px;font-weight:900}.nextBox{text-align:center;background:#fff;border:5px solid #ff3b30;border-radius:22px;padding:10px;margin:11px 0;font-size:22px;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.18)}.nextBox b{display:block;background:#ffc83d;border:3px solid #101436;border-radius:15px;padding:6px;margin-bottom:6px}.pad{display:grid;grid-template-columns:72px 72px 72px;grid-template-rows:72px 72px 72px;gap:9px;justify-content:center;margin:13px auto}.arrow{border:4px solid #101436;border-radius:22px;background:#fff26f;font-size:34px;font-weight:900;box-shadow:0 7px 0 #101436;color:#101436}.arrow.next{outline:8px solid rgba(255,59,48,.65);background:#ffc83d;animation:btnPulse .85s infinite}.arrow:active{transform:translateY(6px);box-shadow:0 1px 0 #101436}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81;color:#101436}.reward{display:none;margin-top:12px;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:14px;text-align:center;font-size:20px;font-weight:900}.endBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.endBtns button{border:4px solid #101436;border-radius:18px;padding:13px 8px;font-size:16px;font-weight:900;background:#ffc83d;box-shadow:0 6px 0 rgba(0,0,0,.22);color:#101436}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes dashH{to{background-position:-66px 0}}@keyframes dashV{to{background-position:0 -66px}}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 26px rgba(255,200,61,.8)}}@keyframes btnPulse{50%{transform:scale(1.08)}}@keyframes bob{50%{transform:translateY(6px)}}@keyframes bump{50%{transform:translateX(-10px) rotate(-8deg)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:520px){body{padding:8px}.hud{grid-template-columns:repeat(2,1fr)}.town{height:350px}.spot{width:56px;height:56px;font-size:30px}.car{width:54px;height:54px;font-size:48px}.pad{grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px 64px}.actions,.endBtns{grid-template-columns:1fr}.prompt{font-size:21px}.nextBox{font-size:19px}}</style></head><body><main class="game"><section class="top"><div class="tag">🎮 Real driving game</div><h1>🚗 Traffic Town</h1><p class="sub">Move the car with arrows. Follow the guide. Reach the goal.</p></section><section class="hud"><div class="pill">⭐ XP <span id="xp">0</span></div><div class="pill">🏁 Level <span id="level">1</span>/5</div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏆 <span id="badges">0</span></div></section><div class="garage" id="garage"></div><section class="stage"><div class="town" id="town"><div class="roadH"></div><div class="roadV"></div><div class="grass g1">🌳</div><div class="grass g2">🌼</div><div class="grass g3">🌲</div><div class="grass g4">🌷</div><div id="scene"></div><div class="guide-arrow" id="guideArrow">Goal ↓</div><div class="car" id="car">🚗</div></div><div class="panel"><div class="level-title" id="levelTitle">Level 1 — Left or Right</div><div class="prompt game-focus-target" id="prompt">Use the arrows to drive to the glowing goal.</div><div class="hint" id="hint">Move one space at a time.</div><div class="nextBox" id="nextBox"><b>👀 Next move</b>Tap an arrow.</div><div class="pad" aria-label="Driving controls"><button class="arrow up" data-move="up">↑</button><button class="arrow left" data-move="left">←</button><button class="arrow right" data-move="right">→</button><button class="arrow down" data-move="down">↓</button></div><div class="actions"><button class="small" id="garageBtn">🚗 Garage</button><button class="small" id="hornBtn">📣 Horn</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></div></section></main><div class="popup" id="popup">Good drive!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let level=1,step=0,xp=0,streak=0,badges=0,unlocked=1,car={x:3,y:3},holding=null,locked=false;const $=id=>document.getElementById(id);const cars=['🚗 Red Car','🚓 Police Car','🚒 Fire Truck','🚙 Monster Truck','🏎️ Race Car','🍦 Ice Cream Truck','✨ Gold Car'];const X={L:1,C:3,R:5},Y={T:1,M:3,B:5};const missions=[{lvl:1,title:'Level 1 — Left or Right',q:'Drive LEFT to the glowing arrow.',hint:'Tap ← until you reach the arrow.',start:{x:X.C,y:Y.M},spots:[{type:'goal',x:X.L,y:Y.M,icon:'⬅️'}]},{lvl:1,title:'Level 1 — Left or Right',q:'Drive RIGHT to the glowing arrow.',hint:'Tap → until you reach the arrow.',start:{x:X.C,y:Y.M},spots:[{type:'goal',x:X.R,y:Y.M,icon:'➡️'}]},{lvl:2,title:'Level 2 — Road Signs',q:'Road sign: STOP. Drive to the STOP sign.',hint:'Tap ↑ to reach STOP. Avoid candy.',start:{x:X.C,y:Y.B},spots:[{type:'goal',x:X.C,y:Y.T,icon:'🛑'},{type:'bad',x:X.R,y:Y.M,icon:'🍬'}]},{lvl:2,title:'Level 2 — Road Signs',q:'School sign. Drive to the SCHOOL.',hint:'Go up, then right to the school.',start:{x:X.C,y:Y.B},spots:[{type:'goal',x:X.R,y:Y.M,icon:'🏫'},{type:'bad',x:X.L,y:Y.M,icon:'⚡'}]},{lvl:3,title:'Level 3 — Parking',q:'Park in the RED space.',hint:'Drive left, then down to red parking.',start:{x:X.C,y:Y.M},spots:[{type:'goal',x:X.L,y:Y.B,icon:'🟥'},{type:'bad',x:X.C,y:Y.B,icon:'🟦'}]},{lvl:3,title:'Level 3 — Parking',q:'Park in the BLUE space.',hint:'Drive down to blue parking.',start:{x:X.C,y:Y.M},spots:[{type:'goal',x:X.C,y:Y.B,icon:'🟦'},{type:'bad',x:X.R,y:Y.B,icon:'🟩'}]},{lvl:4,title:'Level 4 — Deliveries',q:'Pick up 🍎 apples. Deliver them to the house.',hint:'First drive left to apples. Then drive right to the house.',start:{x:X.C,y:Y.M},spots:[{type:'pickup',x:X.L,y:Y.M,icon:'🍎'},{type:'goal',x:X.R,y:Y.M,icon:'🏠',need:'🍎'}]},{lvl:4,title:'Level 4 — Deliveries',q:'Pick up 🥛 milk. Deliver it to the school.',hint:'First drive right to milk. Then drive left to the school.',start:{x:X.C,y:Y.M},spots:[{type:'pickup',x:X.R,y:Y.M,icon:'🥛'},{type:'goal',x:X.L,y:Y.M,icon:'🏫',need:'🥛'}]},{lvl:5,title:'Level 5 — Fuel',q:'Collect healthy fuel. Avoid candy.',hint:'Drive to healthy food only.',start:{x:X.C,y:Y.M},spots:[{type:'goal',x:X.L,y:Y.M,icon:'🥑'},{type:'bad',x:X.C,y:Y.T,icon:'🍬'},{type:'goal',x:X.R,y:Y.M,icon:'🥕'}]},{lvl:5,title:'Level 5 — Fuel',q:'Collect healthy fuel. Avoid junk food.',hint:'Drive to milk. Do not hit donut.',start:{x:X.C,y:Y.B},spots:[{type:'goal',x:X.C,y:Y.T,icon:'🥛'},{type:'bad',x:X.L,y:Y.M,icon:'🍩'}]}];function cellX(x){return 8+x*14}function cellY(y){return 7+y*15}function sound(n){try{window.SeanGameSounds&&SeanGameSounds[n]&&SeanGameSounds[n]()}catch(e){}}function speak(t){try{window.SeanGameVoice&&SeanGameVoice.speak&&SeanGameVoice.speak(t)}catch(e){}}function pop(t){const p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function garage(){ $('garage').innerHTML=cars.map((c,i)=>'<div class="car-chip '+(i>=unlocked?'locked':'')+'">'+(i>=unlocked?'🔒 ':c)+'</div>').join('')}function current(){return missions[step]}function target(){const m=current();return m.spots.find(s=>s.type==='pickup'&&!s.done)||m.spots.find(s=>s.type==='goal'&&!s.done)}function nextDir(){const t=target();if(!t)return null;const dx=t.x-car.x,dy=t.y-car.y;if(Math.abs(dx)>=Math.abs(dy)&&dx!==0)return dx>0?'right':'left';if(dy!==0)return dy>0?'down':'up';return null}function dirLabel(d){return {left:'← Left',right:'→ Right',up:'↑ Up',down:'↓ Down'}[d]||'Goal'}function render(){if(step>=missions.length)return finish();const m=current();level=m.lvl;car={...m.start};holding=null;locked=false;m.spots.forEach(s=>s.done=false);$('level').textContent=level;$('levelTitle').textContent=m.title;$('prompt').textContent=m.q;$('hint').textContent=m.hint;$('xp').textContent=xp;$('streak').textContent=streak;$('badges').textContent=badges;$('reward').style.display='none';$('guideArrow').style.display='block';garage();draw();speak('Follow the guide.')}function draw(){const m=current();$('scene').innerHTML=m.spots.map((s,i)=>'<div class="spot '+(s.type==='goal'&&!s.done?'goal ':'')+(s.type==='pickup'&&!s.done?'pickup ':'')+(s.type==='bad'?'bad ':'')+(s.done?'done ':'')+'" style="left:calc('+cellX(s.x)+'% - 33px);top:calc('+cellY(s.y)+'% - 33px)">'+s.icon+'</div>').join('');const c=$('car');c.style.left='calc('+cellX(car.x)+'% - 31px)';c.style.top='calc('+cellY(car.y)+'% - 31px)';const t=target();if(t){const a=$('guideArrow');a.style.left='calc('+cellX(t.x)+'% - 58px)';a.style.top='calc('+cellY(t.y)+'% - 62px)';a.textContent=t.type==='pickup'?'Pick up ↓':'Goal ↓'}updateNext()}function updateNext(){document.querySelectorAll('.arrow').forEach(b=>b.classList.remove('next'));const d=nextDir();if(!d){$('nextBox').innerHTML='<b>👀 Next move</b>You are there.';return}const btn=document.querySelector('.arrow[data-move="'+d+'"]');if(btn)btn.classList.add('next');$('nextBox').innerHTML='<b>👀 Next move</b>Tap '+dirLabel(d)+'.';}function move(d){if(locked||step>=missions.length)return;let nx=car.x,ny=car.y;if(d==='left')nx-=1;if(d==='right')nx+=1;if(d==='up')ny-=1;if(d==='down')ny+=1;if(nx<1||nx>5||ny<1||ny>5){bump('Stay inside town.');return}car.x=nx;car.y=ny;sound('tap');draw();checkHit()}function checkHit(){const m=current();const hit=m.spots.find(s=>!s.done&&s.x===car.x&&s.y===car.y);if(!hit)return;if(hit.type==='bad'){streak=0;$('streak').textContent=streak;bump('Oops. That slows the car. Try again.');sound('wrong');return}if(hit.type==='pickup'){holding=hit.icon;hit.done=true;pop('Picked up '+hit.icon);sound('coin');$('hint').textContent='You have '+holding+'. Now go to the glowing goal.';draw();return}if(hit.type==='goal'){if(hit.need&&holding!==hit.need){bump('Pick up '+hit.need+' first.');return}completeMission(hit)}}function bump(msg){const c=$('car');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');pop(msg);$('hint').textContent=msg;draw()}function completeMission(hit){locked=true;hit.done=true;xp+=50;streak++;$('xp').textContent=xp;$('streak').textContent=streak;pop('⭐ Good drive!');sound('correct');speak('Correct, you got it!');confetti();setTimeout(()=>{step++;if(step===2||step===4||step===6||step===8||step===10){badges++;unlocked=Math.min(cars.length,unlocked+1)}render()},850)}function finish(){badges++;unlocked=Math.min(cars.length,unlocked+1);$('levelTitle').textContent='🏁 Traffic Town Complete';$('prompt').textContent='You reached the finish and earned a Driver Badge!';$('hint').textContent='You drove, parked, delivered, and collected fuel.';$('scene').innerHTML='<div class="spot goal" style="left:calc(50% - 33px);top:calc(50% - 33px)">🏆</div>';$('guideArrow').style.display='none';$('nextBox').innerHTML='<b>🏆 Complete</b>Choose what to do next.';$('reward').style.display='block';$('reward').innerHTML='🏆 Driver Badge · ⭐ XP '+xp+'<div class="endBtns"><button onclick="location.reload()">🔁 Play Again</button><button onclick="window.dispatchEvent(new CustomEvent(\'seanGameNextLevelRequest\'))">🚀 Next Level</button><button onclick="location.href=\'/games/\'">🏠 Main Menu</button></div>';$('badges').textContent=badges;garage();sound('levelUp');confetti()}function confetti(){['⭐','🚗','🎨','🛞','✨'].forEach((x,i)=>{const d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(12+i*18+Math.random()*8)+'vw';d.style.animationDelay=(i*.05)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)})}document.querySelectorAll('.arrow').forEach(b=>b.onclick=()=>move(b.dataset.move));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move('left');if(e.key==='ArrowRight')move('right');if(e.key==='ArrowUp')move('up');if(e.key==='ArrowDown')move('down')});$('restartBtn').onclick=()=>location.reload();$('hornBtn').onclick=()=>{pop('📣 Beep beep!');sound('tap')};$('garageBtn').onclick=()=>pop('Garage: unlock more cars!');render();</script><script src="/games/game-rules.js"></script>
<script src="/games/guide-robot.js"></script>
</body></html>
