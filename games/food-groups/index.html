<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Natural Food | Mini Game</title><meta name="description" content="A bilingual mini game about natural foods, nutrients, simple meals, health and food patterns."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/food-groups/"><link rel="icon" type="image/png" href="https://hypnoticmeditations.b-cdn.net/images/fav/headphones.png"><meta name="theme-color" content="#52bd59"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eaffc9,#80dc7f 58%,#39a557);color:#173319;padding:12px;-webkit-tap-highlight-color:transparent}.game{max-width:610px;margin:0 auto;background:#fffbe8;border:5px solid #1f7a39;border-radius:30px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.18)}.top{background:linear-gradient(135deg,#2f9d42,#9af56b);padding:16px;text-align:center;border-bottom:5px solid #1f7a39}h1{margin:0;font-size:33px;line-height:1}.sub{font-size:18px;font-weight:900;margin-top:8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#efffdc;border-bottom:4px solid #1f7a39}.pill{background:#fff;border:3px solid #1f7a39;border-radius:16px;padding:8px 4px;text-align:center;font-size:16px;font-weight:900}.xp{height:18px;background:#d8f3c5;border:3px solid #1f7a39;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffcf33,#ff7a18,#52bd59);transition:width .35s}.stage{text-align:center;padding:10px 16px 18px}.food{font-size:88px;animation:bob 1.5s infinite ease-in-out}.group{display:inline-block;background:#e9fbff;border:3px solid #aeeaff;border-radius:999px;padding:7px 13px;font-size:17px;font-weight:900;margin:8px}.question{font-size:29px;line-height:1.08;font-weight:900;background:#fff;border:4px solid #1f7a39;border-radius:24px;padding:16px;margin:8px 0 10px}.msg{font-size:21px;line-height:1.18;font-weight:900;margin:9px 0 14px;min-height:48px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:0;border-radius:22px;padding:11px 7px;font-weight:900;min-height:96px;color:#173319;box-shadow:0 7px 0 #1f7a39;background:#dbffbe;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.choice:nth-child(2){background:#e9fbff;box-shadow:0 7px 0 #62abc3}.choice:nth-child(3){background:#fff0a8;box-shadow:0 7px 0 #bd8610}.choice:nth-child(4){background:#ffe1ef;box-shadow:0 7px 0 #c26689}.choice:active,.choice.hit{transform:translateY(6px);box-shadow:0 1px 0 #1f7a39}.choiceIcon{font-size:38px}.choiceText{font-size:18px;line-height:1.05}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:16px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81}.reward{display:none;background:#fff;border:4px solid #ff9f1c;border-radius:22px;padding:14px;margin-top:14px;font-size:19px;font-weight:900;line-height:1.25}.meal{display:grid;gap:8px;margin-top:10px;text-align:left}.meal div{background:#f1ffe8;border:3px solid #bde7bf;border-radius:16px;padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fffbe8;border:5px solid #1f7a39;border-radius:28px;max-width:500px;width:100%;padding:20px;text-align:center}.manual ol{text-align:left;font-size:21px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#83ff73;box-shadow:0 7px 0 #3f9b35;width:100%}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #1f7a39;border-radius:28px;padding:22px 28px;font-size:33px;font-weight:900;z-index:30;opacity:0;pointer-events:none}.popup.show{animation:pop .85s ease forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25;pointer-events:none}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:390px){h1{font-size:28px}.food{font-size:76px}.question{font-size:25px}.choice{min-height:86px}.choiceIcon{font-size:34px}.choiceText{font-size:16px}.pill{font-size:14px}.small{font-size:14px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2 id="manualTitle">📘 How to Play</h2><ol id="manualList"></ol><button id="closeManual">Let's go!</button></div></div><main class="game"><section class="top"><h1 id="title">🥑 Natural Food</h1><div class="sub" id="sub">Play through food patterns</div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">🏆 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></div></div><section class="stage"><div class="food" id="food">🥑</div><div class="group" id="group">Group</div><div class="question" id="question">Question</div><div class="msg" id="msg">Tap the best answer.</div><div class="choices" id="choices"></div><div class="controls"><button class="small" id="manualBtn">📘 How</button><button class="small" id="voiceBtn">🔊 Voice</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></section></main><div class="popup" id="popup">Yes!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,streak=0,round=0,hearts=3,current=null,voiceOn=true,lastLang=null,wrongRun=0;const total=10,key='foodChefBadges';let badges=JSON.parse(localStorage.getItem(key)||'[]');const $=id=>document.getElementById(id);function lang(){return localStorage.getItem('seanGameLang')||'en'}function T(en,es){return lang()==='es'?es:en}function tx(v){return Array.isArray(v)?T(v[0],v[1]):v}const nutrientKeys=['protein','vitaminC','healthyFat','carb','vitaminA','calcium','fiber','potassium','iron','sodaSugar'];const nutrients={protein:{icon:'💪',name:['Protein','Proteína']},vitaminC:{icon:'🍊',name:['Vitamin C','Vitamina C']},healthyFat:{icon:'🥑',name:['Healthy fat','Grasa saludable']},carb:{icon:'⚡',name:['Carbohydrate','Carbohidrato']},vitaminA:{icon:'👀',name:['Vitamin A','Vitamina A']},calcium:{icon:'🦴',name:['Calcium','Calcio']},fiber:{icon:'🌿',name:['Fiber','Fibra']},potassium:{icon:'🍌',name:['Potassium','Potasio']},iron:{icon:'🧲',name:['Iron','Hierro']},sodaSugar:{icon:'🥤',name:['Soda sugar','Azúcar de soda']}};const copy={title:['🥑 Natural Food','🥑 Comida Natural'],sub:['Play through food patterns','Juega con patrones de comida'],tap:['Tap the best answer.','Toca la mejor respuesta.'],manualTitle:['📘 How to Play','📘 Cómo jugar'],manual:[['Look at the natural food.','Mira el alimento natural.'],['Tap what it has most.','Toca qué tiene más.'],['Win stars and protect your hearts.','Gana estrellas y cuida tus corazones.'],['Unlock simple meal ideas at the end.','Desbloquea comidas simples al final.']],go:["Let's go!",'¡Vamos!'],how:['📘 How','📘 Cómo'],voice:['🔊 Voice','🔊 Voz'],muted:['🔇 Voice','🔇 Voz'],new:['🔁 New','🔁 Nuevo'],correct:['Correct!','¡Correcto!'],almost:['Almost','Casi'],answer:['Answer: ','Respuesta: '],passed:['You passed','Pasaste'],practice:['Keep practicing','Sigue practicando'],tryAgain:['Try again.','Intenta otra vez.'],grade:['Grade ','Nota '],earned:['You earned ','Ganaste '],simpleMeals:['🍽️ Simple meals unlocked:','🍽️ Comidas simples desbloqueadas:'],collection:['Collection: ','Colección: '],playAgain:['Play again 🔁','Jugar otra vez 🔁'],seeMeals:['See meals 🍽️','Ver comidas 🍽️']};let foods=[{e:'🥚',g:['Protein','Proteína'],q:['What does an egg have a lot of?','¿Qué tiene mucho el huevo?'],a:'protein',tip:['It helps build strong muscles.','Ayuda a construir músculos fuertes.'],meal:['🥚 Egg + 🥔 potato + 🥑 avocado = strong plate.','🥚 Huevo + 🥔 papa + 🥑 aguacate = plato fuerte.']},{e:'🍊',g:['Fruit','Fruta'],q:['What vitamin does an orange have a lot of?','¿Qué vitamina tiene mucha la naranja?'],a:'vitaminC',tip:['It helps support your defenses.','Ayuda a cuidar las defensas.'],meal:['🍊 Orange + 🍌 banana = sweet snack.','🍊 Naranja + 🍌 banana = merienda dulce.']},{e:'🥑',g:['Healthy fat','Grasa saludable'],q:['What does avocado have a lot of?','¿Qué tiene mucho el aguacate?'],a:'healthyFat',tip:['It gives smooth steady energy.','Ayuda a dar energía suave.'],meal:['🥑 Avocado + 🥚 egg + 🍞 toast = rich breakfast.','🥑 Aguacate + 🥚 huevo + 🍞 tostada = desayuno rico.']},{e:'🥔',g:['Natural energy','Energía natural'],q:['What gives natural energy?','¿Qué da mucha energía natural?'],a:'carb',tip:['It helps you move, play and think.','Ayuda a moverte, jugar y pensar.'],meal:['🥔 Potato + 🥩 beef + 🥗 salad = simple meal.','🥔 Papa + 🥩 carne + 🥗 ensalada = comida simple.']},{e:'🥩',g:['Protein','Proteína'],q:['What does beef have a lot of?','¿Qué tiene mucho la carne?'],a:'protein',tip:['It helps the body grow strong.','Ayuda a crecer fuerte.'],meal:['🥩 Ground beef + 🥔 potato + 🥑 avocado = power plate.','🥩 Carne molida + 🥔 papa + 🥑 aguacate = plato poderoso.']},{e:'🥕',g:['Vegetable','Vegetal'],q:['What vitamin helps the eyes?','¿Qué vitamina ayuda a los ojos?'],a:'vitaminA',tip:['Carrot has vitamin A.','La zanahoria tiene vitamina A.'],meal:['🥕 Carrot + 🍚 rice + 🍗 chicken = colorful lunch.','🥕 Zanahoria + 🍚 arroz + 🍗 pollo = almuerzo de colores.']},{e:'🥛',g:['Calcium','Calcio'],q:['What mineral helps bones?','¿Qué mineral ayuda a los huesos?'],a:'calcium',tip:['Calcium supports bones and teeth.','El calcio ayuda a huesos y dientes.'],meal:['🥛 Milk + 🥣 oats + 🍌 banana = quick breakfast.','🥛 Leche + 🥣 avena + 🍌 banana = desayuno rápido.']},{e:'🫘',g:['Fiber','Fibra'],q:['What do beans have a lot of?','¿Qué tienen mucho los frijoles?'],a:'fiber',tip:['Fiber helps the belly feel good.','La fibra ayuda a la barriga.'],meal:['🫘 Beans + 🍚 rice + 🥚 egg = complete plate.','🫘 Frijoles + 🍚 arroz + 🥚 huevo = plato completo.']},{e:'🍌',g:['Fruit','Fruta'],q:['What mineral does banana have?','¿Qué mineral tiene la banana?'],a:'potassium',tip:['Potassium helps muscles.','El potasio ayuda a los músculos.'],meal:['🍌 Banana + 🥣 oats + 🥛 milk = quick energy.','🍌 Banana + 🥣 avena + 🥛 leche = energía rápida.']},{e:'🥬',g:['Green vegetable','Vegetal verde'],q:['What does spinach have a lot of?','¿Qué tiene mucho la espinaca?'],a:'iron',tip:['Iron helps the body feel strong.','El hierro ayuda al cuerpo a sentirse fuerte.'],meal:['🥬 Spinach + 🥚 egg + 🧀 cheese = green omelet.','🥬 Espinaca + 🥚 huevo + 🧀 queso = omelet verde.']}];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(foods);function guide(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.guidance(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function popup(t){let p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){const p=['⭐','🥑','🍓','✨','🥕','🏆','🍽️'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function optionName(k){return tx(nutrients[k].name)}function choices(ans){let a=[ans];while(a.length<4){let o=nutrientKeys[Math.floor(Math.random()*nutrientKeys.length)];if(!a.includes(o))a.push(o)}return a.sort(()=>Math.random()-.5)}function baseUi(){lastLang=lang();$('title').textContent=tx(copy.title);$('sub').textContent=tx(copy.sub);$('manualTitle').textContent=tx(copy.manualTitle);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+tx(x)+'</li>').join('');$('closeManual').textContent=tx(copy.go);$('manualBtn').textContent=tx(copy.how);$('voiceBtn').textContent=voiceOn?tx(copy.voice):tx(copy.muted);$('restartBtn').textContent=tx(copy.new);document.documentElement.lang=lang()}function render(){baseUi();if(round>=total||hearts<=0)return end();current=foods[round];$('score').textContent=score;$('streak').textContent=streak;$('hearts').textContent=hearts;$('round').textContent=round+1;$('bar').style.width=(round/total*100)+'%';$('food').textContent=current.e;$('group').textContent=tx(current.g);$('question').textContent=tx(current.q);$('msg').textContent=tx(copy.tap);$('reward').style.display='none';let c=$('choices');c.innerHTML='';choices(current.a).forEach(o=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">'+nutrients[o].icon+'</span><span class="choiceText">'+optionName(o)+'</span>';b.onclick=()=>answer(o,b);c.appendChild(b)})}function answer(o,b){b.classList.add('hit');if(o===current.a){wrongRun=0;score++;streak++;sound('ding');popup(tx(copy.correct)+' '+nutrients[o].icon);confetti();$('msg').textContent=nutrients[o].icon+' '+tx(current.tip)}else{wrongRun++;streak=0;hearts--;sound('wrong');popup(tx(copy.almost)+' 😄');let text=tx(copy.answer)+nutrients[current.a].icon+' '+optionName(current.a)+'. '+tx(current.tip);$('msg').textContent=text;if(wrongRun>=2||hearts<=1)guide(text)}setTimeout(()=>{round++;render()},1200)}function end(){baseUi();wrongRun=0;$('bar').style.width='100%';let pass=score>=7,grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C',badge=pass?T('👩‍🍳 Natural Chef','👩‍🍳 Chef Natural'):T('🌱 Natural Apprentice','🌱 Aprendiz Natural');if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');$('food').textContent=pass?'👩‍🍳':'🌱';$('group').textContent=pass?tx(copy.passed):tx(copy.practice);$('question').textContent=(pass?tx(copy.passed)+'! ':tx(copy.tryAgain)+' ')+tx(copy.grade)+grade;$('msg').textContent=score+'/'+total+' · '+tx(copy.earned)+badge+'.';let c=$('choices');c.innerHTML='';[[copy.playAgain,reset,'🔁'],[copy.seeMeals,showMeals,'🍽️']].forEach(x=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">'+x[2]+'</span><span class="choiceText">'+tx(x[0])+'</span>';b.onclick=x[1];c.appendChild(b)});showMeals();popup(pass?badge:tx(copy.almost));confetti(pass?34:16)}function showMeals(){let r=$('reward');r.style.display='block';let picked=foods.slice(0,Math.max(score,4)).slice(0,6);r.innerHTML='<div>'+tx(copy.simpleMeals)+'</div><div class="meal">'+picked.map(f=>'<div>'+tx(f.meal)+'</div>').join('')+'</div><div>'+tx(copy.collection)+badges.join(' ')+'</div>'}function reset(){score=0;streak=0;round=0;hearts=3;wrongRun=0;shuffle(foods);render()}manualBtn.onclick=()=>{baseUi();modal.classList.add('show')};closeManual.onclick=()=>modal.classList.remove('show');voiceBtn.onclick=()=>{voiceOn=!voiceOn;baseUi();if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};restartBtn.onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script></body></html>
