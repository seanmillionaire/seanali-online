<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Angelique's Food Word Lab | English Vocabulary Game</title>
  <meta name="description" content="Learn 20 English food words by seeing, hearing, saying, recognizing, and writing each word.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://seanali.online/games/food-groups/">
  <meta name="theme-color" content="#7d4cff">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 4%,#fff26f,transparent 22%),radial-gradient(circle at 90% 12%,#b9ffe1,transparent 25%),linear-gradient(180deg,#ffb7de,#d8c8ff 48%,#aeeaff);color:#18143d;padding:12px;-webkit-tap-highlight-color:transparent}.game{width:100%;max-width:760px;margin:0 auto;background:#fffdf5;border:4px solid #1d144b;border-radius:32px;overflow:hidden;box-shadow:0 15px 0 rgba(29,20,75,.2)}.top{text-align:center;padding:18px;background:linear-gradient(135deg,#7d4cff,#00bfe8 58%,#34d17a);color:#fff;border-bottom:4px solid #1d144b}.tag{display:inline-block;background:#fff;color:#1d144b;border:3px solid #ffc83d;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:9px}.top h1{font-size:clamp(35px,8vw,60px);line-height:.9;margin:0;text-shadow:0 4px 0 rgba(0,0,0,.2)}.top p{font-size:18px;font-weight:900;margin:9px 0 0}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#f1ecff;border-bottom:3px solid #1d144b}.pill{background:#fff;border:3px solid #1d144b;border-radius:15px;padding:7px 4px;text-align:center;font-size:14px;font-weight:900}.progress{height:18px;margin:10px 14px 0;border:3px solid #1d144b;border-radius:999px;background:#fff;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff63ae,#ffc83d,#34d17a);transition:width .3s}.wordNav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 7px}.wordDot{flex:0 0 auto;width:38px;height:38px;border:3px solid #1d144b;border-radius:50%;background:#fff;font-size:14px;font-weight:900;color:#1d144b}.wordDot.active{background:#ffc83d}.wordDot.done{background:#b9ffe1}.stage{text-align:center;padding:8px 16px 20px}.phase{display:inline-block;margin:5px 0 8px;padding:7px 13px;border:3px solid #7d4cff;border-radius:999px;background:#f1e8ff;color:#4e278a;font-weight:900}.picture{font-size:clamp(72px,18vw,116px);line-height:1;margin:4px 0;filter:drop-shadow(0 7px 0 rgba(29,20,75,.12))}.prompt{font-size:clamp(27px,7vw,44px);line-height:1.03;font-weight:900;background:#fff;border:4px solid #1d144b;border-radius:25px;padding:16px;margin:7px 0;box-shadow:0 7px 0 rgba(29,20,75,.14)}.english{color:#e92878}.spanish{font-size:23px;font-weight:900;color:#176e75;margin:7px 0}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:12px 0}.letter{display:grid;place-items:center;min-width:36px;height:43px;padding:0 7px;border:3px solid #1d144b;border-radius:10px;background:#fff4a8;font-size:23px;font-weight:900;text-transform:uppercase}.instruction{min-height:52px;background:#e9fbff;border:3px solid #4bb8d1;border-radius:18px;padding:10px;font-size:18px;line-height:1.2;font-weight:900;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn,.choice{border:3px solid #1d144b;border-radius:19px;padding:14px 10px;min-height:58px;font-size:18px;font-weight:900;color:#18143d;background:#fff;box-shadow:0 6px 0 #1d144b;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#fff26f,#ffc83d)}.btn.voice{background:linear-gradient(180deg,#b9ffe1,#62e59b)}.btn.mic{background:linear-gradient(180deg,#ffd8eb,#ff7db8)}.btn:active,.choice:active{transform:translateY(5px);box-shadow:0 1px 0 #1d144b}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;font-size:20px}.choice.correct{background:#b9ffe1}.choice.wrong{background:#ffd1d1}.writeBox{display:grid;gap:10px}.writeBox input{width:100%;border:4px solid #1d144b;border-radius:18px;padding:15px;font-size:25px;font-weight:900;text-align:center;color:#18143d;background:#fff}.writeBox input:focus{outline:6px solid rgba(0,191,232,.25)}.smallRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.small{border:0;border-radius:15px;padding:11px 6px;font-size:14px;font-weight:900;background:#f1e8ff;color:#18143d;box-shadow:0 5px 0 #aa8dcc}.mastery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:11px 0}.skill{border:2px solid #b9afd8;border-radius:12px;padding:7px 3px;background:#fff;color:#675d83;font-size:12px;font-weight:900}.skill.on{background:#b9ffe1;border-color:#34a96f;color:#155c3c}.finish{display:none;background:#fff;border:4px solid #1d144b;border-radius:25px;padding:18px;margin-top:10px}.finish h2{font-size:32px;margin:0 0 8px}.wordList{display:grid;grid-template-columns:1fr 1fr;gap:7px;text-align:left;margin:12px 0}.wordList div{border:2px solid #cfc5e8;border-radius:12px;padding:8px;background:#faf7ff;font-weight:900}.popup{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%) scale(.75);background:#fff;border:5px solid #1d144b;border-radius:25px;padding:20px 25px;font-size:28px;font-weight:900;z-index:40;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .8s forwards}.confetti{position:fixed;top:-30px;font-size:28px;animation:fall 1.25s linear forwards;z-index:35;pointer-events:none}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(280deg);opacity:0}}@media(max-width:520px){body{padding:8px}.hud{grid-template-columns:1fr 1fr}.actions,.choices{grid-template-columns:1fr}.wordList{grid-template-columns:1fr}.smallRow{grid-template-columns:1fr 1fr 1fr}.prompt{padding:13px}.picture{margin:0}.btn,.choice{min-height:55px}.wordDot{width:35px;height:35px}}
  </style>
</head>
<body>
  <main class="game">
    <section class="top">
      <div class="tag">🔒 Angelique's School Assignment</div>
      <h1>🍓 Food Word Lab</h1>
      <p>See it. Hear it. Say it. Write it.</p>
    </section>
    <section class="hud">
      <div class="pill">📚 Word <span id="wordNum">1</span>/20</div>
      <div class="pill">🎯 Step <span id="stepNum">1</span>/4</div>
      <div class="pill">⭐ <span id="stars">0</span></div>
      <div class="pill">✅ <span id="mastered">0</span>/20</div>
    </section>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="wordNav" id="wordNav" aria-label="Vocabulary words"></div>
    <section class="stage" id="stage">
      <div class="phase" id="phase">1 · Learn</div>
      <div class="picture" id="picture">🌭</div>
      <div class="prompt" id="prompt"></div>
      <div class="spanish" id="spanish"></div>
      <div class="letters" id="letters"></div>
      <div class="instruction" id="instruction"></div>
      <div id="activity"></div>
      <div class="mastery" id="mastery"></div>
      <div class="smallRow">
        <button class="small" id="hearBtn">🔊 Hear word</button>
        <button class="small" id="backBtn">← Back</button>
        <button class="small" id="resetBtn">🔁 Reset</button>
      </div>
      <div class="finish" id="finish"></div>
    </section>
  </main>
  <div class="popup" id="popup">Great job!</div>
  <script src="/games/breadcrumbs.js?v=6"></script>
  <script>
    const words=[
      {en:'sausage',es:'embutido',icon:'🌭'},
      {en:'butter',es:'mantequilla',icon:'🧈'},
      {en:'steak',es:'filete',icon:'🥩'},
      {en:'cucumber',es:'pepino',icon:'🥒'},
      {en:'pasta',es:'pasta',icon:'🍝'},
      {en:'lettuce',es:'lechuga',icon:'🥬'},
      {en:'corn',es:'maíz',icon:'🌽'},
      {en:'bread',es:'pan',icon:'🍞'},
      {en:'tuna',es:'atún',icon:'🐟'},
      {en:'cheese',es:'queso',icon:'🧀'},
      {en:'potatoes',es:'papas',icon:'🥔'},
      {en:'egg (boiled)',es:'huevo',icon:'🥚',say:'boiled egg',accepted:['egg boiled','boiled egg','egg']},
      {en:'onion',es:'cebolla',icon:'🧅'},
      {en:'seafood and fish',es:'mariscos y pescado',icon:'🦐🐟',accepted:['seafood and fish','sea food and fish','seafood fish']},
      {en:'yogurt',es:'yogur',icon:'🥣'},
      {en:'rice',es:'arroz',icon:'🍚'},
      {en:'salad',es:'ensalada',icon:'🥗'},
      {en:'beans',es:'frijoles',icon:'🫘'},
      {en:'coconut',es:'coco',icon:'🥥'},
      {en:'dairy products',es:'productos lácteos',icon:'🥛🧀',accepted:['dairy products','dairy product']}
    ];
    const phases=['Learn','Recognize','Say','Write'];
    const storeKey='angeliqueFoodVocabularyV1';
    const $=id=>document.getElementById(id);
    let saved={index:0,phase:0,stars:0,skills:{}};
    try{saved={...saved,...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch(e){}
    let index=Math.min(words.length-1,Number(saved.index)||0),phase=Math.min(3,Number(saved.phase)||0),stars=Number(saved.stars)||0,skills=saved.skills||{},attempts=0,locked=false;
    function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
    function accepted(w,value){const list=w.accepted||[w.en];return list.map(norm).includes(norm(value))}
    function skill(i){return skills[i]||{learn:false,recognize:false,say:false,write:false}}
    function save(){localStorage.setItem(storeKey,JSON.stringify({index,phase,stars,skills}))}
    function speakWord(){const w=words[index],text=w.say||w.en;if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=1.05;speechSynthesis.speak(u)}
    function sound(name){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;window.foodAudio=window.foodAudio||new C();const a=window.foodAudio,o=a.createOscillator(),g=a.createGain(),right=name!=='wrong';o.type=right?'triangle':'sawtooth';o.frequency.value=right?720:170;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.13,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(right ? .16 : .22));o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+(right ? .18 : .24))}catch(e){}}
    function pop(text){const p=$('popup');p.textContent=text;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}
    function confetti(){['⭐','🍓','🥥','🧀','✨','🌽'].forEach((x,i)=>{const d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(8+i*17+Math.random()*8)+'vw';d.style.animationDelay=i*.04+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)})}
    function letterBlocks(text,hide=false){return [...text].map(ch=>ch===' '?'<span style="width:14px"></span>':'<span class="letter">'+(hide?'•':ch)+'</span>').join('')}
    function mark(name){const s=skill(index);if(!s[name]){s[name]=true;skills[index]=s;stars++;sound('correct');confetti()}save()}
    function masteredCount(){return words.filter((_,i)=>{const s=skill(i);return s.learn&&s.recognize&&s.say&&s.write}).length}
    function updateChrome(){const s=skill(index);$('wordNum').textContent=index+1;$('stepNum').textContent=phase+1;$('stars').textContent=stars;$('mastered').textContent=masteredCount();$('bar').style.width=((index*4+phase)/(words.length*4)*100)+'%';$('wordNav').innerHTML=words.map((w,i)=>'<button class="wordDot '+(i===index?'active ':'')+(skill(i).write?'done':'')+'" data-i="'+i+'" title="'+w.en+'">'+(i+1)+'</button>').join('');document.querySelectorAll('.wordDot').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);phase=0;attempts=0;render()});$('mastery').innerHTML=phases.map((p,i)=>'<div class="skill '+(s[p.toLowerCase()]?'on':'')+'">'+(s[p.toLowerCase()]?'✓ ':'')+(i+1)+' '+p+'</div>').join('')}
    function next(){if(phase<3)phase++;else if(index<words.length-1){index++;phase=0}else return finish();attempts=0;locked=false;save();render()}
    function previous(){if(phase>0)phase--;else if(index>0){index--;phase=3}attempts=0;locked=false;save();render()}
    function good(label){locked=true;pop(label||'✅ Great job!');setTimeout(next,700)}
    function render(){locked=false;const w=words[index];$('finish').style.display='none';$('phase').textContent=(phase+1)+' · '+phases[phase];$('picture').textContent=w.icon;$('prompt').innerHTML='';$('spanish').textContent='';$('letters').innerHTML='';$('instruction').textContent='';$('activity').innerHTML='';updateChrome();if(phase===0)renderLearn(w);if(phase===1)renderRecognize(w);if(phase===2)renderSay(w);if(phase===3)renderWrite(w)}
    function renderLearn(w){$('prompt').innerHTML='<span class="english">'+w.en+'</span>';$('spanish').textContent='Spanish: '+w.es;$('letters').innerHTML=letterBlocks(w.en);$('instruction').textContent='Look at the picture. Read the English word. Tap Hear Word, then say it three times.';$('activity').innerHTML='<div class="actions"><button class="btn voice" id="listenLearn">🔊 Hear '+w.en+'</button><button class="btn primary" id="learnedBtn">I studied it →</button></div>';$('listenLearn').onclick=speakWord;$('learnedBtn').onclick=()=>{mark('learn');good('📚 Word studied!')}}
    function distractors(){const picks=[index];while(picks.length<4){const n=Math.floor(Math.random()*words.length);if(!picks.includes(n))picks.push(n)}return picks.sort(()=>Math.random()-.5)}
    function renderRecognize(w){$('prompt').textContent='Which English word means “'+w.es+'”?';$('spanish').textContent='Listen, then choose the word you recognize.';$('letters').innerHTML=letterBlocks(w.en,true);$('instruction').textContent='This is the recognition step. Listen carefully. Then find the matching English word.';$('activity').innerHTML='<div class="choices">'+distractors().map(i=>'<button class="choice" data-i="'+i+'">'+words[i].en+'</button>').join('')+'</div>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(locked)return;if(Number(b.dataset.i)===index){b.classList.add('correct');mark('recognize');good('👀 You recognized it!')}else{b.classList.add('wrong');attempts++;sound('wrong');$('instruction').textContent='Not that one. Listen again and look for the word that means “'+w.es+'”.';speakWord()}});setTimeout(speakWord,300)}
    function renderSay(w){$('prompt').innerHTML='Say: <span class="english">'+w.en+'</span>';$('spanish').textContent=w.es;$('letters').innerHTML=letterBlocks(w.en);$('instruction').textContent='Hear the model. Say the English word three times. Use the microphone when it is available.';const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(SpeechRecognition){$('activity').innerHTML='<div class="actions"><button class="btn voice" id="modelBtn">🔊 Hear model</button><button class="btn mic" id="micBtn">🎤 Check my voice</button></div><button class="btn" id="saidBtn" style="width:100%;margin-top:10px">🗣️ I practiced it aloud 3 times</button>';$('modelBtn').onclick=speakWord;$('micBtn').onclick=()=>listenForWord(SpeechRecognition,w);$('saidBtn').onclick=()=>{mark('say');good('🗣️ Strong speaking!')}}else{$('instruction').textContent='This browser cannot check the microphone. Hear the model, say it three times out loud, then confirm.';$('activity').innerHTML='<div class="actions"><button class="btn voice" id="modelBtn">🔊 Hear model</button><button class="btn mic" id="saidBtn">🗣️ I said it 3 times</button></div>';$('modelBtn').onclick=speakWord;$('saidBtn').onclick=()=>{mark('say');good('🗣️ Strong speaking!')}}}
    function listenForWord(Recognition,w){const r=new Recognition();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;$('micBtn').textContent='🎤 Listening…';$('instruction').textContent='Listening now. Say “'+(w.say||w.en)+'”.';r.onresult=e=>{const heard=[...e.results[0]].map(x=>x.transcript);if(heard.some(t=>accepted(w,t))){mark('say');good('🎤 Heard: '+heard[0])}else{attempts++;sound('wrong');$('micBtn').textContent='🎤 Try again';$('instruction').textContent='I heard “'+heard[0]+'”. Hear the model and try once more.'}};r.onerror=()=>{$('micBtn').textContent='🎤 Try again';$('instruction').textContent='The microphone did not catch that. Try again, or use “I said it” below.';if(!$('fallbackSay')){$('activity').insertAdjacentHTML('beforeend','<button class="btn mic" id="fallbackSay" style="width:100%;margin-top:10px">🗣️ I practiced it aloud</button>');$('fallbackSay').onclick=()=>{mark('say');good('🗣️ Speaking practiced!')}}};r.start()}
    function renderWrite(w){$('prompt').textContent='Write the English word';$('spanish').textContent=w.icon+' '+w.es;$('letters').innerHTML=letterBlocks(w.en,true);$('instruction').textContent='No guessing now. Type the complete English word from memory.';$('activity').innerHTML='<div class="writeBox"><input id="writeInput" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type the English word" placeholder="Type in English"><button class="btn primary" id="checkBtn">✏️ Check my spelling</button></div>';$('checkBtn').onclick=checkWriting;$('writeInput').onkeydown=e=>{if(e.key==='Enter')checkWriting()};setTimeout(()=>$('writeInput').focus(),80)}
    function checkWriting(){if(locked)return;const w=words[index],input=$('writeInput');if(accepted(w,input.value)){input.style.background='#b9ffe1';mark('write');good('✏️ Correct spelling!')}else{attempts++;sound('wrong');input.style.background='#ffdada';$('instruction').textContent=attempts<2?'Check every letter and try again. Tap Hear Word if you need it.':'Hint: it starts with “'+w.en[0].toUpperCase()+'” and has '+norm(w.en).replace(/ /g,'').length+' letters. Keep trying.';setTimeout(()=>{input.style.background='#fff';input.focus();input.select()},350)}}
    function finish(){$('phase').textContent='🏆 Assignment Complete';$('picture').textContent='🏆';$('prompt').textContent='Food Vocabulary Master';$('spanish').textContent='¡Excelente, Angelique!';$('letters').innerHTML='';$('instruction').textContent='You practiced all 20 words by seeing, hearing, saying, recognizing, and writing them.';$('activity').innerHTML='';$('bar').style.width='100%';const list=words.map(w=>'<div>'+w.icon+' '+w.en+' — '+w.es+'</div>').join('');$('finish').style.display='block';$('finish').innerHTML='<h2>⭐ '+stars+' stars</h2><p>All 20 class words completed.</p><div class="wordList">'+list+'</div><button class="btn primary" onclick="resetAll()">Practice again</button>';sound('levelUp');confetti();save()}
    function resetAll(){if(!confirm('Reset all Food Word Lab progress?'))return;index=0;phase=0;stars=0;skills={};attempts=0;save();render()}
    $('hearBtn').onclick=speakWord;$('backBtn').onclick=previous;$('resetBtn').onclick=resetAll;render();
  </script>
<script src="/games/game-rules.js"></script>
<script src="/games/guide-robot.js"></script>
</body>
</html>
