<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Comida Natural | Juego Educativo</title><meta name="description" content="Juego móvil educativo en español para aprender nutrientes, grupos de comida natural y comidas simples."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/food-groups/"><meta property="og:title" content="Comida Natural"><meta property="og:description" content="Aprende qué tiene cada alimento, gana estrellas y desbloquea comidas simples."><meta property="og:type" content="website"><meta property="og:url" content="https://seanali.online/games/food-groups/"><meta name="theme-color" content="#52bd59"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eaffc9,#80dc7f 58%,#39a557);color:#173319;padding:12px;-webkit-tap-highlight-color:transparent}.game{max-width:610px;margin:0 auto;background:#fffbe8;border:5px solid #1f7a39;border-radius:30px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.18)}.top{background:linear-gradient(135deg,#2f9d42,#9af56b);padding:16px;text-align:center;border-bottom:5px solid #1f7a39}h1{margin:0;font-size:33px;line-height:1}.sub{font-size:18px;font-weight:900;margin-top:8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#efffdc;border-bottom:4px solid #1f7a39}.pill{background:#fff;border:3px solid #1f7a39;border-radius:16px;padding:8px 4px;text-align:center;font-size:16px;font-weight:900}.xp{height:18px;background:#d8f3c5;border:3px solid #1f7a39;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffcf33,#ff7a18,#52bd59);transition:width .35s}.stage{text-align:center;padding:8px 16px 18px}.food{font-size:88px;animation:bob 1.5s infinite ease-in-out}.group{display:inline-block;background:#e9fbff;border:3px solid #aeeaff;border-radius:999px;padding:7px 13px;font-size:17px;font-weight:900;margin:8px}.question{font-size:29px;line-height:1.08;font-weight:900;background:#fff;border:4px solid #1f7a39;border-radius:24px;padding:16px;margin:8px 0 10px}.msg{font-size:21px;line-height:1.18;font-weight:900;margin:9px 0 14px;min-height:48px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:0;border-radius:22px;padding:11px 7px;font-weight:900;min-height:96px;color:#173319;box-shadow:0 7px 0 #1f7a39;background:#dbffbe;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.choice:nth-child(2){background:#e9fbff;box-shadow:0 7px 0 #62abc3}.choice:nth-child(3){background:#fff0a8;box-shadow:0 7px 0 #bd8610}.choice:nth-child(4){background:#ffe1ef;box-shadow:0 7px 0 #c26689}.choice:active,.choice.hit{transform:translateY(6px);box-shadow:0 1px 0 #1f7a39}.choiceIcon{font-size:38px}.choiceText{font-size:18px;line-height:1.05}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:16px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81}.reward{display:none;background:#fff;border:4px solid #ff9f1c;border-radius:22px;padding:14px;margin-top:14px;font-size:19px;font-weight:900;line-height:1.25}.meal{display:grid;gap:8px;margin-top:10px;text-align:left}.meal div{background:#f1ffe8;border:3px solid #bde7bf;border-radius:16px;padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fffbe8;border:5px solid #1f7a39;border-radius:28px;max-width:500px;width:100%;padding:20px;text-align:center}.manual ol{text-align:left;font-size:21px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#83ff73;box-shadow:0 7px 0 #3f9b35;width:100%}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #1f7a39;border-radius:28px;padding:22px 28px;font-size:33px;font-weight:900;z-index:30;opacity:0;pointer-events:none}.popup.show{animation:pop .85s ease forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25;pointer-events:none}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:390px){h1{font-size:28px}.food{font-size:76px}.question{font-size:25px}.choice{min-height:86px}.choiceIcon{font-size:34px}.choiceText{font-size:16px}.pill{font-size:14px}.small{font-size:14px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2>📘 Cómo jugar</h2><ol><li>Mira el alimento natural.</li><li>Toca qué tiene más.</li><li>Gana estrellas.</li><li>Al final desbloqueas comidas simples.</li></ol><button id="closeManual">¡Vamos!</button></div></div><main class="game"><section class="top"><h1>🥑 Comida Natural</h1><div class="sub">Aprende qué tiene cada alimento</div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">🏆 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></div></div><section class="stage"><div class="food" id="food">🥑</div><div class="group" id="group">Grupo</div><div class="question" id="question">Pregunta</div><div class="msg" id="msg">Toca la mejor respuesta.</div><div class="choices" id="choices"></div><div class="controls"><button class="small" id="manualBtn">📘 Cómo</button><button class="small" id="voiceBtn">🔊 Voz</button><button class="small" id="restartBtn">🔁 Nuevo</button></div><div class="reward" id="reward"></div></section></main><div class="popup" id="popup">¡Sí!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,streak=0,round=0,hearts=3,current=null,voiceOn=true;const total=10,key='foodChefBadges';let badges=JSON.parse(localStorage.getItem(key)||'[]');const icons={'Proteína':'💪','Vitamina C':'🍊','Grasa saludable':'🥑','Carbohidrato':'⚡','Vitamina A':'👀','Calcio':'🦴','Fibra':'🌿','Potasio':'🍌','Hierro':'🧲','Azúcar de soda':'🥤'};const foods=[{e:'🥚',g:'Proteína',q:'¿Qué tiene mucho el huevo?',a:'Proteína',tip:'Ayuda a construir músculos fuertes.',meal:'🥚 Huevo + 🥔 papa + 🥑 aguacate = plato fuerte.'},{e:'🍊',g:'Fruta',q:'¿Qué vitamina tiene mucha la naranja?',a:'Vitamina C',tip:'Ayuda a cuidar las defensas.',meal:'🍊 Naranja + 🍌 banana = merienda dulce.'},{e:'🥑',g:'Grasa saludable',q:'¿Qué tiene mucho el aguacate?',a:'Grasa saludable',tip:'Ayuda a dar energía suave.',meal:'🥑 Aguacate + 🥚 huevo + 🍞 tostada = desayuno rico.'},{e:'🥔',g:'Energía natural',q:'¿Qué da mucha energía natural?',a:'Carbohidrato',tip:'Ayuda a moverte y jugar.',meal:'🥔 Papa + 🥩 carne + 🥗 ensalada = comida simple.'},{e:'🥩',g:'Proteína',q:'¿Qué tiene mucho la carne?',a:'Proteína',tip:'Ayuda a crecer fuerte.',meal:'🥩 Carne molida + 🥔 papa + 🥑 aguacate = plato poderoso.'},{e:'🥕',g:'Vegetal',q:'¿Qué vitamina ayuda a los ojos?',a:'Vitamina A',tip:'La zanahoria tiene vitamina A.',meal:'🥕 Zanahoria + 🍚 arroz + 🍗 pollo = almuerzo de colores.'},{e:'🥛',g:'Calcio',q:'¿Qué mineral ayuda a los huesos?',a:'Calcio',tip:'El calcio ayuda a huesos y dientes.',meal:'🥛 Leche + 🥣 avena + 🍌 banana = desayuno rápido.'},{e:'🫘',g:'Fibra',q:'¿Qué tienen mucho los frijoles?',a:'Fibra',tip:'La fibra ayuda a la barriga.',meal:'🫘 Frijoles + 🍚 arroz + 🥚 huevo = plato completo.'},{e:'🍌',g:'Fruta',q:'¿Qué mineral tiene la banana?',a:'Potasio',tip:'El potasio ayuda a los músculos.',meal:'🍌 Banana + 🥣 avena + 🥛 leche = energía rápida.'},{e:'🥬',g:'Vegetal verde',q:'¿Qué tiene mucho la espinaca?',a:'Hierro',tip:'El hierro ayuda al cuerpo a sentirse fuerte.',meal:'🥬 Espinaca + 🥚 huevo + 🧀 queso = omelet verde.'}];const opts=Object.keys(icons);function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function popup(t){let p=document.getElementById('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){const p=['⭐','🥑','🍓','✨','🥕','🏆','🍽️'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function choices(ans){let a=[ans];while(a.length<4){let o=opts[Math.floor(Math.random()*opts.length)];if(!a.includes(o))a.push(o)}return a.sort(()=>Math.random()-.5)}function render(){if(round>=total||hearts<=0)return end();current=foods[round];document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('hearts').textContent=hearts;document.getElementById('round').textContent=round+1;document.getElementById('bar').style.width=(round/total*100)+'%';document.getElementById('food').textContent=current.e;document.getElementById('group').textContent=current.g;document.getElementById('question').textContent=current.q;document.getElementById('msg').textContent='Toca la mejor respuesta.';document.getElementById('reward').style.display='none';let c=document.getElementById('choices');c.innerHTML='';choices(current.a).forEach(o=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">'+icons[o]+'</span><span class="choiceText">'+o+'</span>';b.onclick=()=>answer(o,b);c.appendChild(b)});speak(current.q)}function answer(o,b){b.classList.add('hit');if(o===current.a){score++;streak++;sound('ding');popup('¡Correcto! '+icons[o]);confetti();document.getElementById('msg').textContent=icons[o]+' '+current.tip;speak('Correcto. '+current.tip)}else{streak=0;hearts--;sound('wrong');popup('Casi 😄');document.getElementById('msg').textContent='Era '+icons[current.a]+' '+current.a+'. '+current.tip;speak('Casi. La respuesta era '+current.a+'. '+current.tip)}setTimeout(()=>{round++;render()},1200)}function end(){document.getElementById('bar').style.width='100%';let pass=score>=7,grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C',badge=pass?'👩‍🍳 Chef Natural':'🌱 Aprendiz Natural';if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');document.getElementById('food').textContent=pass?'👩‍🍳':'🌱';document.getElementById('group').textContent=pass?'Pasaste':'Sigue practicando';document.getElementById('question').textContent=(pass?'¡Pasaste! ':'Intenta otra vez. ')+'Nota '+grade;document.getElementById('msg').textContent=score+'/'+total+' correctas. Ganaste '+badge+'.';let c=document.getElementById('choices');c.innerHTML='';['Jugar otra vez 🔁','Ver comidas 🍽️'].forEach((txt,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">'+(i?'🍽️':'🔁')+'</span><span class="choiceText">'+txt+'</span>';b.onclick=i?showMeals:reset;c.appendChild(b)});showMeals();popup(pass?'¡Chef Natural!':'Buen intento');confetti(pass?34:16);speak('Juego terminado. Tu nota es '+grade+'. Mira comidas simples que puedes hacer.')}function showMeals(){let r=document.getElementById('reward');r.style.display='block';let picked=foods.slice(0,Math.max(score,4)).slice(0,6);r.innerHTML='<div>🍽️ Comidas simples desbloqueadas:</div><div class="meal">'+picked.map(f=>'<div>'+f.meal+'</div>').join('')+'</div><div>Colección: '+badges.join(' ')+'</div>'}function reset(){score=0;streak=0;round=0;hearts=3;render()}manualBtn.onclick=()=>{modal.classList.add('show');speak('Mira el alimento natural. Toca qué tiene más. Gana estrellas. Al final desbloqueas comidas simples.')};closeManual.onclick=()=>modal.classList.remove('show');voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};restartBtn.onclick=reset;render();</script></body></html>
