<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panama Jungle Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #dfffe4, #8fd19e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: #173b22;
    }
    .game {
      width: 100%;
      max-width: 560px;
      background: #fffdf4;
      border: 4px solid #216b35;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .top {
      background: #216b35;
      color: white;
      padding: 18px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .badge {
      margin-top: 8px;
      font-size: 15px;
      opacity: .95;
    }
    .scene {
      padding: 24px;
      text-align: center;
    }
    .emoji {
      font-size: 72px;
      margin-bottom: 10px;
    }
    .story {
      font-size: 22px;
      line-height: 1.35;
      margin: 10px 0 20px;
      min-height: 120px;
    }
    .choices {
      display: grid;
      gap: 12px;
    }
    button {
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: #ffce4a;
      color: #173b22;
      box-shadow: 0 5px 0 #c79016;
      transition: transform .05s ease;
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #c79016;
    }
    .small {
      background: #e6f7e9;
      box-shadow: 0 5px 0 #8ebd96;
      font-size: 18px;
    }
    .score {
      padding: 12px 18px;
      background: #f1ffe8;
      border-top: 2px solid #c8e7c9;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
    }
    .question {
      font-size: 18px;
      background: #eaf8ff;
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 2px solid #b7e4f7;
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>🌿 Panama Jungle Explorer</h1>
      <div class="badge">A tiny thinking game for curious kids</div>
    </div>

    <div class="scene">
      <div id="emoji" class="emoji">🦋</div>
      <div id="question" class="question">Choose what happens next.</div>
      <div id="story" class="story"></div>
      <div id="choices" class="choices"></div>
    </div>

    <div class="score">
      <div>Jungle Stars: <span id="stars">0</span> ⭐</div>
      <div>Step: <span id="step">1</span>/7</div>
    </div>
  </div>

  <script>
    let stars = 0;
    let index = 0;

    const scenes = [
      {
        emoji: "🦋",
        question: "You find a glowing green door at the bottom of a giant tree.",
        story: "A blue butterfly lands on it and says, “Only smart jungle explorers may enter.”",
        choices: [
          ["Ask the butterfly a question", 1],
          ["Kick the door", 0],
          ["Run away forever", 0]
        ]
      },
      {
        emoji: "🐜",
        question: "Inside, tiny leaf-cutter ants are carrying green leaves.",
        story: "They look very busy. One ant drops its leaf.",
        choices: [
          ["Help the ant carry it", 1],
          ["Take the leaf crown", 0],
          ["Ask why ants work together", 1]
        ]
      },
      {
        emoji: "🦥",
        question: "A sleepy sloth blocks the jungle bridge.",
        story: "It moves very slowly and smiles at you.",
        choices: [
          ["Wait patiently", 1],
          ["Yell “hurry up!”", 0],
          ["Ask if it needs help", 1]
        ]
      },
      {
        emoji: "🐒",
        question: "A monkey steals your explorer hat.",
        story: "It climbs high and laughs.",
        choices: [
          ["Trade a mango for the hat", 1],
          ["Throw rocks", 0],
          ["Make a silly monkey face", 1]
        ]
      },
      {
        emoji: "🐸",
        question: "A bright frog sits on a wet leaf.",
        story: "It says, “Bright colors can mean danger. What should you do?”",
        choices: [
          ["Look, but do not touch", 1],
          ["Pick it up fast", 0],
          ["Ask why it is colorful", 1]
        ]
      },
      {
        emoji: "🌧️",
        question: "Rain starts falling hard in the jungle.",
        story: "The trees drip. The bugs sing. The ground gets muddy.",
        choices: [
          ["Find a safe dry spot", 1],
          ["Jump in every puddle first", 0],
          ["Listen to the rainforest sounds", 1]
        ]
      },
      {
        emoji: "🌈",
        question: "You reach a hidden waterfall.",
        story: "The butterfly says, “You may name this secret place.”",
        choices: [
          ["Name it Rainbow Jungle Falls", 1],
          ["Name it after your favorite animal", 1],
          ["Say waterfalls do not need names", 0]
        ]
      }
    ];

    function render() {
      const s = scenes[index];
      document.getElementById("emoji").textContent = s.emoji;
      document.getElementById("question").textContent = s.question;
      document.getElementById("story").textContent = s.story;
      document.getElementById("stars").textContent = stars;
      document.getElementById("step").textContent = Math.min(index + 1, scenes.length);

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      s.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice[0];
        btn.onclick = () => choose(choice[1]);
        choices.appendChild(btn);
      });
    }

    function choose(points) {
      stars += points;
      index++;

      if (index >= scenes.length) {
        endGame();
      } else {
        render();
      }
    }

    function endGame() {
      document.getElementById("emoji").textContent = stars >= 5 ? "🏆" : "🌿";
      document.getElementById("question").textContent = "Adventure complete!";
      document.getElementById("story").textContent =
        stars >= 5
          ? "You became a wise Panama Jungle Explorer. The animals trust you."
          : "You finished the jungle adventure. Try again and see if you can earn more stars.";

      document.getElementById("step").textContent = "7";
      document.getElementById("stars").textContent = stars;

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      const restart = document.createElement("button");
      restart.textContent = "Play Again";
      restart.onclick = () => {
        stars = 0;
        index = 0;
        render();
      };
      choices.appendChild(restart);

      const talk = document.createElement("button");
      talk.textContent = "Ask: What did you learn?";
      talk.className = "small";
      talk.onclick = () => {
        document.getElementById("story").textContent =
          "Question: Which animal was the smartest, funniest, or kindest? Why?";
      };
      choices.appendChild(talk);
    }

    render();
  </script>
</body>
</html>
