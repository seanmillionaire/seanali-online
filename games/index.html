<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jungle Fun</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #c9ffd4, #62c878);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #12351d;
      -webkit-tap-highlight-color: transparent;
    }
    .game {
      width: 100%;
      max-width: 560px;
      background: #fffbe8;
      border: 5px solid #1f7a39;
      border-radius: 28px;
      box-shadow: 0 18px 34px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .top {
      background: #1f7a39;
      color: white;
      padding: 18px 14px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }
    .badge {
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }
    .scene {
      padding: 22px 16px 18px;
      text-align: center;
    }
    .emoji {
      font-size: 92px;
      line-height: 1;
      margin-bottom: 10px;
    }
    .question {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 900;
      background: #e9fbff;
      padding: 18px;
      border-radius: 22px;
      margin-bottom: 14px;
      border: 4px solid #aeeaff;
    }
    .story {
      font-size: 24px;
      line-height: 1.25;
      font-weight: bold;
      margin: 8px 0 18px;
      min-height: 62px;
    }
    .choices {
      display: grid;
      gap: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 24px 18px;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 900;
      cursor: pointer;
      background: #ffd84d;
      color: #12351d;
      box-shadow: 0 8px 0 #bd8610;
      min-height: 88px;
      touch-action: manipulation;
    }
    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #bd8610;
    }
    .small {
      background: #e7ffe8;
      box-shadow: 0 8px 0 #7abf81;
      font-size: 25px;
    }
    .score {
      padding: 15px 14px;
      background: #f1ffe8;
      border-top: 3px solid #bde7bf;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 900;
      font-size: 21px;
    }
    @media (max-width: 390px) {
      h1 { font-size: 30px; }
      .emoji { font-size: 82px; }
      .question { font-size: 25px; }
      .story { font-size: 22px; }
      button { font-size: 25px; min-height: 82px; }
      .score { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <h1>🌿 Jungle Fun</h1>
      <div class="badge">Tap. Play. Smile.</div>
    </div>

    <div class="scene">
      <div id="emoji" class="emoji">🦋</div>
      <div id="question" class="question">Tap one.</div>
      <div id="story" class="story"></div>
      <div id="choices" class="choices"></div>
    </div>

    <div class="score">
      <div>Stars: <span id="stars">0</span> ⭐</div>
      <div><span id="step">1</span>/7</div>
    </div>
  </div>

  <script>
    let stars = 0;
    let index = 0;

    const scenes = [
      {
        emoji: "🦋",
        question: "A bug says hi!",
        story: "What do you do?",
        choices: [
          ["Say hi 👋", 1],
          ["Run! 😮", 0]
        ]
      },
      {
        emoji: "🐜",
        question: "An ant drops a leaf.",
        story: "Oh no!",
        choices: [
          ["Help it 🍃", 1],
          ["Take it 😆", 0]
        ]
      },
      {
        emoji: "🦥",
        question: "A sloth is sleepy.",
        story: "Shhh...",
        choices: [
          ["Be quiet 🤫", 1],
          ["Wake it up 📣", 0]
        ]
      },
      {
        emoji: "🐒",
        question: "A monkey has your hat.",
        story: "Hee hee!",
        choices: [
          ["Give banana 🍌", 1],
          ["Cry 😭", 0]
        ]
      },
      {
        emoji: "🐸",
        question: "A frog jumps!",
        story: "Hop hop!",
        choices: [
          ["Watch it 👀", 1],
          ["Grab it ✋", 0]
        ]
      },
      {
        emoji: "🌧️",
        question: "Rain comes down.",
        story: "Splash splash!",
        choices: [
          ["Find a tree 🌳", 1],
          ["Get muddy 😄", 1]
        ]
      },
      {
        emoji: "🌈",
        question: "You find a rainbow!",
        story: "Yay!",
        choices: [
          ["Dance 💃", 1],
          ["Clap 👏", 1]
        ]
      }
    ];

    function render() {
      const s = scenes[index];
      document.getElementById("emoji").textContent = s.emoji;
      document.getElementById("question").textContent = s.question;
      document.getElementById("story").textContent = s.story;
      document.getElementById("stars").textContent = stars;
      document.getElementById("step").textContent = Math.min(index + 1, scenes.length);

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      s.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice[0];
        btn.onclick = () => choose(choice[1]);
        choices.appendChild(btn);
      });
    }

    function choose(points) {
      stars += points;
      index++;

      if (index >= scenes.length) {
        endGame();
      } else {
        render();
      }
    }

    function endGame() {
      document.getElementById("emoji").textContent = "🏆";
      document.getElementById("question").textContent = "You did it!";
      document.getElementById("story").textContent = stars >= 5 ? "Big jungle star!" : "Good job! Play again?";
      document.getElementById("step").textContent = "7";
      document.getElementById("stars").textContent = stars;

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      const restart = document.createElement("button");
      restart.textContent = "Play Again 🔁";
      restart.onclick = () => {
        stars = 0;
        index = 0;
        render();
      };
      choices.appendChild(restart);

      const talk = document.createElement("button");
      talk.textContent = "Talk Time 💬";
      talk.className = "small";
      talk.onclick = () => {
        document.getElementById("question").textContent = "Who was funny?";
        document.getElementById("story").textContent = "Monkey, frog, ant, or sloth?";
      };
      choices.appendChild(talk);
    }

    render();
  </script>
</body>
</html>
