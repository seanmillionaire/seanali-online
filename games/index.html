<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selva Divertida</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #c9ffd4, #62c878);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #12351d;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .game {
      width: 100%;
      max-width: 560px;
      background: #fffbe8;
      border: 5px solid #1f7a39;
      border-radius: 28px;
      box-shadow: 0 18px 34px rgba(0,0,0,.18);
      overflow: hidden;
      position: relative;
    }
    .top {
      background: #1f7a39;
      color: white;
      padding: 18px 14px;
      text-align: center;
      position: relative;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }
    .badge {
      margin-top: 8px;
      font-size: 20px;
      font-weight: bold;
    }
    .sound-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
    }
    .sound-btn {
      width: auto;
      min-height: 48px;
      padding: 10px 15px;
      border-radius: 999px;
      font-size: 18px;
      box-shadow: 0 5px 0 #0f4e22;
      background: #b8ff6a;
    }
    .scene {
      padding: 22px 16px 18px;
      text-align: center;
      position: relative;
    }
    .emoji {
      font-size: 96px;
      line-height: 1;
      margin-bottom: 10px;
      animation: wiggle 1.7s infinite ease-in-out;
      cursor: pointer;
      user-select: none;
    }
    .emoji.bounce {
      animation: bounce .45s ease;
    }
    .question {
      font-size: 30px;
      line-height: 1.1;
      font-weight: 900;
      background: #e9fbff;
      padding: 18px;
      border-radius: 22px;
      margin-bottom: 14px;
      border: 4px solid #aeeaff;
    }
    .story {
      font-size: 25px;
      line-height: 1.2;
      font-weight: bold;
      margin: 8px 0 18px;
      min-height: 62px;
    }
    .choices {
      display: grid;
      gap: 16px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 24px 18px;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 900;
      cursor: pointer;
      background: #ffd84d;
      color: #12351d;
      box-shadow: 0 8px 0 #bd8610;
      min-height: 90px;
      touch-action: manipulation;
    }
    button:active {
      transform: translateY(6px) scale(.99);
      box-shadow: 0 2px 0 #bd8610;
    }
    .small {
      background: #e7ffe8;
      box-shadow: 0 8px 0 #7abf81;
      font-size: 26px;
    }
    .score {
      padding: 15px 14px;
      background: #f1ffe8;
      border-top: 3px solid #bde7bf;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 900;
      font-size: 21px;
    }
    .popup {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%) scale(.7);
      background: #fff;
      color: #12351d;
      border: 5px solid #ff9f1c;
      border-radius: 28px;
      padding: 22px 26px;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 18px 35px rgba(0,0,0,.25);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      text-align: center;
    }
    .popup.show { animation: pop .85s ease forwards; }
    .confetti {
      position: fixed;
      top: -30px;
      font-size: 30px;
      animation: fall 1.25s linear forwards;
      z-index: 9;
      pointer-events: none;
    }
    .animal-pop {
      position: fixed;
      font-size: 46px;
      z-index: 8;
      pointer-events: none;
      animation: floatUp 1s ease forwards;
    }
    .screen-flash {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.45);
      opacity: 0;
      pointer-events: none;
      z-index: 7;
    }
    .screen-flash.show { animation: flash .35s ease; }
    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.65) rotate(-4deg); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(3deg); }
      75% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(.92); }
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(250deg); opacity: 0; } }
    @keyframes floatUp { to { transform: translateY(-90px) scale(1.5) rotate(20deg); opacity: 0; } }
    @keyframes flash { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.04); }
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1); }
    }
    @media (max-width: 390px) {
      h1 { font-size: 31px; }
      .emoji { font-size: 86px; }
      .question { font-size: 27px; }
      .story { font-size: 23px; }
      button { font-size: 26px; min-height: 84px; }
      .score { font-size: 18px; }
      .popup { font-size: 29px; width: 82%; }
    }
  </style>
</head>
<body>
  <div class="screen-flash" id="flash"></div>
  <div class="game">
    <div class="top">
      <h1>🌿 Selva Divertida</h1>
      <div class="badge">Toca. Juega. Ríe.</div>
      <div class="sound-row">
        <button id="soundBtn" class="sound-btn">🔊 Sonido</button>
        <button id="musicBtn" class="sound-btn">🎵 Música</button>
      </div>
    </div>

    <div class="scene">
      <div id="emoji" class="emoji">🦋</div>
      <div id="question" class="question">Toca uno.</div>
      <div id="story" class="story"></div>
      <div id="choices" class="choices"></div>
    </div>

    <div class="score">
      <div>Estrellas: <span id="stars">0</span> ⭐</div>
      <div><span id="step">1</span>/7</div>
    </div>
  </div>

  <div id="popup" class="popup">¡Pum!</div>

  <script>
    let stars = 0;
    let index = 0;
    let audioCtx = null;
    let soundOn = false;
    let musicOn = false;
    let musicTimer = null;
    let beat = 0;

    const goodPops = ["¡Bien! ⭐", "¡Súper! 🌈", "¡Wuju! 🎉", "¡Qué cool! 🐒", "¡Bravo! 👏", "¡Boom! ✨"];
    const sillyPops = ["¡Ay ay ay! 😄", "¡Ups! 🙈", "¡Jajaja! 😂", "¡Otra vez! 🔁"];
    const popAnimals = ["🦋", "🐒", "🐸", "🌸", "⭐", "🍃", "🌈"];

    const scenes = [
      { emoji: "🦋", question: "Un bichito dice: hola.", story: "¿Qué haces?", sound: "butterfly", choices: [["Digo hola 👋", 1], ["Me voy 😮", 0]] },
      { emoji: "🐜", question: "Una hormiga deja caer una hoja.", story: "¡Oh no!", sound: "ant", choices: [["La ayudo 🍃", 1], ["La agarro 😆", 0]] },
      { emoji: "🦥", question: "Un perezoso duerme.", story: "Shhh...", sound: "sloth", choices: [["Hago silencio 🤫", 1], ["Grito 📣", 0]] },
      { emoji: "🐒", question: "Un mono tiene tu gorra.", story: "¡Je je!", sound: "monkey", choices: [["Le doy banana 🍌", 1], ["Lloro 😭", 0]] },
      { emoji: "🐸", question: "Una rana salta.", story: "¡Brinco! ¡Brinco!", sound: "frog", choices: [["La miro 👀", 1], ["La agarro ✋", 0]] },
      { emoji: "🌧️", question: "Cae lluvia.", story: "¡Splash! ¡Splash!", sound: "rain", choices: [["Voy al árbol 🌳", 1], ["Salto en lodo 😄", 1]] },
      { emoji: "🌈", question: "Ves un arcoíris.", story: "¡Yay!", sound: "rainbow", choices: [["Bailo 💃", 1], ["Aplaudo 👏", 1]] }
    ];

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type = "sine", vol = .08, start = 0) {
      if (!soundOn || !audioCtx) return;
      const t = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + .02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + .04);
    }

    function noise(dur = .08, vol = .05, start = 0) {
      if (!soundOn || !audioCtx) return;
      const t = audioCtx.currentTime + start;
      const bufferSize = audioCtx.sampleRate * dur;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.buffer = buffer;
      src.connect(gain);
      gain.connect(audioCtx.destination);
      src.start(t);
      src.stop(t + dur);
    }

    function playGood() {
      tone(523, .09, "triangle", .09, 0);
      tone(659, .11, "triangle", .09, .08);
      tone(784, .15, "triangle", .1, .17);
    }
    function playOops() {
      tone(220, .12, "sawtooth", .06, 0);
      tone(165, .18, "sawtooth", .05, .1);
    }
    function playWin() {
      [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, "triangle", .1, i * .1));
      setTimeout(() => confetti(28), 120);
    }
    function playAnimal(kind) {
      if (kind === "monkey") { tone(720, .06, "square", .07); tone(520, .07, "square", .06, .08); tone(760, .06, "square", .06, .17); }
      if (kind === "frog") { tone(150, .12, "sawtooth", .08); tone(95, .16, "sawtooth", .07, .13); }
      if (kind === "rain") { noise(.16, .045); noise(.16, .035, .12); }
      if (kind === "butterfly") { tone(900, .08, "sine", .05); tone(1200, .08, "sine", .04, .08); }
      if (kind === "ant") { tone(420, .04, "square", .04); tone(460, .04, "square", .04, .05); }
      if (kind === "sloth") { tone(180, .22, "sine", .05); }
      if (kind === "rainbow") { playGood(); }
    }

    function musicTick() {
      if (!musicOn || !audioCtx) return;
      const notes = [262, 330, 392, 330, 294, 349, 440, 349];
      tone(notes[beat % notes.length], .12, "triangle", .035);
      if (beat % 2 === 0) tone(110, .08, "sine", .025);
      if (beat % 4 === 2) noise(.04, .02);
      beat++;
    }

    function startMusic() {
      initAudio();
      soundOn = true;
      musicOn = true;
      document.getElementById("soundBtn").textContent = "🔊 Sonido";
      document.getElementById("musicBtn").textContent = "🎵 Música";
      clearInterval(musicTimer);
      musicTimer = setInterval(musicTick, 360);
      playGood();
    }
    function stopMusic() {
      musicOn = false;
      clearInterval(musicTimer);
      document.getElementById("musicBtn").textContent = "🔇 Música";
    }

    function render() {
      const s = scenes[index];
      document.getElementById("emoji").textContent = s.emoji;
      document.getElementById("question").textContent = s.question;
      document.getElementById("story").textContent = s.story;
      document.getElementById("stars").textContent = stars;
      document.getElementById("step").textContent = Math.min(index + 1, scenes.length);
      playAnimal(s.sound);

      const choices = document.getElementById("choices");
      choices.innerHTML = "";
      s.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice[0];
        btn.onclick = () => choose(choice[1]);
        choices.appendChild(btn);
      });
    }

    function showPopup(text) {
      const popup = document.getElementById("popup");
      popup.textContent = text;
      popup.classList.remove("show");
      void popup.offsetWidth;
      popup.classList.add("show");
    }

    function flash() {
      const f = document.getElementById("flash");
      f.classList.remove("show");
      void f.offsetWidth;
      f.classList.add("show");
    }

    function confetti(count = 14) {
      const pieces = ["⭐", "🌿", "🌸", "✨", "🍃", "🦋", "🌈"];
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDelay = Math.random() * .22 + "s";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1600);
      }
    }

    function animalPop() {
      const el = document.createElement("div");
      el.className = "animal-pop";
      el.textContent = popAnimals[Math.floor(Math.random() * popAnimals.length)];
      el.style.left = (20 + Math.random() * 60) + "vw";
      el.style.top = (35 + Math.random() * 35) + "vh";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    function choose(points) {
      initAudio();
      if (!soundOn) soundOn = true;
      stars += points;
      animalPop();
      flash();

      if (points > 0) {
        showPopup(goodPops[Math.floor(Math.random() * goodPops.length)]);
        playGood();
        confetti();
      } else {
        showPopup(sillyPops[Math.floor(Math.random() * sillyPops.length)]);
        playOops();
      }

      setTimeout(() => {
        index++;
        if (index >= scenes.length) endGame(); else render();
      }, 700);
    }

    function endGame() {
      document.getElementById("emoji").textContent = "🏆";
      document.getElementById("question").textContent = "¡Lo hiciste!";
      document.getElementById("story").textContent = stars >= 5 ? "¡Gran estrella de la selva!" : "¡Muy bien! ¿Otra vez?";
      document.getElementById("step").textContent = "7";
      document.getElementById("stars").textContent = stars;
      showPopup("¡Fiesta! 🎉");
      playWin();
      flash();

      const choices = document.getElementById("choices");
      choices.innerHTML = "";

      const restart = document.createElement("button");
      restart.textContent = "Jugar otra vez 🔁";
      restart.onclick = () => { stars = 0; index = 0; render(); };
      choices.appendChild(restart);

      const talk = document.createElement("button");
      talk.textContent = "Hablar 💬";
      talk.className = "small";
      talk.onclick = () => {
        playGood();
        document.getElementById("question").textContent = "¿Quién fue chistoso?";
        document.getElementById("story").textContent = "¿Mono, rana, hormiga o perezoso?";
        animalPop();
      };
      choices.appendChild(talk);
    }

    document.getElementById("soundBtn").onclick = () => {
      initAudio();
      soundOn = !soundOn;
      document.getElementById("soundBtn").textContent = soundOn ? "🔊 Sonido" : "🔈 Sonido";
      if (soundOn) playGood();
    };

    document.getElementById("musicBtn").onclick = () => {
      if (musicOn) stopMusic(); else startMusic();
    };

    document.getElementById("emoji").onclick = () => {
      initAudio();
      if (!soundOn) soundOn = true;
      const e = document.getElementById("emoji");
      e.classList.remove("bounce");
      void e.offsetWidth;
      e.classList.add("bounce");
      animalPop();
      playAnimal(scenes[index]?.sound || "rainbow");
    };

    render();
  </script>
</body>
</html>
