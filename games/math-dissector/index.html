<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Elementary Math Dissector</title><meta name="description" content="Elementary stacked math practice for multiplication, addition, subtraction, carrying, borrowing, and paper proof."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/math-dissector/"><meta name="theme-color" content="#00a7c9"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#e8fbff,#b9ffe1 48%,#7d4cff);color:#101436;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{width:100%;max-width:780px;margin:0 auto;background:#fff6e6;border:5px solid #101436;border-radius:30px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.22)}.top{text-align:center;color:white;background:radial-gradient(circle at top,#ffc83d,transparent 35%),linear-gradient(135deg,#00a7c9,#1d144b);padding:16px;border-bottom:5px solid #101436}.tag{display:inline-block;background:white;color:#101436;border:3px solid #ffc83d;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:900;margin-bottom:8px}h1{font-size:clamp(34px,8vw,58px);line-height:.95;margin:0}.sub{font-size:18px;font-weight:900;margin-top:8px;color:#fff6e6}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e8fbff;padding:10px;border-bottom:4px solid #101436}.pill{background:white;border:3px solid #101436;border-radius:16px;text-align:center;font-size:15px;font-weight:900;padding:7px 4px}.barBox{height:18px;background:#101436;border:3px solid #101436;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#34d17a,#00d4ff,#ffc83d);transition:.3s}.stage{padding:14px 16px 18px}.teacher{display:flex;gap:10px;align-items:center;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:10px 12px;margin-bottom:10px;box-shadow:0 6px 0 rgba(0,0,0,.14)}.face{font-size:46px}.talk{font-size:18px;line-height:1.18;font-weight:900}.board{background:#123b31;color:#eafff4;border:7px solid #8b5a2b;border-radius:24px;padding:14px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08),0 9px 0 rgba(0,0,0,.2);min-height:330px}.lessonTitle{font-size:20px;font-weight:900;color:#fff6a8;text-align:center;margin:0 0 10px}.work{font-family:'Courier New',monospace;white-space:pre;text-align:right;width:max-content;max-width:100%;margin:0 auto 12px;background:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 18px;font-size:clamp(25px,7vw,42px);line-height:1.05;font-weight:900;color:#fff}.line{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:start;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;margin-top:8px}.lineNum{background:#ffc83d;color:#101436;border-radius:999px;font-size:15px;font-weight:900;text-align:center;padding:7px 4px}.lineText{font-size:20px;line-height:1.18;font-weight:900;color:#fff}.helper{margin-top:10px;background:#fff;color:#101436;border:4px dashed #00a7c9;border-radius:18px;padding:11px;font-size:18px;line-height:1.2;font-weight:900}.answers{display:grid;gap:10px;margin-top:13px}.answer{border:3px solid #101436;border-radius:22px;padding:17px 12px;font-size:24px;font-weight:900;min-height:66px;color:#101436;box-shadow:0 7px 0 #101436;background:#fffdf6;cursor:pointer;text-align:center}.answer:nth-child(2){background:#b8f2ff}.answer:nth-child(3){background:#d7b9ff}.answer:nth-child(4){background:#f4ecff}.answer:active,.answer.hit{transform:translateY(6px);box-shadow:0 1px 0 #101436}.answer.good{background:linear-gradient(180deg,#d9ffe9,#7dffb0)!important}.answer.bad{background:linear-gradient(180deg,#ff3d3d,#b40020)!important;color:#fff!important}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81;color:#101436}.primary{background:#ffc83d;box-shadow:0 6px 0 #9b5d00}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:#fff;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@media(max-width:430px){body{padding:10px}.hud{grid-template-columns:repeat(2,1fr)}.stage{padding:12px}.line{grid-template-columns:48px 1fr}.lineText{font-size:17px}.controls{grid-template-columns:1fr}}</style></head><body><main class="game"><section class="top"><div class="tag">🏫 Elementary Whiteboard</div><h1>🧠 Math Dissector</h1><div class="sub">Stack it. Column it. Prove it on paper.</div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">✏️ <span id="done">0</span></div><div class="pill">📘 <span id="round">1</span>/<span id="total">5</span></div></section><div class="barBox"><div class="bar" id="bar"></div></div><section class="stage"><div class="teacher"><div class="face">👩‍🏫</div><div class="talk" id="teacher">Get paper and pen. Copy the problem exactly.</div></div><div class="board"><div class="lessonTitle" id="lessonTitle">Stacked Multiplication</div><div class="work" id="work"></div><div id="lines"></div><div class="helper" id="helper">Copy the stacked setup on paper first.</div></div><div class="answers" id="answers"></div><div class="controls"><button class="small" id="how">📘 School Rule</button><button class="small primary" id="next">Next Line →</button><button class="small" id="restart">🔁 New</button></div></section></main><div class="popup" id="popup">Nice!</div><script src="/games/voice.js"></script><script>var problems=[{title:'Stacked Multiplication',answer:1088,work:['    32','×   34','------','   128','+  960','------','  ????'],steps:['Copy it like school: 32 on top, 34 under it. Ones line up with ones.','Use the bottom ones digit first: 4. Do 4 × 2, then 4 × 3. Write the first row: 128.','Now move to the bottom tens digit: 3. Because it is the tens row, put a 0 placeholder first.','Do 3 × 2, then 3 × 3. Your tens row should look like 960.','Now add the two rows on paper. Do not guess. Pick the answer that matches your work.'],wrong:'Check the first row, the zero placeholder, and then add both rows.'},{title:'Big Addition',answer:7335,work:['   ¹ ¹¹','   4879','+  2456','-------','  ????'],steps:['Stack the numbers. Ones under ones. Tens under tens. Hundreds under hundreds.','Start on the right. Ones column: 9 + 6. Write the ones digit and carry the 1.','Move one column left. Tens column: 7 + 5 plus your carry.','Keep moving left: hundreds, then thousands. Carry whenever a column makes 10 or more.','Now finish the total on paper. Do not guess. Pick the answer that matches your work.'],wrong:'Start from the ones column and follow the carry marks.'},{title:'Subtraction With Borrowing',answer:547,work:['   7 9 14','     804','−    257','--------','    ???'],steps:['Stack the numbers. Ones under ones. Tens under tens. Hundreds under hundreds.','Start on the right. You cannot do 4 − 7, so you need to borrow.','The tens digit is 0, so borrow from the hundreds first. 8 becomes 7. The 0 becomes 10.','Now borrow from the 10 tens. The ones becomes 14 and the tens becomes 9.','Subtract each column on paper. Do not guess. Pick the answer that matches your work.'],wrong:'Check the borrowing across the zero, then subtract right to left.'},{title:'Stacked Multiplication',answer:1081,work:['    47','×   23','------','   141','+  940','------','  ????'],steps:['Copy it like school: 47 on top, 23 under it. Ones line up with ones.','Use the bottom ones digit first: 3. Do 3 × 7, then 3 × 4. Write the first row: 141.','Now move to the bottom tens digit: 2. Because it is the tens row, put a 0 placeholder first.','Do 2 × 7, then 2 × 4. Your tens row should look like 940.','Now add the two rows on paper. Do not guess. Pick the answer that matches your work.'],wrong:'Check the 3 row, the zero placeholder, and then add.'},{title:'Big Addition',answer:18203,work:['   ¹¹¹','   8765','+  9438','-------',' ?????'],steps:['Stack the numbers. Keep every digit in its own place-value column.','Start on the right. Ones column: 5 + 8. Write the ones digit and carry.','Tens column: add 6 + 3 plus your carry. Write and carry if needed.','Hundreds and thousands work the same way. Move one column at a time.','Now finish the total on paper. Do not guess. Pick the answer that matches your work.'],wrong:'Use the carry row and add one column at a time from right to left.'}];var idx=0,step=0,score=0,streak=0,done=0,locked=false;function $(id){return document.getElementById(id)}function speak(t){try{if(window.SeanGameVoice&&SeanGameVoice.speak)window.SeanGameVoice.speak(t)}catch(e){}}function pop(t){var p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}function fmt(n){return Number(n).toLocaleString()}function opts(ans){var n=Number(ans);var a=[n,n+10,n-10,n+100,n-100,n+7,n-7].filter(function(x,i,r){return x>0&&r.indexOf(x)===i});return shuffle(a).slice(0,4)}function current(){return problems[idx]}function render(){if(idx>=problems.length)return finish();var p=current();locked=false;step=0;$('lessonTitle').textContent=p.title;$('work').textContent=p.work.join('\n');$('lines').innerHTML='';$('answers').innerHTML='';$('helper').textContent='✏️ Copy the stacked setup on paper. The game will not solve the final answer for you.';$('teacher').textContent='Get paper and pen. Copy it exactly like the board.';$('round').textContent=idx+1;$('total').textContent=problems.length;$('score').textContent=score;$('streak').textContent=streak;$('done').textContent=done;$('bar').style.width=Math.round(done/problems.length*100)+'%';$('next').style.display='block';speak('Get paper and pen. Copy the stacked problem exactly like school.')}function nextLine(){var p=current();if(step>=p.steps.length)return showAnswers();step++;var html='';for(var i=0;i<step;i++){html+='<div class="line"><div class="lineNum">Line '+(i+1)+'</div><div class="lineText">'+p.steps[i]+'</div></div>'}$('lines').innerHTML=html;$('helper').textContent=step<p.steps.length?'✏️ Do line '+step+' on paper. Then press Next Line.':'✏️ Stop. Finish the answer on paper. Then pick the matching choice.';$('teacher').textContent=step<p.steps.length?'Good. One school line at a time.':'Now your paper has to prove the answer.';speak(p.steps[step-1])}function showAnswers(){var p=current();$('next').style.display='none';$('helper').textContent='✅ Paper proof check: choose the answer that matches what YOU wrote.';$('teacher').textContent='Do not guess. Match the answer to your paper.';$('answers').innerHTML=opts(p.answer).map(function(x){return '<button class="answer">'+fmt(x)+'</button>'}).join('');document.querySelectorAll('.answer').forEach(function(b){b.onclick=function(){pick(b,p)}});speak('Choose the answer that matches your paper. Do not guess.')}function pick(btn,p){if(locked)return;locked=true;var val=btn.textContent.replace(/,/g,'').trim();if(String(p.answer)===val){btn.classList.add('good','hit');score+=10;streak++;done++;pop('Proved!');speak('Correct. You proved it on paper.');setTimeout(function(){idx++;render()},1250)}else{btn.classList.add('bad','wrong');streak=0;$('helper').textContent='Wrong answer. '+p.wrong;$('streak').textContent=streak;pop('Check paper.');setTimeout(function(){locked=false;btn.classList.remove('bad','wrong')},950)}$('score').textContent=score;$('streak').textContent=streak;$('done').textContent=done;$('bar').style.width=Math.round(done/problems.length*100)+'%'}function finish(){$('bar').style.width='100%';$('lessonTitle').textContent='Class Complete';$('work').textContent='🏆';$('lines').innerHTML='<div class="line"><div class="lineNum">Badge</div><div class="lineText"><b>Elementary Math Dissector</b>: you stacked it, worked the columns, and proved the answer.</div></div>';$('helper').textContent='Big math is just small columns done in the right order.';$('answers').innerHTML='';$('next').style.display='none';pop('Badge!');speak('Badge earned. Elementary Math Dissector.')}function restart(){idx=0;step=0;score=0;streak=0;done=0;render()}$('next').onclick=nextLine;$('restart').onclick=restart;$('how').onclick=function(){$('helper').textContent='School rule: stack the numbers, start on the right, use carry or borrow marks, then check your final answer.';speak('School rule. Stack the numbers. Start on the right. Use carry or borrow marks. Then check your answer.')};render();</script><script src="/games/sounds.js?v=4"></script></body></html>
