3d}.answer.good{background:linear-gradient(180deg,#d9ffe9,#7dffb0)!important}.answer.bad{background:linear-gradient(180deg,#ff3d3d,#b40020)!important;color:#fff!important}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81;color:#101436}.primary{background:#ffc83d;box-shadow:0 6px 0 #9b5d00}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:#fff;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes pulse{50%{transform:scale(1.015);box-shadow:0 9px 0 rgba(0,0,0,.18),0 0 24px rgba(255,200,61,.35)}}@keyframes bob{50%{transform:translateY(5px)}}@media(max-width:430px){body{padding:10px}.hud{grid-template-columns:repeat(2,1fr)}.stage{padding:12px}.introSteps{grid-template-columns:1fr}.introTitle{font-size:20px}.line{grid-template-columns:48px 1fr}.lineText{font-size:16px}.controls{grid-template-columns:1fr}.answer{font-size:17px;padding:12px 12px 12px 50px}}</style></head><body><main class="game"><section class="top"><div class="tag" data-i="tag">🏫 Elementary Whiteboard</div><h1 data-i="title">🧠 Math Dissector</h1><div class="sub" data-i="sub">Build each line. No answer leaks.</div></section><section class="intro"><div class="introTitle" data-i="introTitle">👀 Before you start</div><div class="introSteps"><div class="introStep" data-i="intro1">1️⃣ Get paper and pencil</div><div class="introStep" data-i="intro2">2️⃣ Copy the board</div><div class="introStep" data-i="intro3">3️⃣ Press Next Line</div></div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">✏️ <span id="done">0</span></div><div class="pill">📘 <span id="round">1</span>/<span id="total">5</span></div></section><section class="stage"><div class="teacher game-focus-target"><div class="face">👩‍🏫</div><div class="talk" id="teacher"></div></div><div class="board"><div class="lessonTitle" id="lessonTitle"></div><div class="work" id="work"></div><div id="lines"></div><div class="helper" id="helper"></div></div><div class="answers" id="answers"></div><div class="controls"><button class="small" id="how"></button><button class="small primary" id="next"></button><button class="small" id="restart"></button></div></section></main><div class="popup" id="popup">Nice!</div><script src="/games/voice.js"></script><script>var L={en:{tag:'🏫 Elementary Whiteboard',title:'🧠 Math Dissector',sub:'Build each line. No answer leaks.',introTitle:'👀 Before you start',intro1:'1️⃣ Get paper and pencil',intro2:'2️⃣ Copy the board',intro3:'3️⃣ Press Next Line',teacher:'Get paper and pencil. Copy the problem exactly.',helper:'✏️ Copy the stacked setup on paper first.',how:'📘 School Rule',next:'Next Line →',new:'🔁 New',good:'Correct, you got it!',bad:'Incorrect.',paper:'✅ Paper check: choose the answer that matches your paper.',match:'Do not guess. Match the answer to your paper.',done:'Level 1 complete!',doneHelp:'You finished the math board. Choose what comes next.',line:'Line ',copy:'Copy the board first. Then press Next Line.',stop:'✏️ Stop. Finish it on paper. Then pick the matching choice.',again:'Try again. Check the school steps.'},es:{tag:'🏫 Pizarra escolar',title:'🧠 Disector Matemático',sub:'Construye cada línea. Sin pistas de respuesta.',introTitle:'👀 Antes de empezar',intro1:'1️⃣ Busca papel y lápiz',intro2:'2️⃣ Copia la pizarra',intro3:'3️⃣ Toca Siguiente línea',teacher:'Busca papel y lápiz. Copia el problema exactamente.',helper:'✏️ Copia el problema en papel primero.',how:'📘 Regla escolar',next:'Siguiente línea →',new:'🔁 Nuevo',good:'¡Correcto, lo tienes!',bad:'Incorrecto.',paper:'✅ Revisa tu papel: elige la respuesta igual.',match:'No adivines. Busca la respuesta en tu papel.',done:'¡Nivel 1 completo!',doneHelp:'Terminaste la pizarra matemática. Elige qué sigue.',line:'Línea ',copy:'Copia la pizarra primero. Luego toca Siguiente línea.',stop:'✏️ Alto. Termina en papel. Luego elige la respuesta igual.',again:'Intenta otra vez. Revisa los pasos.'}};var lang=localStorage.getItem('seanGameLang')||'en';var problems=[{title:{en:'Stacked Multiplication',es:'Multiplicación apilada'},answer:1088,states:[['    32','×   34','------','   ___','+  ___','------','  ????'],['    32','×   34','------','   __8','+  ___','------','  ????'],['    32','×   34','------','   128','+  ___','------','  ????'],['    32','×   34','------','   128','+  __0','------','  ????'],['    32','×   34','------','   128','+  960','------','  ????'],['    32','×   34','------','   128','+  960','------','  ????']],steps:{en:['Ones first: 4 × 2. Write 8 in ones spot.','Now 4 × 3 = 12. First row is 128.','Tens row starts with 0 placeholder.','Now do 3 × 2 and 3 × 3 on paper.','Add both rows on paper. Pick the match.'],es:['Unidades primero: 4 × 2. Escribe 8.','Ahora 4 × 3 = 12. La primera fila es 128.','La fila de decenas empieza con 0.','Ahora haz 3 × 2 y 3 × 3 en papel.','Suma las dos filas en papel. Elige la igual.']}},{title:{en:'Big Addition',es:'Suma grande'},answer:7335,states:[['   4879','+  2456','-------','  ????'],['   ¹','   4879','+  2456','-------','  ???5'],['   ¹¹','   4879','+  2456','-------','  ??35'],['   ¹¹¹','   4879','+  2456','-------','  ?335'],['   ¹¹¹','   4879','+  2456','-------','  ????'],['   ¹¹¹','   4879','+  2456','-------','  ????']],steps:{en:['Ones: 9 + 6 = 15. Write 5, carry 1.','Tens: 7 + 5 + 1 = 13. Write 3, carry 1.','Hundreds: 8 + 4 + 1 = 13. Write 3, carry 1.','Finish thousands on paper.','Pick the answer that matches your paper.'],es:['Unidades: 9 + 6 = 15. Escribe 5, llevas 1.','Decenas: 7 + 5 + 1 = 13. Escribe 3, llevas 1.','Centenas: 8 + 4 + 1 = 13. Escribe 3, llevas 1.','Termina miles en papel.','Elige la respuesta igual a tu papel.']}},{title:{en:'Subtraction With Borrowing',es:'Resta pidiendo prestado'},answer:547,states:[['     804','−    257','--------','    ???'],['     804','−    257','--------','    ??7'],['   7 10','     804','−    257','--------','    ??7'],['   7 9 14','     804','−    257','--------','    ?47'],['   7 9 14','     804','−    257','--------','    ???'],['   7 9 14','     804','−    257','--------','    ???']],steps:{en:['Ones: 4 − 7 needs borrowing.','Borrow through the 0. 8 becomes 7. 0 becomes 10.','Borrow again. Ones becomes 14. Tens becomes 9.','Do tens and hundreds on paper.','Pick the answer that matches your paper.'],es:['Unidades: 4 − 7 necesita prestar.','Presta por el 0. 8 baja a 7. 0 sube a 10.','Presta otra vez. Unidades es 14. Decenas es 9.','Haz decenas y centenas en papel.','Elige la respuesta igual a tu papel.']}}];var idx=0,step=0,score=0,streak=0,done=0,locked=false;function $(id){return document.getElementById(id)}function T(k){return L[lang][k]||L.en[k]||k}function speak(t){try{if(window.SeanGameVoice&&SeanGameVoice.speak)window.SeanGameVoice.speak(t)}catch(e){}}function sound(n){try{if(window.SeanGameSounds&&SeanGameSounds[n])SeanGameSounds[n]()}catch(e){}}function pop(t){var p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}function fmt(n){return Number(n).toLocaleString()}function opts(ans){var n=Number(ans);return shuffle([n,n+10,n-10,n+100,n-100,n+7,n-7].filter(function(x,i,r){return x>0&&r.indexOf(x)===i})).slice(0,4)}function current(){return problems[idx]}function applyLang(){lang=localStorage.getItem('seanGameLang')||'en';document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=T(e.dataset.i)});$('how').textContent=T('how');$('next').textContent=T('next');$('restart').textContent=T('new')}function draw(){var p=current();$('work').textContent=p.states[Math.min(step,p.states.length-1)].join('\n')}function render(){applyLang();if(idx>=problems.length)return finish();var p=current();locked=false;step=0;$('lessonTitle').textContent=p.title[lang]||p.title.en;draw();$('lines').innerHTML='';$('answers').innerHTML='';$('helper').textContent=T('helper');$('teacher').textContent=T('teacher');$('round').textContent=idx+1;$('total').textContent=problems.length;$('score').textContent=score;$('streak').textContent=streak;$('done').textContent=done;$('next').style.display='block';speak(T('teacher'))}function nextLine(){var p=current(),steps=p.steps[lang]||p.steps.en;if(step>=steps.length)return showAnswers();var text=steps[step];step++;draw();var html='';for(var i=0;i<step;i++)html+='<div class="line"><div class="lineNum">'+T('line')+(i+1)+'</div><div class="lineText">'+steps[i]+'</div></div>';$('lines').innerHTML=html;$('helper').textContent=step<steps.length?T('copy'):T('stop');$('teacher').textContent=step<steps.length?T('copy'):T('match');speak(text)}function showAnswers(){var p=current();$('next').style.display='none';$('helper').textContent=T('paper');$('teacher').textContent=T('match');$('answers').innerHTML=opts(p.answer).map(function(x,i){return '<button class="answer" data-choice-label="'+String.fromCharCode(65+i)+'">'+fmt(x)+'</button>'}).join('');document.querySelectorAll('.answer').forEach(function(b){b.onclick=function(){pick(b,p)}});speak(T('match'))}function pick(btn,p){if(locked)return;locked=true;var val=btn.textContent.replace(/,/g,'').trim();if(String(p.answer)===val){btn.classList.add('good');score+=10;streak++;done++;pop('✨ '+T('good'));sound('correct');speak(T('good'));idx++;setTimeout(render,900)}else{btn.classList.add('bad');streak=0;pop(T('bad'));sound('wrong');speak(T('bad'));$('helper').textContent=T('again');setTimeout(function(){btn.classList.remove('bad');locked=false},800)}$('score').textContent=score;$('streak').textContent=streak;$('done').textContent=done}function finish(){$('lessonTitle').textContent=T('done');$('work').textContent='🏆';$('lines').innerHTML='';$('answers').innerHTML='<button class="answer" data-choice-label="A" onclick="location.reload()">'+(lang==='es'?'Jugar otra vez':'Play again')+'</button>';$('helper').textContent=T('doneHelp');$('teacher').textContent=T('done');$('next').style.display='none';sound('levelUp')}document.addEventListener('seanGameLangChange',function(){applyLang();render()});$('next').onclick=nextLine;$('restart').onclick=function(){location.reload()};$('how').onclick=function(){pop(T('intro1')+'\n'+T('intro2')+'\n'+T('intro3'))};applyLang();render();</script><script src="/games/sounds.js"></script><script src="/games/game-rules.js"></script>
