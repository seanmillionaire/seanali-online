nt=x;popup.classList.remove('show');void popup.offsetWidth;popup.classList.add('show')}function confetti(a){a.forEach((x,i)=>{let d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(10+i*18+Math.random()*10)+'vw';d.style.animationDelay=i*.05+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1400)})}manualBtn.onclick=()=>modal.classList.add('show');closeManual.onclick=()=>modal.classList.remove('show');restartBtn.onclick=restart;voiceBtn.onclick=()=>{voiceOn=!voiceOn;setLang(L)};esBtn.onclick=()=>setLang('es');enBtn.onclick=()=>setLang('en');setLang(L);</script></body></html>
