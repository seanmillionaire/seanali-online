!</button></div></div><main class="game"><section class="top"><h1 id="gameTitle">🌎 The Elements</h1><div class="sub" id="sub">Learn the forces that shape life.</div></section><section class="hud"><div class="pill">✨ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🧠 <span id="wisdom">0</span></div><div class="pill">🌍 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></div></div><div class="orbs" id="orbs"></div><section class="stage"><div class="world" id="world">🌎</div><div class="topic" id="topic">Element Portal</div><div class="question" id="question">Which element helps plants grow from soil?</div><div class="scene" id="scene">🌱 🌧️ ☀️</div><div class="lesson" id="lesson">Choose the best answer to unlock the lesson.</div><div class="choices" id="choices"></div><div class="controls"><button class="small" id="manualBtn">📘 How</button><button class="small" id="voiceBtn">🔊 Voice</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></section></main><div class="popup" id="popup">Correct!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,streak=0,wisdom=0,round=0,voiceOn=true,lastLang=null,wrongNotes=[];const total=10,key='elementsBadges';let badges=JSON.parse(localStorage.getItem(key)||'[]');const $=id=>document.getElementById(id);function lang(){return localStorage.getItem('seanGameLang')||'en'}function T(en,es){return lang()==='es'?es:en}function tx(v){return Array.isArray(v)?T(v[0],v[1]):v}const copy={title:['🌎 The Elements','🌎 Los Elementos'],sub:['Learn the forces that shape life.','Aprende las fuerzas que forman la vida.'],topic:['Element Portal','Portal de Elementos'],empty:['Choose the best answer to unlock the lesson.','Elige la mejor respuesta para desbloquear la lección.'],manualTitle:['📘 How to Play','📘 Cómo jugar'],manual:[['Read the nature question.','Lee la pregunta de la naturaleza.'],['Look at the emoji scene.','Mira la escena con emojis.'],['Pick the best answer.','Elige la mejor respuesta.'],['Unlock lessons about Earth, Water, Air, Fire and natural systems.','Desbloquea lecciones sobre Tierra, Agua, Aire, Fuego y sistemas naturales.'],['Finish to earn your Nature Balance badge.','Termina para ganar tu badge de Equilibrio Natural.']],go:['Let’s go!','¡Vamos!'],how:['📘 How','📘 Cómo'],voice:['🔊 Voice','🔊 Voz'],muted:['🔇 Voice','🔇 Voz'],new:['🔁 New','🔁 Nuevo'],correct:['Correct!','¡Correcto!'],almost:['Almost.','Casi.'],done:['Nature unlocked!','¡Naturaleza desbloqueada!'],grade:['Grade ','Nota '],earned:['You earned ','Ganaste '],replay:['Play again 🔁','Jugar otra vez 🔁'],review:['Review lessons 💬','Ver lecciones 💬'],keys:['🌎 Nature lessons unlocked:','🌎 Lecciones de naturaleza desbloqueadas:'],next:['Next prize: 9 correct answers for Planet Guardian.','Próximo premio: 9 respuestas correctas para Guardián del Planeta.']};let cards=[{icon:'🌱',topic:['Earth','Tierra'],q:['Which element helps plants grow from soil?','¿Qué elemento ayuda a las plantas a crecer desde el suelo?'],scene:'🌱 🪨 🐛',choices:[['Earth','Tierra'],['Fire','Fuego'],['Thunder','Trueno']],a:0,lesson:['Earth is the ground, minerals and living soil that hold roots and feed life.','La Tierra es el suelo, los minerales y la vida que sostienen raíces y alimentan la vida.']},{icon:'💧',topic:['Water','Agua'],q:['Why is water called a life element?','¿Por qué el agua se llama un elemento de vida?'],scene:'💧 🐟 🌿',choices:[['It moves nutrients and keeps bodies alive.','Mueve nutrientes y mantiene vivos los cuerpos.'],['It only makes things wet.','Solo moja las cosas.'],['It stops all weather.','Detiene todo el clima.']],a:0,lesson:['Water carries life: inside bodies, rivers, clouds, plants and oceans.','El agua carga vida: en cuerpos, ríos, nubes, plantas y océanos.']},{icon:'🌬️',topic:['Air','Aire'],q:['What does air give humans and animals?','¿Qué da el aire a humanos y animales?'],scene:'🌬️ 🫁 🐦',choices:[['Oxygen to breathe','Oxígeno para respirar'],['Rocks to eat','Rocas para comer'],['Fire to drink','Fuego para beber']],a:0,lesson:['Air is invisible, but it is not empty. It carries oxygen, wind, seeds and weather.','El aire es invisible, pero no está vacío. Lleva oxígeno, viento, semillas y clima.']},{icon:'🔥',topic:['Fire / Sun','Fuego / Sol'],q:['What is the safe power of fire and sunlight?','¿Cuál es el poder seguro del fuego y la luz solar?'],scene:'☀️ 🔥 🍲',choices:[['Energy, warmth and transformation','Energía, calor y transformación'],['Making oceans disappear','Hacer desaparecer océanos'],['Stopping all plants','Detener todas las plantas']],a:0,lesson:['Fire and sunlight transform things: warmth, cooking, light, energy and growth.','El fuego y el sol transforman: calor, comida, luz, energía y crecimiento.']},{icon:'🌦️',topic:['Weather','Clima'],q:['What happens when sun heats water?','¿Qué pasa cuando el sol calienta el agua?'],scene:'☀️ 💧 ☁️ 🌧️',choices:[['Water rises, becomes clouds, then rain.','El agua sube, forma nubes y luego lluvia.'],['Water turns into stones.','El agua se vuelve piedra.'],['Clouds stop needing air.','Las nubes dejan de necesitar aire.']],a:0,lesson:['The water cycle is a loop: heat, vapor, clouds, rain, rivers, ocean.','El ciclo del agua es un círculo: calor, vapor, nubes, lluvia, ríos, océano.']},{icon:'⛈️',topic:['Storms','Tormentas'],q:['What is a storm trying to balance?','¿Qué intenta equilibrar una tormenta?'],scene:'⛈️ 🌬️ 🌊',choices:[['Heat, pressure, water and wind','Calor, presión, agua y viento'],['Only noise','Solo ruido'],['Only darkness','Solo oscuridad']],a:0,lesson:['Storms can look chaotic, but they move heat, pressure and water through the atmosphere.','Las tormentas pueden verse caóticas, pero mueven calor, presión y agua en la atmósfera.']},{icon:'🌊',topic:['Tsunami','Tsunami'],q:['What usually starts a tsunami?','¿Qué suele iniciar un tsunami?'],scene:'🌊 🌎 ⚠️',choices:[['A big movement under the ocean','Un gran movimiento bajo el océano'],['A normal small wave','Una ola pequeña normal'],['A cloud singing','Una nube cantando']],a:0,lesson:['A tsunami is not a normal wave. It can begin when the ocean floor suddenly moves.','Un tsunami no es una ola normal. Puede empezar cuando el fondo del océano se mueve de golpe.']},{icon:'🌋',topic:['Volcano','Volcán'],q:['What does a volcano show us about Earth?','¿Qué nos muestra un volcán sobre la Tierra?'],scene:'🌋 🔥 🪨',choices:[['Earth has heat and pressure inside.','La Tierra tiene calor y presión por dentro.'],['Earth is hollow candy.','La Tierra es dulce hueco.'],['Mountains are always asleep.','Las montañas siempre duermen.']],a:0,lesson:['Volcanoes show Earth is active inside: heat, pressure, rock and new land.','Los volcanes muestran que la Tierra está activa por dentro: calor, presión, roca y tierra nueva.']},{icon:'🌳',topic:['Nature Balance','Equilibrio Natural'],q:['Why do trees matter to the elements?','¿Por qué importan los árboles para los elementos?'],scene:'🌳 🌬️ 💧 🐝',choices:[['They connect air, water, soil and life.','Conectan aire, agua, suelo y vida.'],['They only make shade.','Solo hacen sombra.'],['They stop all animals.','Detienen a todos los animales.']],a:0,lesson:['Trees are element bridges: roots in earth, water in the trunk, air through leaves, sun into food.','Los árboles son puentes de elementos: raíces en tierra, agua en tronco, aire en hojas y sol en alimento.']},{icon:'⚖️',topic:['Existence','Existencia'],q:['What is the deeper lesson of the elements?','¿Cuál es la lección más profunda de los elementos?'],scene:'🌎 💧 🌬️ 🔥 🌱',choices:[['Life works when forces stay in balance.','La vida funciona cuando las fuerzas están en equilibrio.'],['One element should beat all others.','Un elemento debe vencer a todos.'],['Nature has no patterns.','La naturaleza no tiene patrones.']],a:0,lesson:['Existence on Earth is relationship: earth holds, water flows, air moves, fire transforms.','La existencia en la Tierra es relación: tierra sostiene, agua fluye, aire mueve, fuego transforma.'] }];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(cards);function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function popup(t){let p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){let arr=['🌎','💧','🔥','🌬️','🌱','✨','⚡'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=arr[Math.floor(Math.random()*arr.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function baseUi(){lastLang=lang();$('gameTitle').textContent=tx(copy.title);$('sub').textContent=tx(copy.sub);$('manualTitle').textContent=tx(copy.manualTitle);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+tx(x)+'</li>').join('');$('closeManual').textContent=tx(copy.go);$('manualBtn').textContent=tx(copy.how);$('voiceBtn').textContent=voiceOn?tx(copy.voice):tx(copy.muted);$('restartBtn').textContent=tx(copy.new);document.documentElement.lang=lang()}function hud(){$('score').textContent=score;$('streak').textContent=streak;$('wisdom').textContent=wisdom;$('round').textContent=Math.min(round+1,total);$('bar').style.width=(round/total*100)+'%';$('orbs').innerHTML='';for(let i=0;i<total;i++){let d=document.createElement('div');d.className='orb '+(i<round?'on':'');d.textContent=i<round?cards[i].icon:'';$('orbs').appendChild(d)}}function render(){baseUi();hud();$('reward').style.display='none';let c=cards[round];$('world').textContent=c.icon;$('topic').textContent=tx(c.topic);$('question').textContent=tx(c.q);$('scene').textContent=c.scene;$('lesson').textContent=tx(copy.empty);let opts=c.choices.map((choice,i)=>({choice,i})).sort(()=>Math.random()-.5);$('choices').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=tx(o.choice);b.onclick=()=>choose(o.i,b);$('choices').appendChild(b)});speak(tx(c.q))}function choose(i,b){let c=cards[round];b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),180);if(i===c.a){score++;streak++;wisdom++;sound('ding');popup(tx(copy.correct));confetti();$('lesson').textContent='🧠 '+tx(c.lesson);speak(tx(c.lesson))}else{streak=0;sound('wrong');popup(tx(copy.almost));wrongNotes.push(tx(c.topic)+': '+tx(c.lesson));$('lesson').textContent='🧠 '+tx(c.lesson);speak(tx(c.lesson))}setTimeout(()=>{round++;if(round>=total)end();else render()},1550);hud()}function end(){let badge=score>=9?T('🌎 Planet Guardian','🌎 Guardián del Planeta'):T('🌱 Element Explorer','🌱 Explorador de Elementos');if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');$('bar').style.width='100%';$('world').textContent='🏆';$('topic').textContent=tx(copy.done);$('question').textContent=tx(copy.grade)+(score>=9?'A+':score>=7?'A':score>=5?'B':'C');$('scene').textContent='🌎 💧 🌬️ 🔥 🌱 ⚖️';$('lesson').textContent=tx(copy.earned)+badge+'.';$('choices').innerHTML='';[['🔁',reset,copy.replay],['💬',showLessons,copy.review]].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0]+' '+tx(x[2]);b.onclick=x[1];$('choices').appendChild(b)});showLessons();popup(tx(copy.done));confetti(40);speak(tx(copy.done)+'. '+tx(copy.earned)+badge)}function showLessons(){$('reward').style.display='block';let lessons=cards.map(c=>'<div class="unlock">'+c.icon+' <b>'+tx(c.topic)+'</b><br>'+tx(c.lesson)+'</div>').join('');$('reward').innerHTML='<div>'+tx(copy.keys)+'</div>'+lessons+'<div>'+badges.join(' ')+'</div><div>'+tx(copy.next)+'</div>'}function reset(){score=0;streak=0;wisdom=0;round=0;wrongNotes=[];shuffle(cards);render()}$('manualBtn').onclick=()=>{$('modal').classList.add('show');speak(T('Learn earth, water, air, fire, storms, waves and balance.','Aprende tierra, agua, aire, fuego, tormentas, olas y equilibrio.'))};$('closeManual').onclick=()=>$('modal').classList.remove('show');$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;baseUi();if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};$('restartBtn').onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script></body></html>
