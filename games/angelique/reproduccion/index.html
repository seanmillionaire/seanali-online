<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Angelique | Reproducción Rush</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Juego rápido A/B para practicar reproducción."><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#fff26f,transparent 22%),radial-gradient(circle at 80% 15%,#48d7ff,transparent 28%),linear-gradient(180deg,#ff62b7,#7d4cff 55%,#101436);color:#fff;padding:12px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}.speed:before,.speed:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 8px,transparent 8px 32px);animation:dash .55s linear infinite;opacity:.5}.wrap{width:100%;max-width:760px;margin:0 auto}.game{background:#fff6e6;color:#28123f;border:5px solid #101436;border-radius:34px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.24)}.top{text-align:center;padding:16px;background:radial-gradient(circle at top,#ffcf3d,transparent 36%),linear-gradient(135deg,#00d4ff,#7d4cff,#ff62b7);color:#fff;border-bottom:5px solid #101436}.tag{display:inline-block;background:#fff;color:#101436;border:3px solid #ffcf3d;border-radius:999px;padding:7px 13px;font-weight:900;margin-bottom:8px}.top h1{font-size:clamp(36px,9vw,66px);line-height:.86;margin:0;text-shadow:0 5px 0 rgba(0,0,0,.25)}.top p{font-size:18px;font-weight:900;margin:8px 0 0;color:#fffbe8}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#e8fbff;padding:10px;border-bottom:4px solid #101436}.pill{background:#fff;border:3px solid #101436;border-radius:16px;text-align:center;font-size:15px;font-weight:900;padding:7px 4px}.barBox{height:18px;border:3px solid #101436;border-radius:99px;margin:10px 14px;background:#fff;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#34d17a,#00d4ff,#ffcf3d,#ff62b7);transition:.2s}.stage{text-align:center;padding:14px}.runner{font-size:68px;line-height:1;animation:run .45s ease-in-out infinite}.roundTag{display:inline-block;background:#101436;color:#fff;border:3px solid #ffcf3d;border-radius:999px;padding:8px 13px;font-size:17px;font-weight:900;margin:8px 0}.question{font-size:clamp(26px,7vw,44px);line-height:.98;font-weight:900;background:#fff;border:5px solid #101436;border-radius:26px;padding:17px 14px;margin:8px 0 10px;box-shadow:0 8px 0 rgba(0,0,0,.16)}.hint{font-size:18px;line-height:1.15;font-weight:900;background:#28123f;color:#fff;border:4px solid #48d7ff;border-radius:22px;padding:12px;margin:10px 0;text-align:left}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.answer{border:5px solid #101436;border-radius:28px;padding:18px 10px;font-size:clamp(22px,6vw,38px);line-height:1.02;font-weight:900;min-height:132px;color:#101436;box-shadow:0 9px 0 #101436;background:#fff;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.answer .letter{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#101436;color:#fff;font-size:30px}.answer.a{background:linear-gradient(180deg,#fff26f,#ffcf3d)}.answer.b{background:linear-gradient(180deg,#b8f2ff,#48d7ff)}.answer:active,.answer.hit{transform:translateY(7px);box-shadow:0 2px 0 #101436}.answer.good{background:linear-gradient(180deg,#d9ffe9,#34d17a)!important}.answer.bad{background:linear-gradient(180deg,#ff3d3d,#b40020)!important;color:#fff!important}.helper{background:#f4ecff;border:3px solid #b66dff;border-radius:22px;padding:12px;font-size:18px;line-height:1.2;font-weight:900;text-align:left;margin-top:12px;color:#28123f}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:16px;font-weight:900;background:#d5fff0;color:#28123f;box-shadow:0 6px 0 #7abf9f;cursor:pointer}.small.primary{background:#ffcf3d;box-shadow:0 6px 0 #a86f00}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.box{background:#fff6e6;border:5px solid #101436;border-radius:28px;padding:20px;max-width:520px;width:100%;text-align:center;color:#28123f}.box h2{font-size:31px;margin:0 0 10px}.box li{font-size:20px;font-weight:900;line-height:1.24}.box ol{text-align:left}.box button{width:100%;border:0;border-radius:20px;padding:16px;font-size:22px;font-weight:900;background:#ffcf3d;color:#28123f;box-shadow:0 7px 0 #a86f00}.popup{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);background:white;border:5px solid #101436;border-radius:26px;padding:20px 24px;font-size:30px;font-weight:900;opacity:0;pointer-events:none;z-index:30;text-align:center;color:#101436}.popup.show{animation:pop .72s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.1s linear forwards;z-index:25}@keyframes dash{to{transform:translateX(-50px)}}@keyframes run{50%{transform:translateX(6px) rotate(-2deg) scale(1.04)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-72%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:430px){body{padding:10px}.hud{grid-template-columns:repeat(2,1fr)}.answers{gap:8px}.answer{min-height:116px;padding:14px 8px}.controls{grid-template-columns:1fr}.runner{font-size:58px}.hint,.helper{font-size:16px}}</style></head><body class="speed"><main class="wrap"><section class="game"><div class="top"><div class="tag">🔒 Angelique · A/B Rush</div><h1>⚡ Repro Rush</h1><p>Lee rápido. Toca A o B. ¡Zoom!</p></div><div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🏁 <span id="round">1</span>/<span id="total">12</span></div><div class="pill">⏱️ <span id="timer">5</span></div></div><div class="barBox"><div class="bar" id="bar"></div></div><section class="stage"><div class="runner" id="runner">💨</div><div class="roundTag" id="mode">Pregunta Rush</div><div class="question" id="question">¿Reproducción significa continuar la especie?</div><div class="hint" id="chant">Pista turbo: reproducir = nuevos seres + continuar.</div><div class="answers" id="answers"></div><div class="helper" id="helper">👉 Toca A o B. Si dudas, mira la pista turbo.</div><div class="controls"><button class="small primary" id="voiceBtn">🔊 Leer</button><button class="small" id="helpBtn">📘 Cómo</button><button class="small" id="resetBtn">🔁 Nuevo</button></div></section></section></main><div class="popup" id="popup">¡Bien!</div><script src="/games/sounds.js"></script><script>let score=0,streak=0,round=0,time=5,timer=null,locked=false;const $=id=>document.getElementById(id);const total=12;const bank=[{q:'¿Reproducción significa continuar la especie?',a:'Sí',b:'No',ok:'Sí',hint:'reproducir = nuevos seres + continuidad.',why:'Correcto. La reproducción ayuda a continuar la especie.'},{q:'¿Sexual usa macho y hembra?',a:'Sí',b:'No',ok:'Sí',hint:'sexual = dos células sexuales se unen.',why:'Correcto. En la reproducción sexual participan macho y hembra.'},{q:'¿Asexual usa un solo individuo?',a:'Sí',b:'No',ok:'Sí',hint:'asexual = uno solo.',why:'Correcto. Asexual se hace con un solo individuo.'},{q:'¿El estambre produce polen?',a:'Sí',b:'No',ok:'Sí',hint:'estambre = polen.',why:'Correcto. El estambre produce polen.'},{q:'¿El pistilo produce óvulos?',a:'Sí',b:'No',ok:'Sí',hint:'pistilo = óvulos.',why:'Correcto. El pistilo produce óvulos.'},{q:'¿Después de fecundar se forma fruto y semilla?',a:'Sí',b:'No',ok:'Sí',hint:'fecundación en plantas = fruto + semilla.',why:'Correcto. Después puede formarse fruto con semilla.'},{q:'¿Ovíparo significa que nace de huevo?',a:'Sí',b:'No',ok:'Sí',hint:'OVI suena a huevo.',why:'Correcto. Ovíparo nace de huevo.'},{q:'¿Vivíparo se desarrolla en el vientre?',a:'Sí',b:'No',ok:'Sí',hint:'VIVI = vientre.',why:'Correcto. Vivíparo se desarrolla en el vientre.'},{q:'¿Ovovivíparo es huevo dentro del cuerpo?',a:'Sí',b:'No',ok:'Sí',hint:'OVO + VIVI = huevo dentro.',why:'Correcto. El huevo permanece dentro hasta nacer.'},{q:'¿Una estaca puede formar otra planta?',a:'Sí',b:'No',ok:'Sí',hint:'estaca = parte de planta que puede brotar.',why:'Correcto. Una estaca puede formar otra planta.'},{q:'¿Un injerto une partes de plantas?',a:'Sí',b:'No',ok:'Sí',hint:'injerto = unir una planta con otra.',why:'Correcto. Injertar es unir partes de plantas.'},{q:'¿La hidra puede reproducirse de forma directa?',a:'Sí',b:'No',ok:'Sí',hint:'hidra y estrella de mar = ejemplos directos.',why:'Correcto. La hidra es ejemplo de reproducción directa.'},{q:'¿La raíz produce polen?',a:'Sí',b:'No',ok:'No',hint:'polen vive en el estambre.',why:'Correcto. La raíz no produce polen; el estambre produce polen.'},{q:'¿Asexual necesita macho y hembra?',a:'Sí',b:'No',ok:'No',hint:'asexual = uno solo.',why:'Correcto. Asexual no necesita macho y hembra.'},{q:'¿El fruto guarda semillas?',a:'Sí',b:'No',ok:'Sí',hint:'fruto + semilla = nueva planta.',why:'Correcto. El fruto puede guardar semillas.'}].sort(()=>Math.random()-.5);function say(t){try{if(window.SeanGameVoice&&SeanGameVoice.speak)SeanGameVoice.speak(t)}catch(e){}}function sound(n){try{if(window.SeanGameSounds&&SeanGameSounds[n])SeanGameSounds[n]()}catch(e){}}function pop(t){const p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(){['⚡','💨','🌸','⭐','💛'].forEach((x,i)=>{const d=document.createElement('div');d.className='confetti';d.textContent=x;d.style.left=(12+i*18+Math.random()*8)+'vw';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)})}function current(){return bank[round%bank.length]}function startClock(){clearInterval(timer);time=5;$('timer').textContent=time;timer=setInterval(()=>{if(locked)return;time--;$('timer').textContent=time;if(time<=0){clearInterval(timer);timeout()}},1000)}function render(){if(round>=total)return finish();locked=false;const c=current();$('round').textContent=round+1;$('total').textContent=total;$('score').textContent=score;$('streak').textContent=streak;$('bar').style.width=Math.round(round/total*100)+'%';$('mode').textContent='Rush '+(round+1)+' · A/B';$('question').textContent=c.q;$('chant').textContent='Pista turbo: '+c.hint;$('helper').textContent='👉 Toca A o B antes que el contador se acabe.';$('answers').innerHTML='<button class="answer a" data-choice="a"><span class="letter">A</span><span>'+c.a+'</span></button><button class="answer b" data-choice="b"><span class="letter">B</span><span>'+c.b+'</span></button>';document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>pick(btn,c));startClock()}function pick(btn,c){if(locked)return;locked=true;clearInterval(timer);const choice=btn.dataset.choice==='a'?c.a:c.b;if(choice===c.ok){btn.classList.add('good','hit');score+=10+(time*2);streak++;$('score').textContent=score;$('streak').textContent=streak;$('helper').textContent='✅ '+c.why;pop(streak>=3?'🔥 Turbo racha!':'✅ ¡Zoom!');sound('correct');if(streak>=3)confetti();setTimeout(()=>{round++;render()},900)}else{btn.classList.add('bad','wrong');streak=0;$('streak').textContent=0;$('helper').textContent='Respuesta correcta: '+c.ok+'. '+c.why;pop('💥 ¡Nope!');sound('wrong');setTimeout(()=>{round++;render()},1150)}}function timeout(){if(locked)return;locked=true;streak=0;$('streak').textContent=0;const c=current();$('helper').textContent='⏱️ Tiempo. La respuesta era '+c.ok+'. '+c.why;pop('⏱️ ¡Muy lento!');sound('wrong');setTimeout(()=>{round++;render()},1150)}function finish(){clearInterval(timer);$('bar').style.width='100%';$('runner').textContent='🏆';$('mode').textContent='Rush completo';$('question').textContent='¡Angelique terminó el Repro Rush!';$('chant').textContent='Badge: Turbo Reproducción. A/B sin miedo.';$('helper').textContent='🏁 Repaso rápido: sexual, asexual, flor, fruto, semilla, ovíparo, vivíparo y ovovivíparo.';$('answers').innerHTML='<button class="answer good" onclick="restart()"><span class="letter">↻</span><span>Jugar otra vez</span></button>';pop('🏆 Badge!');confetti();sound('levelUp')}function restart(){score=0;streak=0;round=0;render()}$('helpBtn').onclick=()=>$('modal').classList.add('show');$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('resetBtn').onclick=restart;$('voiceBtn').onclick=()=>{const c=current();say(c.q+'. '+c.hint)};render();</script><script src="/games/game-rules.js"></script>
