<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beats</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #401d67, #101018 65%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .mpc {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #242434, #15151f);
      border: 4px solid #3f3f55;
      border-radius: 26px;
      padding: 12px;
      box-shadow: 0 22px 50px rgba(0,0,0,.45);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -1px;
    }
    .screen {
      background: #b8ff6a;
      color: #12210b;
      border-radius: 13px;
      padding: 9px 11px;
      font-size: 16px;
      font-weight: 900;
      text-align: right;
      min-width: 124px;
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.12);
    }
    .pads {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .pad {
      min-height: 112px;
      border: 0;
      border-radius: 20px;
      color: white;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.08);
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }
    .pad span {
      display: block;
      font-size: 15px;
      opacity: .86;
      margin-top: 6px;
      letter-spacing: 1px;
    }
    .pad:active, .pad.hit {
      transform: translateY(6px) scale(.98);
      box-shadow: 0 1px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.2);
      filter: brightness(1.25);
    }
    .kick { background: linear-gradient(160deg, #ff3b3b, #9b1212); }
    .snare { background: linear-gradient(160deg, #3b8cff, #113c9b); }
    .hat { background: linear-gradient(160deg, #ffd43b, #b87900); color: #221700; }
    .clap { background: linear-gradient(160deg, #ff5ee7, #8f1680); }
    .dog { background: linear-gradient(160deg, #ff934d, #9b3f12); }
    .cow { background: linear-gradient(160deg, #ffffff, #8d8d8d); color: #161616; }
    .bass { background: linear-gradient(160deg, #9c5cff, #3a167e); }
    .fx { background: linear-gradient(160deg, #41e38b, #0e7a43); }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .control {
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      background: #f1f1f1;
      color: #17171f;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 5px 0 #8a8a8a;
      cursor: pointer;
      touch-action: manipulation;
    }
    .control.hot { background: #ffd84d; box-shadow: 0 5px 0 #bd8610; }
    .control:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #8a8a8a;
    }
    .hint {
      text-align: center;
      color: #bfc0ff;
      font-weight: 800;
      margin-top: 9px;
      font-size: 13px;
    }
    .flash {
      position: fixed;
      pointer-events: none;
      font-size: 48px;
      animation: pop .55s ease forwards;
      z-index: 20;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
      30% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; }
      100% { transform: translate(-50%, -140%) scale(.85); opacity: 0; }
    }
    @media (min-width: 650px) {
      .pads { grid-template-columns: repeat(4, 1fr); }
      .controls { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 390px) {
      h1 { font-size: 27px; }
      .screen { font-size: 14px; min-width: 105px; }
      .pad { min-height: 101px; font-size: 23px; border-radius: 18px; }
      .control { font-size: 16px; min-height: 54px; }
    }
  </style>
</head>
<body>
  <main class="mpc">
    <div class="top">
      <h1>BEATS</h1>
      <div class="screen" id="screen">Tap pad</div>
    </div>

    <section class="pads">
      <button class="pad kick" data-sound="kick">KICK <span>BOOM</span></button>
      <button class="pad snare" data-sound="snare">SNARE <span>PAH</span></button>
      <button class="pad hat" data-sound="hat">HAT <span>TSS</span></button>
      <button class="pad clap" data-sound="clap">CLAP <span>CLAP</span></button>
      <button class="pad bass" data-sound="bass">BASS <span>WUB</span></button>
      <button class="pad fx" data-sound="fx">FX <span>ZAP</span></button>
      <button class="pad dog" data-sound="dog">DOG <span>WOOF</span></button>
      <button class="pad cow" data-sound="cow">COW <span>MOO</span></button>
    </section>

    <section class="controls">
      <button class="control hot" id="reggaetonBtn">Reggaeton</button>
      <button class="control hot" id="dancehallBtn">Dancehall</button>
      <button class="control" id="stopBtn">Stop</button>
    </section>

    <div class="hint">Keys: A S D F / Z X C V</div>
  </main>

  <script>
    let ctx;
    let demoTimer = null;
    let step = 0;
    let activePattern = null;

    const screen = document.getElementById('screen');
    const pads = Array.from(document.querySelectorAll('.pad'));

    function initAudio() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    }

    function env(gain, t, peak, dur) {
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    }

    function osc(freq, dur, type, vol, slideTo, when = 0) {
      initAudio();
      const t = ctx.currentTime + when;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), t + dur);
      env(g, t, vol, dur);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + dur + .04);
    }

    function noise(dur, vol, filterFreq = 9000, when = 0) {
      initAudio();
      const t = ctx.currentTime + when;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const g = ctx.createGain();
      filter.type = 'highpass';
      filter.frequency.value = filterFreq;
      env(g, t, vol, dur);
      src.buffer = buffer;
      src.connect(filter);
      filter.connect(g);
      g.connect(ctx.destination);
      src.start(t);
      src.stop(t + dur + .04);
    }

    function dogSound() {
      osc(360, .08, 'square', .20, 210, 0);
      osc(250, .10, 'square', .18, 170, .08);
      noise(.05, .08, 1100, .02);
    }

    function cowSound() {
      osc(170, .32, 'sawtooth', .22, 105, 0);
      osc(115, .38, 'sine', .20, 90, .04);
      noise(.10, .04, 700, .05);
    }

    function hypeStab() {
      osc(220, .09, 'square', .18, 180, 0);
      osc(330, .11, 'sawtooth', .14, 260, .02);
      osc(440, .13, 'triangle', .12, 330, .04);
      noise(.08, .12, 2500, .02);
    }

    function play(sound, visual = true) {
      initAudio();
      if (sound === 'kick') osc(135, .22, 'sine', .75, 42);
      if (sound === 'snare') { noise(.13, .35, 1200); osc(190, .08, 'triangle', .18, 120); }
      if (sound === 'hat') noise(.05, .20, 6800);
      if (sound === 'clap') { noise(.045, .25, 1500); setTimeout(() => noise(.045, .23, 1500), 45); setTimeout(() => noise(.07, .20, 1500), 90); }
      if (sound === 'bass') osc(82, .28, 'sawtooth', .33, 54);
      if (sound === 'fx') hypeStab();
      if (sound === 'dog') dogSound();
      if (sound === 'cow') cowSound();
      if (visual) hitPad(sound);
    }

    function hitPad(sound) {
      const pad = document.querySelector(`[data-sound="${sound}"]`);
      if (!pad) return;
      pad.classList.add('hit');
      setTimeout(() => pad.classList.remove('hit'), 135);
      screen.textContent = sound.toUpperCase();
      pop(sound);
    }

    function pop(sound) {
      const icons = { kick: '💥', snare: '⚡', hat: '✨', clap: '👏', bass: '🔊', fx: '🚨', dog: '🐶', cow: '🐮' };
      const el = document.createElement('div');
      el.className = 'flash';
      el.textContent = icons[sound] || '🎵';
      el.style.left = (25 + Math.random() * 50) + 'vw';
      el.style.top = (45 + Math.random() * 25) + 'vh';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 650);
    }

    pads.forEach(pad => {
      pad.addEventListener('pointerdown', e => {
        e.preventDefault();
        play(pad.dataset.sound);
      });
    });

    const patterns = {
      reggaeton: {
        name: 'REGGAETON',
        speed: 150,
        steps: [
          ['kick','bass'], ['hat'], ['dog'], ['hat'],
          ['snare','clap'], ['hat'], ['kick'], ['hat'],
          ['kick','bass'], ['hat'], ['fx'], ['hat'],
          ['snare','clap'], ['hat'], ['kick','dog'], ['hat']
        ]
      },
      dancehall: {
        name: 'DANCEHALL',
        speed: 165,
        steps: [
          ['kick','bass'], [], ['hat'], ['cow'],
          ['snare'], ['hat'], [], ['kick'],
          ['clap'], [], ['hat'], ['dog'],
          ['snare','bass'], ['hat'], ['fx','cow'], ['kick']
        ]
      }
    };

    function startPattern(type) {
      initAudio();
      clearInterval(demoTimer);
      activePattern = patterns[type];
      step = 0;
      screen.textContent = activePattern.name;
      demoTimer = setInterval(() => {
        const sounds = activePattern.steps[step % activePattern.steps.length];
        sounds.forEach((s, i) => setTimeout(() => play(s), i * 18));
        step++;
      }, activePattern.speed);
    }

    document.getElementById('reggaetonBtn').onclick = () => startPattern('reggaeton');
    document.getElementById('dancehallBtn').onclick = () => startPattern('dancehall');
    document.getElementById('stopBtn').onclick = () => {
      clearInterval(demoTimer);
      activePattern = null;
      screen.textContent = 'Stopped';
    };

    const keyMap = { a: 'kick', s: 'snare', d: 'hat', f: 'clap', z: 'bass', x: 'fx', c: 'dog', v: 'cow' };
    window.addEventListener('keydown', e => {
      const sound = keyMap[e.key.toLowerCase()];
      if (sound) {
        e.preventDefault();
        play(sound);
      }
    });
  </script>
</body>
</html>
