<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Beats</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#401d67,#101018 65%);color:white;display:flex;align-items:center;justify-content:center;padding:14px;-webkit-tap-highlight-color:transparent;user-select:none}.mpc{width:100%;max-width:560px;background:linear-gradient(180deg,#242434,#15151f);border:5px solid #3f3f55;border-radius:32px;padding:18px;box-shadow:0 22px 50px rgba(0,0,0,.45)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{margin:0;font-size:40px;line-height:1;letter-spacing:-1px}.screen{background:#b8ff6a;color:#12210b;border-radius:16px;padding:12px 14px;font-size:18px;font-weight:900;text-align:right;min-width:150px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.12)}.sub{font-size:19px;font-weight:800;margin:0 0 16px;color:#d7d7ff}.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.pad{min-height:130px;border:0;border-radius:24px;color:white;font-size:27px;font-weight:900;box-shadow:0 9px 0 rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.08);cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}.pad span{display:block;font-size:16px;opacity:.86;margin-top:7px;letter-spacing:1px}.pad:active,.pad.hit{transform:translateY(7px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.2);filter:brightness(1.25)}.kick{background:linear-gradient(160deg,#ff3b3b,#9b1212)}.snare{background:linear-gradient(160deg,#3b8cff,#113c9b)}.hat{background:linear-gradient(160deg,#ffd43b,#b87900);color:#221700}.clap{background:linear-gradient(160deg,#ff5ee7,#8f1680)}.rim{background:linear-gradient(160deg,#41e38b,#0e7a43)}.bass{background:linear-gradient(160deg,#9c5cff,#3a167e)}.fx{background:linear-gradient(160deg,#ffffff,#ff7a18);color:#171018;grid-column:1/-1;min-height:105px}.voice{background:linear-gradient(160deg,#00f5ff,#0066ff);color:#061018;grid-column:1/-1;min-height:105px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.control{min-height:66px;border:0;border-radius:18px;background:#f1f1f1;color:#17171f;font-size:21px;font-weight:900;box-shadow:0 6px 0 #8a8a8a;cursor:pointer}.control.hot{background:#ffd84d;box-shadow:0 6px 0 #bd8610}.control:active{transform:translateY(5px);box-shadow:0 1px 0 #8a8a8a}.hint{text-align:center;color:#bfc0ff;font-weight:800;margin-top:14px;font-size:16px}.flash{position:fixed;pointer-events:none;font-size:48px;animation:pop .55s ease forwards;z-index:20}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-80%) scale(1.25);opacity:1}100%{transform:translate(-50%,-140%) scale(.85);opacity:0}}@media(min-width:650px){.pads{grid-template-columns:repeat(3,1fr)}.fx,.voice{grid-column:1/-1}.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:390px){.mpc{padding:14px;border-radius:26px}h1{font-size:34px}.screen{font-size:16px;min-width:124px}.pad{min-height:118px;font-size:24px}.fx,.voice{min-height:94px}.control{font-size:18px}}</style></head><body><main class="mpc"><div class="top"><h1>BEATS</h1><div class="screen" id="screen">Tap a pad</div></div><p class="sub">Mini MPC. Big buttons. Make noise.</p><section class="pads"><button class="pad kick" data-sound="kick">KICK <span>BOOM</span></button><button class="pad snare" data-sound="snare">SNARE <span>PAH</span></button><button class="pad hat" data-sound="hat">HAT <span>TSS</span></button><button class="pad clap" data-sound="clap">CLAP <span>CLAP</span></button><button class="pad rim" data-sound="rim">RIM <span>TAK</span></button><button class="pad bass" data-sound="bass">BASS <span>WUB</span></button><button class="pad fx" data-sound="fx">FX <span>HYPE HIT</span></button><button class="pad voice" data-sound="hey">HEY <span>SALE HIT</span></button></section><section class="controls"><button class="control hot" id="reggaetonBtn">▶ Reggaeton</button><button class="control hot" id="dancehallBtn">▶ Dancehall</button><button class="control" id="stopBtn">■ Stop</button></section><div class="hint">Keys: A S D / Z X C. Space = FX. V = HEY.</div></main><script src="/games/voice.js"></script><script>let ctx,demoTimer=null,step=0,activePattern=null;const screen=document.getElementById('screen');const pads=Array.from(document.querySelectorAll('.pad'));function initAudio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function env(g,t,p,d){g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(p,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+d)}function osc(f,d,type,v,slide,when=0){initAudio();const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(slide,1),t+d);env(g,t,v,d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.04)}function noise(d,v,filterFreq=9000,when=0){initAudio();const t=ctx.currentTime+when,b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=filterFreq;env(g,t,v,d);s.buffer=b;s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+d+.04)}function hypeHit(){osc(220,.09,'square',.18,180,0);osc(330,.11,'sawtooth',.14,260,.02);osc(440,.13,'triangle',.12,330,.04);noise(.08,.12,2500,.02);setTimeout(()=>osc(880,.06,'square',.10,660),95)}function saleHit(){osc(1040,.055,'square',.32,1320,0);osc(1560,.06,'triangle',.24,1850,.055);osc(2090,.08,'sine',.18,2400,.12);osc(392,.10,'triangle',.13,523,.02);setTimeout(()=>osc(1760,.05,'square',.16,1180),175);setTimeout(()=>osc(1320,.06,'triangle',.13,1760),230)}function heyCut(){saleHit();const used=sessionStorage.getItem('beatsHeyVoicePlayed')==='1';if(!used&&window.SeanGameVoice&&window.SeanGameVoice.force){sessionStorage.setItem('beatsHeyVoicePlayed','1');setTimeout(()=>window.SeanGameVoice.force('hey'),45)}}function play(sound,visual=true){initAudio();if(sound==='kick')osc(135,.22,'sine',.75,42);if(sound==='snare'){noise(.13,.35,1200);osc(190,.08,'triangle',.18,120)}if(sound==='hat')noise(.05,.20,6800);if(sound==='clap'){noise(.045,.25,1500);setTimeout(()=>noise(.045,.23,1500),45);setTimeout(()=>noise(.07,.20,1500),90)}if(sound==='rim'){osc(760,.045,'square',.18,640);noise(.035,.08,4200)}if(sound==='bass')osc(82,.28,'sawtooth',.33,54);if(sound==='fx')hypeHit();if(sound==='hey')heyCut();if(visual)hitPad(sound)}function hitPad(sound){const pad=document.querySelector(`[data-sound="${sound}"]`);if(!pad)return;pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),135);screen.textContent=sound==='fx'?'HYPE':sound==='hey'?'SALE':sound.toUpperCase();pop(sound)}function pop(sound){const icons={kick:'💥',snare:'⚡',hat:'✨',clap:'👏',rim:'🔸',bass:'🔊',fx:'🚨',hey:'💸'};const el=document.createElement('div');el.className='flash';el.textContent=icons[sound]||'🎵';el.style.left=(25+Math.random()*50)+'vw';el.style.top=(45+Math.random()*25)+'vh';document.body.appendChild(el);setTimeout(()=>el.remove(),650)}pads.forEach(pad=>pad.addEventListener('pointerdown',e=>{e.preventDefault();play(pad.dataset.sound)}));const patterns={reggaeton:{name:'REGGAETON',speed:145,steps:[['kick','bass'],['hat'],[],['hat'],['snare','clap'],['hat'],['kick'],['hat'],['kick','bass'],['hat'],[],['hat'],['snare','clap'],['hat'],['kick'],['hat','hey']]},dancehall:{name:'DANCEHALL',speed:165,steps:[['kick','bass'],[],['hat'],['rim'],['snare'],['hat'],[],['kick'],['clap'],[],['hat'],['rim'],['snare','bass'],['hat'],['fx'],['kick','hey']]}};function startPattern(type){initAudio();clearInterval(demoTimer);activePattern=patterns[type];step=0;screen.textContent=activePattern.name;demoTimer=setInterval(()=>{const sounds=activePattern.steps[step%activePattern.steps.length];sounds.forEach((s,i)=>setTimeout(()=>play(s),i*18));step++},activePattern.speed)}document.getElementById('reggaetonBtn').onclick=()=>startPattern('reggaeton');document.getElementById('dancehallBtn').onclick=()=>startPattern('dancehall');document.getElementById('stopBtn').onclick=()=>{clearInterval(demoTimer);activePattern=null;if(window.SeanGameVoice)window.SeanGameVoice.stop();screen.textContent='Stopped'};const keyMap={a:'kick',s:'snare',d:'hat',z:'clap',x:'rim',c:'bass',' ':'fx',v:'hey'};window.addEventListener('keydown',e=>{const sound=keyMap[e.key.toLowerCase()];if(sound){e.preventDefault();play(sound)}});</script><script src="/games/guide-robot.js"></script>
</body></html>
