<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beats</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #401d67, #101018 65%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .mpc {
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #242434, #15151f);
      border: 4px solid #3f3f55;
      border-radius: 26px;
      padding: 12px;
      box-shadow: 0 22px 50px rgba(0,0,0,.45);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 { margin: 0; font-size: 30px; line-height: 1; letter-spacing: -1px; }
    .screen {
      background: #b8ff6a; color: #12210b; border-radius: 13px; padding: 9px 11px;
      font-size: 16px; font-weight: 900; text-align: right; min-width: 124px;
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.12);
    }
    .section-label { font-size: 12px; font-weight: 900; color: #bfc0ff; margin: 8px 2px 6px; letter-spacing: 1px; text-transform: uppercase; }
    .pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pad {
      min-height: 102px; border: 0; border-radius: 20px; color: white; font-size: 25px; font-weight: 900;
      box-shadow: 0 7px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.08);
      cursor: pointer; touch-action: manipulation; position: relative; overflow: hidden;
    }
    .pad span { display: block; font-size: 14px; opacity: .86; margin-top: 5px; letter-spacing: 1px; }
    .pad:active, .pad.hit { transform: translateY(6px) scale(.98); box-shadow: 0 1px 0 rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.2); filter: brightness(1.25); }
    .kick { background: linear-gradient(160deg, #ff3b3b, #9b1212); }
    .snare { background: linear-gradient(160deg, #3b8cff, #113c9b); }
    .hat { background: linear-gradient(160deg, #ffd43b, #b87900); color: #221700; }
    .clap { background: linear-gradient(160deg, #ff5ee7, #8f1680); }
    .note { background: linear-gradient(160deg, #41e38b, #0e7a43); }
    .note.alt { background: linear-gradient(160deg, #9c5cff, #3a167e); }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .control { min-height: 56px; border: 0; border-radius: 16px; background: #f1f1f1; color: #17171f; font-size: 17px; font-weight: 900; box-shadow: 0 5px 0 #8a8a8a; cursor: pointer; touch-action: manipulation; }
    .control.hot { background: #ffd84d; box-shadow: 0 5px 0 #bd8610; }
    .control:active { transform: translateY(4px); box-shadow: 0 1px 0 #8a8a8a; }
    .hint { text-align: center; color: #bfc0ff; font-weight: 800; margin-top: 9px; font-size: 13px; }
    .flash { position: fixed; pointer-events: none; font-size: 48px; animation: pop .55s ease forwards; z-index: 20; }
    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 30% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -140%) scale(.85); opacity: 0; } }
    @media (min-width: 650px) { .pads { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 390px) { h1 { font-size: 27px; } .screen { font-size: 14px; min-width: 105px; } .pad { min-height: 92px; font-size: 22px; border-radius: 18px; } .control { font-size: 15px; min-height: 52px; } }
  </style>
</head>
<body>
  <main class="mpc">
    <div class="top"><h1>BEATS</h1><div class="screen" id="screen">Tap pad</div></div>
    <div class="section-label">Melody</div>
    <section class="pads">
      <button class="pad note" data-sound="c5">C <span>BELL</span></button>
      <button class="pad note" data-sound="e5">E <span>BELL</span></button>
      <button class="pad note alt" data-sound="g5">G <span>BELL</span></button>
      <button class="pad note alt" data-sound="c6">C+ <span>BELL</span></button>
    </section>
    <div class="section-label">Drums</div>
    <section class="pads">
      <button class="pad kick" data-sound="kick">KICK <span>BOOM</span></button>
      <button class="pad snare" data-sound="snare">SNARE <span>PAH</span></button>
      <button class="pad hat" data-sound="hat">HAT <span>TSS</span></button>
      <button class="pad clap" data-sound="clap">CLAP <span>CLAP</span></button>
    </section>
    <section class="controls">
      <button class="control hot" id="reggaetonBtn">Reggaeton</button>
      <button class="control hot" id="dancehallBtn">Dancehall</button>
      <button class="control" id="arpBtn">Arp</button>
      <button class="control" id="chordBtn">Chord</button>
      <button class="control" id="stopBtn">Stop</button>
      <button class="control" id="soundBtn">Bell</button>
    </section>
    <div class="hint">Keys: Q W E R = melody / A S D F = drums</div>
  </main>
  <script>
    let ctx, demoTimer = null, arpTimer = null, step = 0, instrument = 'bell';
    const screen = document.getElementById('screen');
    const pads = Array.from(document.querySelectorAll('.pad'));
    const noteFreqs = { c5: 523.25, e5: 659.25, g5: 783.99, c6: 1046.5 };
    const noteNames = { c5: 'C', e5: 'E', g5: 'G', c6: 'C+' };
    function initAudio(){ if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }
    function env(g,t,peak,dur){ g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.008); g.gain.exponentialRampToValueAtTime(0.001,t+dur); }
    function osc(freq,dur,type,vol,slideTo,when=0){ initAudio(); const t=ctx.currentTime+when; const o=ctx.createOscillator(); const g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1),t+dur); env(g,t,vol,dur); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+.04); }
    function noise(dur,vol,filterFreq=9000,when=0){ initAudio(); const t=ctx.currentTime+when; const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); const f=ctx.createBiquadFilter(); const g=ctx.createGain(); f.type='highpass'; f.frequency.value=filterFreq; env(g,t,vol,dur); s.buffer=b; s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t+dur+.04); }
    function playNote(sound){ const f=noteFreqs[sound]; if(!f) return; if(instrument==='bell'){ osc(f,.52,'sine',.16); osc(f*2,.24,'triangle',.07,null,.01); osc(f*3,.12,'sine',.035,null,.02); } else { osc(f,.20,'sawtooth',.15); osc(f/2,.24,'triangle',.06,null,.01); } }
    function play(sound,visual=true){ initAudio(); if(noteFreqs[sound]) playNote(sound); if(sound==='kick') osc(135,.22,'sine',.75,42); if(sound==='snare'){ noise(.13,.35,1200); osc(190,.08,'triangle',.18,120); } if(sound==='hat') noise(.05,.20,6800); if(sound==='clap'){ noise(.045,.25,1500); setTimeout(()=>noise(.045,.23,1500),45); setTimeout(()=>noise(.07,.20,1500),90); } if(visual) hitPad(sound); }
    function hitPad(sound){ const pad=document.querySelector(`[data-sound="${sound}"]`); if(!pad) return; pad.classList.add('hit'); setTimeout(()=>pad.classList.remove('hit'),135); screen.textContent=noteNames[sound]||sound.toUpperCase(); pop(sound); }
    function pop(sound){ const icons={kick:'💥',snare:'⚡',hat:'✨',clap:'👏',c5:'🎹',e5:'🎵',g5:'🎶',c6:'🌟'}; const el=document.createElement('div'); el.className='flash'; el.textContent=icons[sound]||'🎵'; el.style.left=(25+Math.random()*50)+'vw'; el.style.top=(45+Math.random()*25)+'vh'; document.body.appendChild(el); setTimeout(()=>el.remove(),650); }
    pads.forEach(pad=>pad.addEventListener('pointerdown',e=>{ e.preventDefault(); play(pad.dataset.sound); }));
    const patterns={ reggaeton:{name:'REGGAETON',speed:145,steps:[['kick','c5'],['hat'],['hat'],['snare','clap'],['kick'],['hat','e5'],['kick'],['snare'],['kick','c5'],['hat'],['hat','e5'],['snare'],['kick'],['hat'],['kick','g5'],['snare','clap','c6']]}, dancehall:{name:'DANCEHALL',speed:158,steps:[['hat'],['hat'],['kick','c5'],['hat'],['snare','clap'],['hat','g5'],['hat'],['kick'],['hat'],['hat'],['kick','e5'],['hat'],['snare'],['hat'],['kick','c6'],['hat']]} };
    function startPattern(type){ initAudio(); clearInterval(demoTimer); clearInterval(arpTimer); const p=patterns[type]; step=0; screen.textContent=p.name; demoTimer=setInterval(()=>{ const sounds=p.steps[step%p.steps.length]; sounds.forEach((s,i)=>setTimeout(()=>play(s),i*18)); step++; },p.speed); }
    function startArp(){ initAudio(); clearInterval(demoTimer); clearInterval(arpTimer); const arp=['c5','e5','g5','c6','g5','e5']; let i=0; screen.textContent='ARP'; arpTimer=setInterval(()=>{ play(arp[i%arp.length]); i++; },155); }
    function playChord(){ initAudio(); ['c5','e5','g5','c6'].forEach((n,i)=>setTimeout(()=>play(n),i*25)); screen.textContent='CHORD'; }
    document.getElementById('reggaetonBtn').onclick=()=>startPattern('reggaeton');
    document.getElementById('dancehallBtn').onclick=()=>startPattern('dancehall');
    document.getElementById('arpBtn').onclick=startArp;
    document.getElementById('chordBtn').onclick=playChord;
    document.getElementById('soundBtn').onclick=()=>{ instrument=instrument==='bell'?'pluck':'bell'; document.getElementById('soundBtn').textContent=instrument==='bell'?'Bell':'Pluck'; screen.textContent=instrument.toUpperCase(); };
    document.getElementById('stopBtn').onclick=()=>{ clearInterval(demoTimer); clearInterval(arpTimer); screen.textContent='Stopped'; };
    const keyMap={q:'c5',w:'e5',e:'g5',r:'c6',a:'kick',s:'snare',d:'hat',f:'clap'};
    window.addEventListener('keydown',e=>{ const sound=keyMap[e.key.toLowerCase()]; if(sound){ e.preventDefault(); play(sound); } });
  </script>
</body>
</html>
