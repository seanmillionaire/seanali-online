<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Piano Patterns</title><meta name="description" content="A mobile piano learning game with simple patterns, watch and repeat practice, music lessons, rewards and ES/EN support."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/piano/"><link rel="icon" type="image/png" href="https://hypnoticmeditations.b-cdn.net/images/fav/headphones.png"><meta name="theme-color" content="#7d4cff"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#f5e9ff,#b9ffe1 48%,#1d144b);color:#101436;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{max-width:680px;margin:0 auto;background:#fff6e6;border:5px solid #101436;border-radius:30px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.22)}.top{background:linear-gradient(135deg,#7d4cff,#00d4ff);padding:16px;text-align:center;border-bottom:5px solid #101436;color:#fff}h1{margin:0;font-size:38px;line-height:1;font-weight:900}.sub{font-size:18px;font-weight:900;margin-top:8px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#f5e9ff;border-bottom:4px solid #101436}.pill{background:#fff;border:3px solid #101436;border-radius:16px;padding:8px 4px;text-align:center;font-size:15px;font-weight:900}.xp{height:18px;background:#101436;border:3px solid #101436;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#00d4ff,#7d4cff,#ffc83d);transition:width .35s}.stage{text-align:center;padding:12px 16px 18px}.song{font-size:24px;line-height:1.08;font-weight:900;background:#fff;border:4px solid #101436;border-radius:24px;padding:14px;margin:8px 0 10px;box-shadow:0 7px 0 rgba(0,0,0,.14)}.teaching{font-size:19px;line-height:1.18;font-weight:900;background:#101436;color:#fff6e6;border:3px solid #00d4ff;border-radius:20px;padding:12px;margin:10px 0;min-height:70px}.pattern{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}.noteBubble{background:#ffc83d;border:3px solid #101436;border-radius:999px;min-width:42px;padding:8px 10px;font-size:19px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2)}.noteBubble.on{background:#00d4ff;color:#fff}.piano{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;background:#101436;border:5px solid #101436;border-radius:22px;padding:8px;margin-top:12px;min-height:178px}.key{border:0;border-radius:0 0 14px 14px;background:#fff;color:#101436;font-size:20px;font-weight:900;min-height:154px;box-shadow:inset 0 -8px 0 #d9d9d9;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px}.key.active,.key:active{background:#ffc83d;box-shadow:inset 0 -8px 0 #bd8610;transform:translateY(4px)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:15px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81}.patterns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pick{border:0;border-radius:18px;background:#f5e9ff;color:#101436;border:3px solid #7d4cff;padding:12px 8px;font-size:15px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2)}.pick.active{background:#ffc83d;border-color:#9b5d00}.reward{display:none;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:14px;margin-top:14px;font-size:18px;font-weight:900;line-height:1.25}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fff6e6;border:5px solid #101436;border-radius:28px;max-width:520px;width:100%;padding:20px;text-align:center}.manual ol{text-align:left;font-size:20px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#ffc83d;box-shadow:0 7px 0 #9b5d00;width:100%}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #101436;border-radius:28px;padding:22px 28px;font-size:31px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:390px){h1{font-size:31px}.song{font-size:21px}.teaching{font-size:17px}.piano{gap:3px;padding:6px;min-height:150px}.key{font-size:17px;min-height:128px}.patterns{grid-template-columns:1fr}.pill{font-size:13px}.small{font-size:13px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2 id="manualTitle">📘 How to Play</h2><ol id="manualList"></ol><button id="closeManual">Let’s go!</button></div></div><main class="game"><section class="top"><h1 id="gameTitle">🎹 Piano Patterns</h1><div class="sub" id="sub">Watch. Repeat. Learn the pattern.</div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🎵 <span id="songNum">1</span>/5</div><div class="pill">🧠 <span id="level">1</span></div></section><div class="xp"><div class="bar" id="bar"></div></div><section class="stage"><div class="song" id="songTitle">Choose a pattern</div><div class="teaching" id="teaching">The guide will start automatically. Tap Guide to replay it.</div><div class="pattern" id="pattern"></div><div class="piano" id="piano"></div><div class="controls"><button class="small" id="manualBtn">📘 How</button><button class="small" id="playBtn">▶️ Guide</button><button class="small" id="restartBtn">🔁 New</button></div><div class="patterns" id="patterns"></div><div class="reward" id="reward"></div></section></main><div class="popup" id="popup">Nice!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let audio=null,current=0,step=0,score=0,streak=0,voiceOn=true,lastLang=null,autoGuideTimer=null,playToken=0;const key='pianoBadges';let badges=JSON.parse(localStorage.getItem(key)||'[]');const $=id=>document.getElementById(id);const notes=['C','D','E','F','G','A','B','C2'];const freq={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,B:493.88,C2:523.25};function lang(){return localStorage.getItem('seanGameLang')||'en'}function T(en,es){return lang()==='es'?es:en}function tx(v){return Array.isArray(v)?T(v[0],v[1]):v}const copy={title:['🎹 Piano Patterns','🎹 Patrones de Piano'],sub:['Watch. Repeat. Learn the pattern.','Mira. Repite. Aprende el patrón.'],manualTitle:['📘 How to Play','📘 Cómo jugar'],manual:[['Choose a piano pattern.','Elige un patrón de piano.'],['The guide starts automatically on each new pattern.','La guía empieza automáticamente en cada patrón nuevo.'],['Tap Guide to hear and see the notes again.','Toca Guía para oír y ver las notas otra vez.'],['Repeat the notes in the same order.','Repite las notas en el mismo orden.'],['Master all patterns to earn a badge.','Domina todos los patrones para ganar un badge.']],go:['Let’s go!','¡Vamos!'],how:['📘 How','📘 Cómo'],play:['▶️ Guide','▶️ Guía'],new:['🔁 New','🔁 Nuevo'],right:['Nice!','¡Bien!'],miss:['Try again','Intenta otra vez'],earned:['You earned ','Ganaste '],done:['Pattern mastered!','¡Patrón dominado!'],empty:['The guide will start automatically. Tap Guide to replay it.','La guía empezará automáticamente. Toca Guía para repetirla.'],keys:['🎹 Piano lessons unlocked:','🎹 Lecciones de piano desbloqueadas:']};let songs=[{name:['Morning Steps','Pasos de Mañana'],emoji:'🌅',seq:['C','D','E','C'],teach:['Notes can walk upward, then return home.','Las notas pueden subir caminando y volver a casa.']},{name:['Three Note Call','Llamado de Tres Notas'],emoji:'🔔',seq:['G','E','C'],teach:['Big note jumps sound bold and easy to remember.','Los saltos grandes suenan fuertes y fáciles de recordar.']},{name:['Happy Climb','Subida Feliz'],emoji:'🌈',seq:['C','E','G','C2'],teach:['C, E and G sound stable together.','C, E y G suenan estables juntos.']},{name:['Moon Walk','Camino Lunar'],emoji:'🌙',seq:['A','F','E','D'],teach:['Going downward can feel calm or emotional.','Bajar puede sentirse calmado o emocional.']},{name:['Victory Loop','Loop de Victoria'],emoji:'🏆',seq:['C','D','E','G','E','C'],teach:['Repeating a shape helps the brain remember music.','Repetir una forma ayuda al cerebro a recordar música.']}];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(songs);function soundNote(n,d=360){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq[n];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.28,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d/1000);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d/1000+.02)}function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function baseUi(){lastLang=lang();$('gameTitle').textContent=tx(copy.title);$('sub').textContent=tx(copy.sub);$('manualTitle').textContent=tx(copy.manualTitle);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+tx(x)+'</li>').join('');$('closeManual').textContent=tx(copy.go);$('manualBtn').textContent=tx(copy.how);$('playBtn').textContent=tx(copy.play);$('restartBtn').textContent=tx(copy.new);document.documentElement.lang=lang()}function popup(t){let p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){let arr=['🎹','🎵','⭐','✨','🏆'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=arr[Math.floor(Math.random()*arr.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function queueAutoGuide(){clearTimeout(autoGuideTimer);autoGuideTimer=setTimeout(()=>playPattern(true),700)}function render(){playToken++;clearTimeout(autoGuideTimer);baseUi();let s=songs[current];$('songNum').textContent=current+1;$('level').textContent=Math.min(5,current+1);$('score').textContent=score;$('streak').textContent=streak;$('bar').style.width=(score/songs.length*100)+'%';$('songTitle').textContent=s.emoji+' '+tx(s.name);$('teaching').textContent=tx(copy.empty);$('pattern').innerHTML=s.seq.map((n,i)=>'<div class="noteBubble" id="nb'+i+'">'+n.replace('2','')+'</div>').join('');$('piano').innerHTML='';notes.forEach(n=>{let b=document.createElement('button');b.className='key';b.textContent=n.replace('2','');b.onclick=()=>press(n,b);$('piano').appendChild(b)});$('patterns').innerHTML='';songs.forEach((song,i)=>{let b=document.createElement('button');b.className='pick '+(i===current?'active':'');b.textContent=song.emoji+' '+tx(song.name);b.onclick=()=>{current=i;step=0;render()};$('patterns').appendChild(b)});$('reward').style.display='none';queueAutoGuide()}async function playPattern(auto=false){clearTimeout(autoGuideTimer);let token=++playToken;let s=songs[current];step=0;$('teaching').textContent=tx(s.teach);speak((auto?T('Watch this pattern. Then repeat the notes in order. ','Mira este patrón. Luego repite las notas en orden. '):'')+tx(s.name)+'. '+tx(s.teach));for(let i=0;i<s.seq.length;i++){if(token!==playToken)return;document.querySelectorAll('.noteBubble').forEach(x=>x.classList.remove('on'));let note=s.seq[i];let bubble=$('nb'+i);if(bubble)bubble.classList.add('on');let key=[...document.querySelectorAll('.key')].find(k=>k.textContent===note.replace('2',''));if(key)key.classList.add('active');soundNote(note);await new Promise(r=>setTimeout(r,520));if(token!==playToken)return;if(key)key.classList.remove('active')}if(token===playToken)document.querySelectorAll('.noteBubble').forEach(x=>x.classList.remove('on'))}function press(n,b){clearTimeout(autoGuideTimer);soundNote(n);b.classList.add('active');setTimeout(()=>b.classList.remove('active'),160);let s=songs[current];if(n===s.seq[step]){let bubble=$('nb'+step);if(bubble)bubble.classList.add('on');step++;if(step>=s.seq.length){score=Math.max(score,current+1);streak++;sound('ding');popup(tx(copy.done));confetti();$('teaching').textContent='🧠 '+tx(s.teach);speak(tx(copy.done)+'. '+tx(s.teach));setTimeout(()=>{if(current<songs.length-1){current++;step=0;render()}else end()},1050)}}else{step=0;streak=0;sound('wrong');popup(tx(copy.miss));document.querySelectorAll('.noteBubble').forEach(x=>x.classList.remove('on'));$('teaching').textContent=T('Listen again, then replay from the first note.','Escucha otra vez y repite desde la primera nota.')}}function end(){clearTimeout(autoGuideTimer);let badge=T('🏆 Piano Memory','🏆 Memoria Piano');if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');$('bar').style.width='100%';$('songTitle').textContent=T('🏆 All patterns mastered','🏆 Todos los patrones dominados');$('teaching').textContent=tx(copy.earned)+badge+'.';$('reward').style.display='block';$('reward').innerHTML='<div>'+tx(copy.keys)+'</div>'+songs.map(s=>'<div>🎵 <b>'+tx(s.name)+'</b><br>'+tx(s.teach)+'</div>').join('<hr>')+'<div>'+badges.join(' ')+'</div>';popup(tx(copy.earned)+badge);confetti(36);speak(tx(copy.earned)+badge)}function reset(){current=0;step=0;score=0;streak=0;shuffle(songs);render()}$('manualBtn').onclick=()=>{$('modal').classList.add('show');speak(T('Choose a pattern. The guide will start by itself. Then repeat the notes.','Elige un patrón. La guía empieza sola. Luego repite las notas.'))};$('closeManual').onclick=()=>$('modal').classList.remove('show');$('playBtn').onclick=()=>playPattern(false);$('restartBtn').onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script></body></html>
