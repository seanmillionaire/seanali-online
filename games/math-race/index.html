e: '],next:['Next unlock: 10 stars for the Rainbow Car.','Próximo desbloqueo: 10 estrellas para el Carro Arcoíris.'],play:['Play','Jugar'],again:['Again','Otra vez']};function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function baseUi(){lastLang=lang();$('title').textContent=T(...copy.title);$('sub').textContent=T(...copy.sub);$('level1').textContent=T(...copy.level1);$('level2').textContent=T(...copy.level2);$('manualTitle').textContent=T(...copy.manualTitle);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+T(...x)+'</li>').join('');$('closeManual').textContent=T(...copy.go);$('manualBtn').textContent=T(...copy.how);$('voiceBtn').textContent=voiceOn?T(...copy.voice):T(...copy.muted);$('restartBtn').textContent=T(...copy.new);document.documentElement.lang=lang()}function level(){return round<=6?1:2}function hud(){baseUi();$('round').textContent=Math.min(round,total);$('score').textContent=score;$('streak').textContent=streak;$('hearts').textContent=hearts;$('bar').style.width=((round-1)/total*100)+'%';$('level1').classList.toggle('active',level()===1);$('level2').classList.toggle('active',level()===2);let m=$('map');m.innerHTML='';for(let i=1;i<=total;i++){let d=document.createElement('div');d.className='dot '+(i<round?'on':'');d.textContent=i<round?'⭐':'';m.appendChild(d)}}function wrongNear(ans){let wrong=ans+(Math.random()<.5?1:-1)*(Math.floor(Math.random()*6)+1);if(wrong<0||wrong===ans)wrong=ans+4;return wrong}function visual(groups,each,mode='normal'){current.groups=groups;current.each=each;current.mode=mode;let label=mode==='missing'?T(...copy.hide):groups+T(...copy.groups)+each+' = ?';$('drawTitle').textContent=T(...copy.draw)+' · '+label;let box=$('groups');box.innerHTML='';let maxDots=Math.min(each,10);for(let g=0;g<groups;g++){let grp=document.createElement('div');grp.className='grp';for(let i=0;i<maxDots;i++){let mark=document.cr
