rrent.a+' × '+current.b+' = '+current.ans}else{streak=0;bad();pop('Casi 😄');msg.textContent='La respuesta era '+current.ans}setTimeout(()=>{round++;if(round>total)end();else makeQ()},1050)}function end(){let grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C';q.textContent='Nota '+grade;car.textContent=score>=7?'🏆':'🚗';msg.textContent=score+'/'+total+' correctas. '+(score>=7?'¡Súper carrera!':'Otra vuelta y mejoras.');leftBtn.textContent='Jugar';rightBtn.textContent='Otra vez';leftBtn.onclick=reset;rightBtn.onclick=reset;pop('Nota '+grade);confetti(28)}function reset(){score=0;streak=0;round=1;car.textContent='🏎️';leftBtn.onclick=()=>choose('left');rightBtn.onclick=()=>choose('right');makeQ()}function pop(t){popupEl.textContent=t;popupEl.classList.remove('show');void popupEl.offsetWidth;popupEl.classList.add('show')}function confetti(n=14){const p=['⭐','🏁','✨','🚗','🌈'];for(let i=0;i<n;i++){const el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.2+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}leftBtn.onclick=()=>choose('left');rightBtn.onclick=()=>choose('right');document.getElementById('restartBtn').onclick=reset;document.getElementById('soundBtn').onclick=()=>{soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 Sonido':'🔇 Silencio'};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose('left');if(e.key==='ArrowRight')choose('right')});makeQ();</script></body></html>
