ate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@keyframes float{0%{transform:translateX(-20px)}50%{transform:translateX(20px)}100%{transform:translateX(-20px)}}@media(max-width:390px){h1{font-size:28px}.question{font-size:30px}.road{min-height:330px}.car{font-size:76px}.choice{font-size:31px;min-height:86px}.pill{font-size:14px}.controls{gap:7px}.small{font-size:15px}.manual ol{font-size:20px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2>📘 Cómo jugar</h2><ol><li>Lee la multiplicación.</li><li>Toca el número correcto.</li><li>Cuida tus corazones.</li><li>Llena la barra de XP.</li><li>Abre el garaje al final.</li></ol><button id="closeManual">¡Vamos!</button></div></div><main class="game"><section class="top"><h1>🚗 Carrera de Multiplicación</h1><p class="sub">Gana XP y desbloquea carros</p></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">🏆 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></div></div><div class="map" id="map"></div><section class="road"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="question" id="question">2 × 3</div><div class="car" id="car">🏎️</div></section><section class="signs"><button class="choice leftBtn" id="leftBtn">6</button><button class="choice rightBtn" id="rightBtn">8</button></section><div class="msg" id="msg">Toca el número correcto.</div><div class="garage" id="garage"></div><section class="controls"><button class="small" id="manualBtn">📘 Cómo</button><button class="small" id="voiceBtn">🔊 Voz</button><button class="small" id="restartBtn">🔁 Nuevo</button></section></main><div class="popup" id="popup">¡Sí!</div><script>let ctx,score=0,streak=0,round=1,hearts=3,current=null,voiceOn=true,soundOn=true;const total=10;const q=document.getElementById('question'),car=document.getElementById('car'),leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn'),msg=document.getElementById('msg'),popupEl=document.getElementById('popup'),garage=document.getElementById('garage');const key='mathRaceGarage';let cars=JSON.parse(localStorage.getItem(key)||'[]');function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.9;u.pitch=1.12;speechSynthesis.speak(u)}function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(f,d,type='sine',v=.2){if(!soundOn)return;audio();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.03)}function good(){tone(520,.12,'triangle',.25);setTimeout(()=>tone(780,.14,'triangle',.22),90)}function bad(){tone(160,.2,'sawtooth',.18);setTimeout(()=>tone(120,.22,'sawtooth',.14),110)}function map(){const m=document.getElementById('map');m.innerHTML='';for(let i=1;i<=total;i++){const d=document.createElement('div');d.className='dot '+(i<round?'on':'');d.textContent=i<round?'⭐':'';m.appendChild(d)}}function hud(){document.getElementById('round').textContent=Math.min(round,total);document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('hearts').textContent=hearts;document.getElementById('bar').style.width=((round-1)/total*100)+'%';map()}function makeQ(){hud();garage.style.display='none';let max=round<4?5:round<8?8:10;const a=Math.floor(Math.random()*max)+2,b=Math.floor(Math.random()*max)+2,ans=a*b;let wrong=ans+(Math.random()<.5?1:-1)*(Math.floor(Math.random()*6)+1);if(wrong<0||wrong===ans)wrong=ans+4;const side=Math.random()<.5?'left':'right';current={a,b,ans,side,wrong};q.textContent=a+' × '+b;leftBtn.textContent=side==='left'?ans:wrong;rightBtn.textContent=side==='right'?ans:wrong;leftBtn.onclick=()=>choose('left');rightBtn.onclick=()=>choose('right');car.className='car';car.textContent='🏎️';msg.textContent='Maneja al resultado correcto.';speak('¿Cuánto es '+a+' por '+b+'?')}function choose(side){if(round>total||hearts<=0)return;const right=side===current.side;car.className='car '+side;(side==='left'?leftBtn:rightBtn).classList.add('hit');setTimeout(()=>{leftBtn.classList.remove('hit');rightBtn.classList.remove('hit')},170);if(right){score++;streak++;good();pop('¡Correcto! ⭐');confetti();msg.textContent='¡Sí! '+current.a+' × '+current.b+' = '+current.ans;speak('Correcto. Ganaste una estrella.')}else{streak=0;hearts--;bad();pop('Casi 😄');msg.textContent='Era '+current.ans+'. Te quedan '+hearts+' corazones.';speak('Casi. La respuesta era '+current.ans+'.')}setTimeout(()=>{round++;if(round>total||hearts<=0)end();else makeQ()},1150)}function prize(){if(score>=9)return'🏎️ Carro Arcoíris';if(score>=7)return'🚙 Turbo Azul';if(score>=5)return'🚕 Taxi Dorado';return'⭐ Llanta de Práctica'}function end(){document.getElementById('bar').style.width='100%';map();let grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C',p=prize();if(!cars.includes(p)){cars.push(p);localStorage.setItem(key,JSON.stringify(cars))}q.textContent='Garaje: '+grade;car.className='car';car.textContent=score>=7?'🏆':'🚗';msg.textContent=score+'/'+total+' correctas. Desbloqueaste '+p+'.';garage.style.display='block';garage.innerHTML='Premio nuevo: '+p+'<br/>Tu garaje: '+cars.join(' ')+'<br/>Próximo desbloqueo: 9 estrellas para el Carro Arcoíris.';leftBtn.textContent='Jugar';rightBtn.textContent='Otra vez';leftBtn.onclick=reset;rightBtn.onclick=reset;pop('¡Desbloqueado!');confetti(34);speak('Carrera terminada. Tu nota es '+grade+'. Desbloqueaste '+p+'. Juega otra vez para llenar tu garaje.')}function reset(){score=0;streak=0;round=1;hearts=3;makeQ()}function pop(t){popupEl.textContent=t;popupEl.classList.remove('show');void popupEl.offsetWidth;popupEl.classList.add('show')}function confetti(n=14){const p=['⭐','🏁','✨','🚗','🌈','🏆'];for(let i=0;i<n;i++){const el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.2+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}document.getElementById('manualBtn').onclick=()=>{document.getElementById('modal').classList.add('show');speak('Cómo jugar. Lee la multiplicación. Toca el número correcto. Cuida tus corazones. Llena la barra. Abre el garaje al final.')};document.getElementById('closeManual').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('voiceBtn').onclick=()=>{voiceOn=!voiceOn;document.getElementById('voiceBtn').textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(voiceOn)speak('Voz activada')};document.getElementById('restartBtn').onclick=reset;window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose('left');if(e.key==='ArrowRight')choose('right')});makeQ();</script></body></html>
