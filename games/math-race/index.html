<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Carrera de Multiplicación | Juego de Matemáticas</title><meta name="description" content="Juego móvil educativo de multiplicación en español con carro, voz guía, XP, corazones, racha, garaje de premios y sonidos."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/math-race/"><meta property="og:title" content="Carrera de Multiplicación"><meta property="og:description" content="Practica multiplicación manejando el carro al resultado correcto y desbloqueando premios."><meta property="og:type" content="website"><meta property="og:url" content="https://seanali.online/games/math-race/"><meta name="theme-color" content="#ffcf33"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#8ee7ff,#fffaaf 58%,#94e77f);color:#18210b;padding:12px;-webkit-tap-highlight-color:transparent;user-select:none}.game{max-width:590px;margin:0 auto;background:#fff8d8;border:5px solid #252525;border-radius:30px;overflow:hidden;box-shadow:0 18px 0 rgba(0,0,0,.18)}.top{background:linear-gradient(135deg,#ffcf33,#ff7a18);padding:16px;text-align:center;border-bottom:5px solid #252525}h1{margin:0;font-size:33px;line-height:1}.sub{margin-top:8px;font-size:18px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#fff2aa;border-bottom:4px solid #252525}.pill{background:#fff;border:3px solid #252525;border-radius:16px;padding:8px 4px;text-align:center;font-size:16px;font-weight:900}.xp{height:18px;background:#fff;border:3px solid #252525;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#30d158,#00c7ff,#ffcf33);transition:width .35s}.map{display:flex;justify-content:center;gap:5px;padding:0 8px 8px}.dot{width:23px;height:23px;border-radius:50%;background:#fff;border:3px solid #252525;font-size:12px;display:flex;align-items:center;justify-content:center}.dot.on{background:#ffcf33}.road{position:relative;min-height:355px;background:linear-gradient(90deg,#52bd59 0 13%,#333 13% 87%,#52bd59 87%);overflow:hidden}.road:before{content:'';position:absolute;left:49%;top:0;width:10px;height:100%;background:repeating-linear-gradient(180deg,#fff 0 34px,transparent 34px 62px)}.question{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;background:#fff;border:4px solid #252525;border-radius:24px;padding:14px 18px;font-size:35px;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.25);min-width:210px;text-align:center}.car{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:88px;z-index:3;transition:left .18s,transform .18s;filter:drop-shadow(0 8px 0 rgba(0,0,0,.23))}.car.left{left:27%;transform:translateX(-50%) rotate(-5deg)}.car.right{left:73%;transform:translateX(-50%) rotate(5deg)}.signs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;background:#fff8d8;border-top:5px solid #252525}.choice{border:0;border-radius:24px;padding:22px 10px;font-size:36px;font-weight:900;min-height:96px;color:#18210b;box-shadow:0 8px 0 #252525;cursor:pointer}.choice:active,.choice.hit{transform:translateY(7px);box-shadow:0 1px 0 #252525}.leftBtn{background:#80d8ff}.rightBtn{background:#ffdc5e}.msg{padding:0 16px 13px;text-align:center;font-size:21px;font-weight:900;min-height:40px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}.small{border:0;border-radius:18px;padding:14px 8px;font-size:17px;font-weight:900;background:#dfffe2;box-shadow:0 6px 0 #2f8c3d;cursor:pointer;min-height:54px}.garage{background:#fff;border:4px solid #252525;border-radius:20px;padding:12px;margin:0 16px 14px;text-align:center;font-size:19px;font-weight:900;display:none}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #252525;border-radius:28px;padding:22px 28px;font-size:34px;font-weight:900;z-index:30;opacity:0;pointer-events:none}.popup.show{animation:pop .85s forwards}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fff8d8;border:5px solid #252525;border-radius:28px;max-width:480px;width:100%;padding:20px;text-align:center}.manual ol{text-align:left;font-size:22px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#80d8ff;box-shadow:0 7px 0 #252525;width:100%}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:390px){h1{font-size:28px}.question{font-size:30px}.road{min-height:330px}.car{font-size:76px}.choice{font-size:31px;min-height:86px}.pill{font-size:14px}.small{font-size:15px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2>📘 Cómo jugar</h2><ol><li>Lee la multiplicación.</li><li>Toca el número correcto.</li><li>Cuida tus corazones.</li><li>Llena la barra de XP.</li><li>Abre el garaje al final.</li></ol><button id="closeManual">¡Vamos!</button></div></div><main class="game"><section class="top"><h1>🚗 Carrera de Multiplicación</h1><div class="sub">Gana XP y desbloquea carros</div></section><section class="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">🏆 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></div></div><div class="map" id="map"></div><section class="road"><div class="question" id="question">2 × 3</div><div class="car" id="car">🏎️</div></section><section class="signs"><button class="choice leftBtn" id="leftBtn">6</button><button class="choice rightBtn" id="rightBtn">8</button></section><div class="msg" id="msg">Toca el número correcto.</div><div class="garage" id="garage"></div><section class="controls"><button class="small" id="manualBtn">📘 Cómo</button><button class="small" id="voiceBtn">🔊 Voz</button><button class="small" id="restartBtn">🔁 Nuevo</button></section></main><div class="popup" id="popup">¡Sí!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,streak=0,round=1,hearts=3,current=null,voiceOn=true;const total=10,key='mathRaceGarage';let cars=JSON.parse(localStorage.getItem(key)||'[]');function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function map(){let m=document.getElementById('map');m.innerHTML='';for(let i=1;i<=total;i++){let d=document.createElement('div');d.className='dot '+(i<round?'on':'');d.textContent=i<round?'⭐':'';m.appendChild(d)}}function hud(){document.getElementById('round').textContent=Math.min(round,total);document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('hearts').textContent=hearts;document.getElementById('bar').style.width=((round-1)/total*100)+'%';map()}function makeQ(){hud();garage.style.display='none';let max=round<4?5:round<8?8:10;const a=Math.floor(Math.random()*max)+2,b=Math.floor(Math.random()*max)+2,ans=a*b;let wrong=ans+(Math.random()<.5?1:-1)*(Math.floor(Math.random()*6)+1);if(wrong<0||wrong===ans)wrong=ans+4;const side=Math.random()<.5?'left':'right';current={a,b,ans,side,wrong};question.textContent=a+' × '+b;leftBtn.textContent=side==='left'?ans:wrong;rightBtn.textContent=side==='right'?ans:wrong;leftBtn.onclick=()=>choose('left');rightBtn.onclick=()=>choose('right');car.className='car';car.textContent='🏎️';msg.textContent='Maneja al resultado correcto.';speak('¿Cuánto es '+a+' por '+b+'?')}function choose(side){if(round>total||hearts<=0)return;const right=side===current.side;car.className='car '+side;(side==='left'?leftBtn:rightBtn).classList.add('hit');setTimeout(()=>{leftBtn.classList.remove('hit');rightBtn.classList.remove('hit')},170);if(right){score++;streak++;sound('ding');pop('¡Correcto! ⭐');confetti();msg.textContent='¡Sí! '+current.a+' × '+current.b+' = '+current.ans;speak('Correcto. Ganaste una estrella.')}else{streak=0;hearts--;sound('wrong');pop('Casi 😄');msg.textContent='Era '+current.ans+'. Te quedan '+hearts+' corazones.';speak('Casi. La respuesta era '+current.ans+'.')}setTimeout(()=>{round++;if(round>total||hearts<=0)end();else makeQ()},1050)}function prize(){if(score>=9)return'🏎️ Carro Arcoíris';if(score>=7)return'🚙 Turbo Azul';if(score>=5)return'🚕 Taxi Dorado';return'⭐ Llanta de Práctica'}function end(){bar.style.width='100%';map();let grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C',p=prize();if(!cars.includes(p)){cars.push(p);localStorage.setItem(key,JSON.stringify(cars))}sound('money');question.textContent='Garaje: '+grade;car.className='car';car.textContent=score>=7?'🏆':'🚗';msg.textContent=score+'/'+total+' correctas. Desbloqueaste '+p+'.';garage.style.display='block';garage.innerHTML='Premio nuevo: '+p+'<br>Tu garaje: '+cars.join(' ')+'<br>Próximo desbloqueo: 9 estrellas para el Carro Arcoíris.';leftBtn.textContent='Jugar';rightBtn.textContent='Otra vez';leftBtn.onclick=reset;rightBtn.onclick=reset;pop('¡Desbloqueado!');confetti(34);speak('Carrera terminada. Tu nota es '+grade+'. Desbloqueaste '+p+'.')}function reset(){score=0;streak=0;round=1;hearts=3;makeQ()}function pop(t){let p=document.getElementById('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){let p=['⭐','🏁','✨','🚗','🌈','🏆'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}manualBtn.onclick=()=>{modal.classList.add('show');speak('Lee la multiplicación. Toca el número correcto. Cuida tus corazones. Abre el garaje al final.')};closeManual.onclick=()=>modal.classList.remove('show');voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};restartBtn.onclick=reset;makeQ();</script></body></html>
