:900;line-height:1.25}.affirm{background:#f1ffe8;border:3px solid #bde7bf;border-radius:16px;padding:10px;margin:8px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fffbe8;border:5px solid #106a38;border-radius:28px;max-width:500px;width:100%;padding:20px;text-align:center}.manual h2{margin:0 0 10px;font-size:30px}.manual ol{text-align:left;font-size:21px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#ffd84d;box-shadow:0 7px 0 #bd8610;width:100%}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #106a38;border-radius:28px;padding:22px 28px;font-size:33px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(min-width:520px){.choices{grid-template-columns:1fr 1fr}.choice:nth-child(3){grid-column:1/-1}}@media(max-width:390px){h1{font-size:36px}.emoji{font-size:76px}.question{font-size:25px}.choice{font-size:18px}.pill{font-size:14px}.small{font-size:14px}}</style></head><body><main class="game"><section class="top"><h1>💰 Money</h1><div class="sub" id="sub">Aprende dinero paso a paso</div></section><section class="hud"><div class="pill">🪙 <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">❤️ <span id="hearts">3</span></div><div class="pill">🏆 <span id="round">1</span>/10</div></section><div class="xp"><div class="bar" id="bar"></d oney Wisdom!','Money Wisdom!'],try:['Buen intento','Good try'],grade:['Nota ','Grade ']};let cards=[{e:'🐷',t:['Ahorro','Saving'],q:['Recibes dinero. ¿Qué haces primero?','You get money. What do you do first?'],a:['Guardar una parte','Save a part'],bad:[['Gastar todo','Spend it all'],['Olvidarlo','Forget it']],tip:['Guardar un poco ayuda a tu futuro.','Saving a little helps your future.'],aff:['Yo ahorro paso a paso.','I save step by step.']},{e:'🛒',t:['Elegir','Choosing'],q:['Quieres comprar algo. ¿Qué pregunta ayuda?','You want to buy something. Which question helps?'],a:['¿Lo necesito?','Do I need it?'],bad:[['¿Brilla mucho?','Is it very shiny?'],['¿Es lo primero que vi?','Is it the first thing I saw?']],tip:['Pensar primero es una buena decisión.','Thinking first is a good choice.'],aff:['Yo puedo elegir bien.','I can choose well.']},{e:'💪',t:['Valor','Value'],q:['¿Cómo puedes ganar más con el tiempo?','How can you earn more over time?'],a:['Aprendiendo habilidades','Learning skills'],bad:[['Esperando sin hacer nada','Waiting and doing nothing'],['Quejándome','Complaining']],tip:['Las habilidades te ayudan a crear valor.','Skills help you create value.'],aff:['Mis habilidades crecen.','My skills grow.']},{e:'🎯',t:['Meta','Goal'],q:['¿Para qué sirve una meta de dinero?','What is a money goal for?'],a:['Para saber hacia dónde voy','To know where I am going'],bad:[['Para confundirme','To get confused'],['Para rendirme','To give up']],tip:['Una meta clara te da dirección.','A clear goal gives you direction.'],aff:['Yo puedo tener metas claras.','I can have clear goals.']},{e:'🧠',t:['Mente','Mind'],q:['Si algo es difícil, ¿qué puedes decir?','If something is hard, what can you say?'],a:['Estoy aprendiendo','I am learning'],bad:[['No puedo nunca','I can never do it'],['Me rindo hoy','I give up today']],tip:['Aprender toma práctica.','Learning takes practice.'],aff:['Cada día aprendo más.','Every day I learn more.']},{e:'🤝',t:['Compartir','Sharing'],q:['Dar con amor significa...','Giving with love means...'],a:['Compartir algo bueno','Share something good'],bad:[['Quedarme sin nada','Have nothing left'],['Hacerlo con enojo','Do it with anger']],tip:['Compartir con alegría fortalece el corazón.','Sharing with joy makes the heart strong.'],aff:['Comparto con alegría.','I share with joy.']},{e:'🧺',t:['Plan','Plan'],q:['Antes de gastar, una buena idea es...','Before spending, a good idea is...'],a:['Hacer un plan pequeño','Make a small plan'],bad:[['Comprar rápido','Buy fast'],['No mirar el precio','Ignore the price']],tip:['Un pequeño plan evita errores.','A small plan prevents mistakes.'],aff:['Yo planeo con calma.','I plan calmly.']},{e:'🌱',t:['Crecer','Growing'],q:['El dinero puede crecer cuando...','Money can grow when...'],a:['Lo cuido y aprendo','I care for it and learn'],bad:[['Lo pierdo','I lose it'],['Lo trato como juego tonto','I treat it like a silly game']],tip:['Cuidar el dinero es una habilidad.','Taking care of money is a skill.'],aff:['Yo cuido mi dinero.','I care for my money.']},{e:'🧲',t:['Actitud','Attitude'],q:['Una buena actitud con dinero es...','A good money attitude is...'],a:['Gratitud y práctica','Gratitude and practice'],bad:[['Miedo todo el día','Fear all day'],['Culpar siempre','Always blaming']],tip:['La gratitud calma tu mente.','Gratitude calms your mind.'],aff:['Gracias por lo que tengo.','Thank you for what I have.']},{e:'🌈',t:['Uso','Use'],q:['El dinero es una herramienta. ¿Cómo lo usas bien?','Money is a tool. How do you use it well?'],a:['Para bien y libertad','For good and freedom'],bad:[['Para presumir','To show off'],['Para pelear','To fight']],tip:['El dinero funciona mejor con sabiduría.','Money works better with wisdom.'],aff:['Uso el dinero para bien.','I use money for good.']},{e:'📈',t:['Invertir','Investing'],q:['¿Qué significa invertir en una habilidad?','What does investing in a skill mean?'],a:['Practicar para ganar más valor','Practice to create more value'],bad:[['Comprar dulces rápido','Buy candy fast'],['Esperar suerte','Wait for luck']],tip:['Una habilidad puede pagarte muchas veces.','A skill can pay you many times.'],aff:['Mis habilidades pueden crear dinero.','My skills can create money.']},{e:'🧾',t:['Precio','Price'],q:['Antes de comprar, ¿qué debes revisar?','Before buying, what should you check?'],a:['El precio y si vale la pena','The price and if it is worth it'],bad:[['Solo el color','Only the color'],['Si alguien más lo tiene','If someone else has it']],tip:['Mirar el precio te ayuda a elegir mejor.','Checking price helps you choose better.'],aff:['Yo pienso antes de gastar.','I think before I spend.']},{e:'💼',t:['Trabajo','Work'],q:['¿Por qué las personas pagan por un servicio?','Why do people pay for a service?'],a:['Porque resuelve un problema','Because it solves a problem'],bad:[['Porque suena divertido','Because it sounds fun'],['Porque nadie lo necesita','Because nobody needs it']],tip:['El dinero sigue al valor útil.','Money follows useful value.'],aff:['Yo puedo resolver problemas útiles.','I can solve useful problems.']},{e:'🏦',t:['Banco','Bank'],q:['¿Para qué sirve guardar dinero en un lugar seguro?','Why keep money in a safe place?'],a:['Para protegerlo y verlo crecer','To protect it and watch it grow'],bad:[['Para olvidarlo','To forget it'],['Para esconder errores','To hide mistakes']],tip:['Un lugar seguro ayuda a cuidar tu progreso.','A safe place helps protect your progress.'],aff:['Yo protejo mi progreso.','I protect my progress.']},{e:'🧮',t:['Presupuesto','Budget'],q:['Si tienes $10, ¿qué hace un presupuesto?','If you have $10, what does a budget do?'],a:['Decide antes a dónde va','Decides where it goes first'],bad:[['Lo duplica por magia','Doubles it by magic'],['Lo gasta todo','Spends it all']],tip:['Un presupuesto le da trabajo a cada dólar.','A budget gives every dollar a job.'],aff:['Yo le doy dirección a mi dinero.','I give my money direction.']},{e:'🧲',t:['Oferta','Offer'],q:['¿Qué hace que algo sea una buena oferta?','What makes something a good offer?'],a:['Ayuda clara por un precio justo','Clear help for a fair price'],bad:[['Palabras grandes','Big words'],['Una caja brillante','A shiny box']],tip:['La claridad hace que comprar sea más fácil.','Clarity makes buying easier.'],aff:['Yo entiendo el valor claro.','I understand clear value.']},{e:'📚',t:['Aprender','Learning'],q:['¿Qué pasa cuando aprendes una habilidad útil?','What happens when you learn a useful skill?'],a:['Puedes crear más opciones','You can create more options'],bad:[['Tienes menos opciones','You have fewer options'],['Nunca necesitas practicar','You never need practice']],tip:['Las habilidades abren puertas.','Skills open doors.'],aff:['Cada habilidad me da más opciones.','Each skill gives me more options.']},{e:'🪙',t:['Monedas','Coins'],q:['Si ahorras 1 moneda cada día, ¿qué estás construyendo?','If you save 1 coin every day, what are you building?'],a:['Un hábito','A habit'],bad:[['Un problema','A problem'],['Una excusa','An excuse']],tip:['Los hábitos pequeños se vuelven grandes.','Small habits become big.'],aff:['Mis pequeños hábitos cuentan.','My small habits count.']},{e:'🚦',t:['Decisión','Decision'],q:['Cuando quieres comprar por emoción, ¿qué ayuda?','When you want to buy from emotion, what helps?'],a:['Esperar y pensar','Wait and think'],bad:[['Comprar más rápido','Buy faster'],['No mirar nada','Look at nothing']],tip:['Pausar protege tu dinero.','Pausing protects your money.'],aff:['Yo puedo pausar antes de gastar.','I can pause before spending.']},{e:'🌉',t:['Futuro','Future'],q:['¿Por qué guardar dinero para después importa?','Why does saving for later matter?'],a:['Te da más libertad','It gives you more freedom'],bad:[['Te quita todo','It takes everything'],['No cambia nada','It changes nothing']],tip:['Opciones guardadas se sienten como libertad.','Stored options feel like freedom.'],aff:['Estoy construyendo libertad paso a paso.','I am building freedom step by step.']}];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(cards);function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function popup(t){let p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){let arr=['🪙','💰','⭐','✨','🌈','🏆'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=arr[Math.floor(Math.random()*arr.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function baseUi(){lastLang=lang();$('sub').textContent=T(copy.sub[0],copy.sub[1]);$('manualTitle').textContent=T(copy.manualTitle[0],copy.manualTitle[1]);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+T(x[0],x[1])+'</li>').join('');$('closeManual').textContent=T(copy.go[0],copy.go[1]);$('manualBtn').textContent=T(copy.how[0],copy.how[1]);$('voiceBtn').textContent=voiceOn?T(copy.voice[0],copy.voice[1]):T(copy.muted[0],copy.muted[1]);$('restartBtn').textContent=T(copy.new[0],copy.new[1]);document.documentElement.lang=lang()}function hud(){$('score').textContent=scoreVal;$('streak').textContent=streakVal;$('hearts').textContent=heartsVal;$('round').textContent=Math.min(roundVal+1,total);$('bar').style.width=(roundVal/total*100)+'%';$('vault').innerHTML='';for(let i=0;i<total;i++){let d=document.createElement('div');d.className='coin '+(i<roundVal?'on':'');d.textContent=i<roundVal?'🪙':'';$('vault').appendChild(d)}}function choicesFor(c){return [c.a,...c.bad].sort(()=>Math.random()-.5)}function render(){baseUi();if(roundVal>=total||heartsVal<=0)return end();hud();current=cards[roundVal];$('emoji').textContent=current.e;$('topic').textContent=tx(current.t);$('question').textContent=tx(current.q);$('msg').textContent=T(copy.tap[0],copy.tap[1]);$('reward').style.display='none';$('choices').innerHTML='';choicesFor(current).forEach(o=>{let right=tx(o)===tx(current.a);let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">💬</span><span>'+tx(o)+'</span>';b.onclick=()=>answer(o,b);$('choices').appendChild(b)});speak(tx(current.q))}function answer(o,b){b.classList.add('hit');let right=tx(o)===tx(current.a);if(right){scoreVal++;streakVal++;sound('ding');popup(T(copy.correct[0],copy.correct[1]));confetti();$('msg').textContent=tx(current.tip)+' 💬 '+tx(current.aff);speak(T('Correcto. ','Correct. ')+tx(current.tip)+'. '+tx(current.aff))}else{streakVal=0;heartsVal--;sound('wrong');popup(T(copy.oops[0],copy.oops[1]));$('msg').textContent=T(copy.better[0],copy.better[1])+tx(current.a)+'. '+tx(current.tip);speak(T('Casi. Mejor idea: ','Almost. Better idea: ')+tx(current.a)+'. '+tx(current.tip))}setTimeout(()=>{roundVal++;render()},1400)}function end(){baseUi();$('bar').style.width='100%';let pass=scoreVal>=7,grade=scoreVal>=9?'A+':scoreVal>=7?'A':scoreVal>=5?'B':'C',badge=pass?'🏆 Money Wisdom':'🌱 Money Learner';if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');$('emoji').textContent=pass?'🏆':'🌱';$('topic').textContent=pass?T('Pasaste','You passed'):T('Sigue aprendiendo','Keep learning');$('question').textContent=(pass?T(copy.passed[0],copy.passed[1]):T(copy.try[0],copy.try[1]))+' · '+T(copy.grade[0],copy.grade[1])+grade;$('msg').textContent=scoreVal+'/'+total+' '+T('correctas. Ganaste ','correct. You earned ')+badge+'.';$('choices').innerHTML='';[[copy.again,reset,'🔁'],[copy.seeAff,showAffirmations,'💬']].forEach(x=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span class="choiceIcon">'+x[2]+'</span><span>'+T(x[0][0],x[0][1])+'</span>';b.onclick=x[1];$('choices').appendChild(b)});showAffirmations();popup(pass?T(copy.passed[0],copy.passed[1]):T(copy.try[0],copy.try[1]));confetti(pass?36:16);speak(T(copy.ended[0],copy.ended[1])+' '+T(copy.grade[0],copy.grade[1])+grade+'.')}function showAffirmations(){$('reward').style.display='block';let list=cards.slice(0,Math.max(scoreVal,4)).slice(0,6).map(c=>'<div class="affirm">💬 '+tx(c.aff)+'</div>').join('');$('reward').innerHTML='<div>'+T(copy.affirmTitle[0],copy.affirmTitle[1])+'</div>'+list+'<div>'+T(copy.collection[0],copy.collection[1])+badges.join(' ')+'</div><div>'+T(copy.next[0],copy.next[1])+'</div>'}function reset(){scoreVal=0;streakVal=0;roundVal=0;heartsVal=3;shuffle(cards);render()}$('manualBtn').onclick=()=>{baseUi();$('modal').classList.add('show');speak(T('Lee la idea. Toca la mejor respuesta. Gana monedas.','Read the idea. Tap the best answer. Earn coins.'))};$('closeManual').onclick=()=>$('modal').classList.remove('show');$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;baseUi();if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};$('restartBtn').onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script><script src="/games/game-rules.js"></script>
