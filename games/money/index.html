endo','I am still learning'],bad:[['Ok mente, tú mandas','Ok mind, you are the boss'],['Me escondo en una papa','Hide inside a potato']],tip:['La palabra “todavía” abre la puerta del aprendizaje.','The word “yet” opens the learning door.'],aff:['Estoy aprendiendo cada día.','I am learning every day.']},{e:'🎯',t:['Meta','Goal'],q:['Una meta de dinero es como poner GPS. ¿Para qué sirve?','A money goal is like turning on GPS. What is it for?'],a:['Saber hacia dónde voy','Know where I am going'],bad:[['Para que el GPS baile salsa','So the GPS dances salsa'],['Para perderme más rápido','To get lost faster']],tip:['Una meta clara le da dirección a tus acciones.','A clear goal gives your actions direction.'],aff:['Yo puedo tener metas claras.','I can have clear goals.']},{e:'🤝',t:['Dar','Giving'],q:['Dar con amor no es quedar vacío. Es...','Giving with love is not becoming empty. It is...'],a:['Compartir algo bueno','Sharing something good'],bad:[['Regalar tu cama al mosquito','Give your bed to the mosquito'],['Tirar comida al techo','Throw food at the ceiling']],tip:['Dar con alegría fortalece el corazón.','Giving with joy strengthens the heart.'],aff:['Comparto desde alegría.','I share from joy.']},{e:'🏗️',t:['Habilidad','Skill'],q:['¿Qué es mejor que esperar que caiga dinero del cielo?','What is better than waiting for money to fall from the sky?'],a:['Construir habilidades','Build skills'],bad:[['Mirar nubes con cartera','Stare at clouds with a wallet'],['Pedirle préstamos al sofá','Ask the sofa for loans']],tip:['Las habilidades son herramientas para crear una vida mejor.','Skills are tools to create a better life.'],aff:['Mis habilidades crecen.','My skills grow.']},{e:'🧺',t:['Plan','Plan'],q:['Antes de gastar, el cerebro inteligente hace...','Before spending, the smart brain does...'],a:['Un pequeño plan','A small plan'],bad:[['Compra en modo tornado','Buy in tornado mode'],['Cierra los ojos y toca botones','Close eyes and tap buttons']],tip:['Un pequeño plan evita
