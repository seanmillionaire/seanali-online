<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Selva Verdadero o Falso | Juego Educativo</title><meta name="description" content="Juego móvil educativo en español con preguntas de verdadero o falso, voz guía, estrellas, racha, progreso y premios."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/selva/"><meta property="og:title" content="Selva: ¿Verdad o Falso?"><meta property="og:description" content="Responde preguntas divertidas de la selva, gana estrellas y abre premios."><meta property="og:type" content="website"><meta property="og:url" content="https://seanali.online/games/selva/"><meta name="theme-color" content="#1f7a39"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#cbffd4,#5fc878);display:flex;align-items:center;justify-content:center;padding:12px;color:#12351d;-webkit-tap-highlight-color:transparent}.game{width:100%;max-width:590px;background:#fffbe8;border:5px solid #1f7a39;border-radius:30px;box-shadow:0 18px 34px rgba(0,0,0,.18);overflow:hidden}.top{background:#1f7a39;color:white;padding:16px;text-align:center}h1{margin:0;font-size:32px;line-height:1.05}.badge{margin-top:7px;font-size:18px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;background:#eaffd9;border-bottom:4px solid #1f7a39}.pill{background:#fff;border:3px solid #1f7a39;border-radius:16px;padding:8px 5px;text-align:center;font-weight:900;font-size:17px}.xp{height:18px;background:#d3f2c7;border:3px solid #1f7a39;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffcf33,#ff7a18);transition:width .35s}.trail{display:flex;justify-content:center;gap:5px;padding:0 8px 8px}.dot{width:23px;height:23px;border-radius:50%;background:#d7eacb;border:3px solid #1f7a39;display:flex;align-items:center;justify-content:center;font-size:13px}.dot.on{background:#ffcf33}.scene{padding:12px 16px 18px;text-align:center}.emoji{font-size:86px;line-height:1;margin:4px 0 8px;animation:wiggle 1.7s infinite}.question{font-size:30px;line-height:1.08;font-weight:900;background:#e9fbff;padding:17px;border-radius:22px;margin-bottom:12px;border:4px solid #aeeaff}.story{font-size:22px;line-height:1.16;font-weight:900;margin:8px 0 15px;min-height:52px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px}button{width:100%;border:0;border-radius:23px;padding:22px 10px;font-size:27px;line-height:1.05;font-weight:900;cursor:pointer;color:#12351d;box-shadow:0 8px 0 #bd8610;min-height:86px}.true{background:#83ff73;box-shadow:0 8px 0 #3f9b35}.false{background:#ffdf4d;box-shadow:0 8px 0 #bd8610}.mini{font-size:17px;min-height:54px;padding:13px 8px;border-radius:17px;background:#e7ffe8;box-shadow:0 6px 0 #7abf81}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.restart,.talk{grid-column:1/-1;background:#ffd84d}.reward{background:#fff;border:4px solid #ff9f1c;border-radius:22px;padding:14px;margin-top:13px;font-size:20px;font-weight:900}.popup{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.7);background:#fff;border:5px solid #ff9f1c;border-radius:28px;padding:22px 26px;font-size:34px;font-weight:900;z-index:30;opacity:0;pointer-events:none}.popup.show{animation:pop .85s forwards}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fffbe8;border:5px solid #1f7a39;border-radius:28px;max-width:480px;width:100%;padding:20px;text-align:center}.manual ol{text-align:left;font-size:22px;font-weight:900;line-height:1.25}.manual button{background:#83ff73;box-shadow:0 7px 0 #3f9b35}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}.flash{position:fixed;inset:0;background:rgba(255,255,255,.45);opacity:0;pointer-events:none;z-index:20}.flash.show{animation:flash .35s}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(250deg);opacity:0}}@keyframes flash{40%{opacity:1}}@keyframes wiggle{50%{transform:rotate(2deg) scale(1.04)}}@media(max-width:390px){h1{font-size:28px}.emoji{font-size:76px}.question{font-size:26px}.story{font-size:20px}button{font-size:24px;min-height:78px}.pill{font-size:15px}}</style></head><body><div class="flash" id="flash"></div><div class="modal" id="modal"><div class="manual"><h2>📘 Cómo jugar</h2><ol><li>Escucha o lee la pregunta.</li><li>Toca Verdadero o Falso.</li><li>Gana estrellas.</li><li>Abre el cofre al final.</li></ol><button id="closeManual">¡Entiendo!</button></div></div><main class="game"><div class="top"><h1>🌿 Selva: ¿Verdad o Falso?</h1><div class="badge">Gana estrellas y abre el cofre</div></div><div class="hud"><div class="pill">⭐ <span id="stars">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">💎 <span id="gems">0</span></div></div><div class="xp"><div class="bar" id="bar"></div></div><div class="trail" id="trail"></div><div class="scene"><div id="emoji" class="emoji">🐒</div><div id="question" class="question">¿Listo?</div><div id="story" class="story">Toca Cómo jugar o empieza.</div><div id="choices" class="choices"></div><div class="controls"><button class="mini" id="manualBtn">📘 Cómo</button><button class="mini" id="voiceBtn">🔊 Voz</button><button class="mini" id="repeatBtn">🗣️ Repetir</button></div><div id="reward" class="reward" style="display:none"></div></div></main><div id="popup" class="popup">¡Pum!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,index=0,streak=0,voiceOn=true,wrong=[];const key='selvaPremios';let prizes=JSON.parse(localStorage.getItem(key)||'[]');const qs=[{e:'🐒',q:'Los monos usan celulares.',a:false,ok:'¡No! No tienen Wi Fi.',bad:'Falso. Los monos no tienen celular.'},{e:'🦜',q:'El tucán tiene un pico grande.',a:true,ok:'¡Sí! Pico grandote.',bad:'Verdad. El pico es gigante.'},{e:'🐊',q:'Los cocodrilos manejan carros.',a:false,ok:'¡No! Prefieren nadar.',bad:'Falso. No tienen licencia.'},{e:'🐸',q:'Hay ranas de muchos colores.',a:true,ok:'¡Sí! Algunas brillan mucho.',bad:'Verdad. Hay ranas coloridas.'},{e:'🦥',q:'El perezoso corre como moto.',a:false,ok:'¡No! Va leeeeento.',bad:'Falso. Es muy lento.'},{e:'🐜',q:'Las hormigas trabajan juntas.',a:true,ok:'¡Sí! Son súper equipo.',bad:'Verdad. Trabajan en grupo.'},{e:'🐍',q:'Las serpientes tienen piernas.',a:false,ok:'¡No! Se arrastran.',bad:'Falso. Sin piernas.'},{e:'🦋',q:'La mariposa fue oruga.',a:true,ok:'¡Sí! Cambia mucho.',bad:'Verdad. Antes fue oruga.'},{e:'🌴',q:'Los árboles caminan a comprar agua.',a:false,ok:'¡No! Tienen raíces.',bad:'Falso. Los árboles no caminan.'},{e:'🐆',q:'Hay jaguares en Panamá.',a:true,ok:'¡Sí! Son fuertes y bellos.',bad:'Verdad. Hay jaguares.'}];const total=qs.length;function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function updateHud(){stars.textContent=score;streakEl=document.getElementById('streak');streakEl.textContent=streak;gems.textContent=prizes.length;bar.style.width=(index/total*100)+'%';trail.innerHTML='';for(let i=0;i<total;i++){let d=document.createElement('div');d.className='dot '+(i<index?'on':'');d.textContent=i<index?'⭐':'';trail.appendChild(d)}}function render(){let s=qs[index];updateHud();emoji.textContent=s.e;question.textContent=s.q;story.textContent='¿Verdadero o falso?';reward.style.display='none';choices.innerHTML='';[['Verdadero ✅',true,'true'],['Falso ❌',false,'false']].forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.className=x[2];b.onclick=()=>answer(x[1]);choices.appendChild(b)});speak(s.q+'. Verdadero o falso.')}function answer(v){let s=qs[index],right=v===s.a;flash();if(right){score++;streak++;sound('ding');popup('¡Correcto! ⭐');confetti();story.textContent=s.ok;speak('Correcto. '+s.ok)}else{streak=0;wrong.push(s);sound('wrong');popup('¡Ups! 😄');story.textContent=s.bad;speak(s.bad)}setTimeout(()=>{index++;if(index>=total)end();else render()},1150)}function end(){updateHud();bar.style.width='100%';let grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C';let prize=score>=9?'🐆 Jaguar Real':score>=7?'🦜 Tucán Dorado':score>=5?'🐸 Rana Arcoíris':'🌱 Semilla Valiente';if(!prizes.includes(prize)){prizes.push(prize);localStorage.setItem(key,JSON.stringify(prizes))}sound('money');emoji.textContent='🎁';question.textContent='Cofre abierto: '+grade;story.textContent=score+'/'+total+' correctas. Ganaste '+prize+'.';popup('¡Premio! '+prize);confetti(34);speak('Juego terminado. Tu nota es '+grade+'. Ganaste '+prize+'.');choices.innerHTML='';let r=document.createElement('button');r.textContent='Jugar otra vez 🔁';r.className='restart';r.onclick=reset;choices.appendChild(r);let t=document.createElement('button');t.textContent='Ver errores 💬';t.className='talk';t.onclick=()=>{question.textContent='Errores';story.textContent=wrong.length?wrong.map(w=>w.q).join(' | '):'¡Ningún error!'};choices.appendChild(t);reward.style.display='block';reward.innerHTML='Colección:<div>'+prizes.join(' ')+'</div><div>Próximo reto: 9 estrellas para premio grande.</div>'}function reset(){score=0;streak=0;index=0;wrong=[];render()}function popup(t){let p=document.getElementById('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function flash(){let f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}function confetti(n=14){let p=['⭐','🌿','🌸','✨','🍃','🦋','🌈','💎'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}manualBtn.onclick=()=>{modal.classList.add('show');speak('Escucha la pregunta. Toca verdadero o falso. Gana estrellas. Abre el cofre al final.')};closeManual.onclick=()=>modal.classList.remove('show');voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};repeatBtn.onclick=()=>{if(index<total)speak(qs[index].q+'. Verdadero o falso.')};render();</script></body></html>
