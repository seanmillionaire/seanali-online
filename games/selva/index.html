<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Selva Verdadero o Falso | Juego Educativo</title><meta name="description" content="Juego móvil educativo en español con preguntas de verdadero o falso, voz guía, estrellas, racha, progreso y premios."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/games/selva/"><meta property="og:title" content="Selva: ¿Verdad o Falso?"><meta property="og:description" content="Responde preguntas divertidas de la selva, gana estrellas y abre premios."><meta property="og:type" content="website"><meta property="og:url" content="https://seanali.online/games/selva/"><meta name="theme-color" content="#1f7a39"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#cbffd4,#5fc878);display:flex;align-items:center;justify-content:center;padding:12px;color:#12351d;-webkit-tap-highlight-color:transparent}.game{width:100%;max-width:590px;background:#fffbe8;border:5px solid #1f7a39;border-radius:30px;box-shadow:0 18px 34px rgba(0,0,0,.18);overflow:hidden}.top{background:#1f7a39;color:white;padding:16px;text-align:center}h1{margin:0;font-size:32px;line-height:1.05}.badge{margin-top:7px;font-size:18px;font-weight:900}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;background:#eaffd9;border-bottom:4px solid #1f7a39}.pill{background:#fff;border:3px solid #1f7a39;border-radius:16px;padding:8px 5px;text-align:center;font-weight:900;font-size:17px}.xp{height:18px;background:#d3f2c7;border:3px solid #1f7a39;border-radius:999px;margin:10px 14px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffcf33,#ff7a18);transition:width .35s}.trail{display:flex;justify-content:center;gap:5px;padding:0 8px 8px}.dot{width:23px;height:23px;border-radius:50%;background:#d7eacb;border:3px solid #1f7a39;display:flex;align- nset:0;background:rgba(255,255,255,.45);opacity:0;pointer-events:none;z-index:20}.flash.show{animation:flash .35s}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(250deg);opacity:0}}@keyframes flash{40%{opacity:1}}@keyframes wiggle{50%{transform:rotate(2deg) scale(1.04)}}@media(max-width:390px){h1{font-size:28px}.emoji{font-size:76px}.question{font-size:26px}.story{font-size:20px}button{font-size:24px;min-height:78px}.pill{font-size:15px}}</style></head><body><div class="flash" id="flash"></div><div class="modal" id="modal"><div class="manual"><h2>📘 Cómo jugar</h2><ol><li>Escucha o lee la pregunta.</li><li>Toca Verdadero o Falso.</li><li>Gana estrellas.</li><li>Abre el cofre al final.</li></ol><button id="closeManual">¡Entiendo!</button></div></div><main class="game"><div class="top"><h1>🌿 Selva: ¿Verdad o Falso?</h1><div class="badge">Gana estrellas y abre el cofre</div></div><div class="hud"><div class="pill">⭐ <span id="stars">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">💎 <span id="gems">0</span></div></div><div class="xp"><div class="bar" id="bar"></div></div><div class="trail" id="trail"></div><div class="scene"><div id="emoji" class="emoji">🐒</div><div id="question" class="question">¿Listo?</div><div id="story" class="story">Toca Cómo jugar o empieza.</div><div id="choices" class="choices"></div><div class="controls"><button class="mini" id="manualBtn">📘 Cómo</button><button class="mini" id="voiceBtn">🔊 Voz</button><button class="mini" id="repeatBtn">🗣️ Repetir</button></div><div id="reward" class="reward" style="display:none"></div></div></main><div id="popup" class="popup">¡Pum!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,index=0,streak=0,voiceOn=true,wrong=[];const key='selvaPremios';let prizes=JSON.parse(localStorage.getItem(key)||'[]');let qs=[{e:'🐆',q:'¿Qué ayuda al jaguar a cazar en la selva?',choices:['Ver bien de noche','Tener alas largas','Comer solo hojas'],a:'Ver bien de noche',ok:'¡Sí! El jaguar ve muy bien con poca luz.',bad:'El jaguar no necesita alas. Su ventaja es ver y moverse en silencio.'},{e:'🦜',q:'¿Para qué le sirve el pico grande al tucán?',choices:['Alcanzar fruta y regular calor','Excavar túneles bajo tierra','Respirar debajo del agua'],a:'Alcanzar fruta y regular calor',ok:'¡Correcto! El pico ayuda a alcanzar comida y soltar calor.',bad:'El pico del tucán no es para cavar ni nadar. Ayuda con fruta y calor.'},{e:'🐜',q:'¿Por qué las hormigas cortadoras llevan hojas?',choices:['Para cultivar su comida','Para construir teléfonos','Para tapar el sol'],a:'Para cultivar su comida',ok:'¡Sí! Usan hojas para alimentar hongos que comen.',bad:'Las hojas no son decoración. Las usan para cultivar alimento.'},{e:'🦥',q:'¿Por qué el perezoso se mueve tan lento?',choices:['Ahorra energía','Está siempre dormido por magia','No tiene músculos'],a:'Ahorra energía',ok:'¡Sí! Moverse lento le ayuda a gastar menos energía.',bad:'El perezoso sí tiene músculos. Su truco es ahorrar energía.'},{e:'🐸',q:'¿Qué puede indicar una rana muy colorida?',choices:['Puede ser venenosa','Siempre es bebé','No puede saltar'],a:'Puede ser venenosa',ok:'¡Correcto! Los colores fuertes pueden advertir peligro.',bad:'Los colores fuertes pueden ser una señal de advertencia.'},{e:'🐍',q:'¿Cómo detectan muchas serpientes lo que hay cerca?',choices:['Con la lengua y olores','Con ruedas escondidas','Cantando fuerte'],a:'Con la lengua y olores',ok:'¡Sí! La lengua ayuda a recoger olores del ambiente.',bad:'Las serpientes usan su lengua para explorar olores.'},{e:'🦋',q:'¿Qué pasa antes de que una mariposa tenga alas?',choices:['Pasa por una etapa de oruga','Aprende a nadar','Se vuelve piedra'],a:'Pasa por una etapa de oruga',ok:'¡Sí! Primero oruga, luego cambia y salen alas.',bad:'La mariposa no aparece de golpe. Antes fue oruga.'},{e:'🌴',q:'¿Por qué son importantes los árboles grandes de la selva?',choices:['Dan sombra, hogar y alimento','Solo sirven para verse bonitos','Caminan buscando lluvia'],a:'Dan sombra, hogar y alimento',ok:'¡Sí! Muchos animales dependen de esos árboles.',bad:'Los árboles sostienen vida: sombra, casa y comida.'},{e:'🐊',q:'¿Dónde pasa mucho tiempo el cocodrilo?',choices:['En el agua y cerca de la orilla','En nidos arriba de árboles','Volando sobre montañas'],a:'En el agua y cerca de la orilla',ok:'¡Correcto! El agua le ayuda a moverse y esconderse.',bad:'El cocodrilo es fuerte en el agua y en la orilla.'},{e:'🐒',q:'¿Qué habilidad ayuda a muchos monos en los árboles?',choices:['Agarrar ramas con manos y cola','Respirar como pez','Cambiar de color como una flor'],a:'Agarrar ramas con manos y cola',ok:'¡Sí! Eso les ayuda a moverse entre ramas.',bad:'Muchos monos usan manos fuertes y a veces la cola para moverse.'},{e:'🦇',q:'¿Por qué muchos murciélagos son importantes en la selva?',choices:['Ayudan a esparcir semillas','Construyen carreteras','Comen solo piedras'],a:'Ayudan a esparcir semillas',ok:'¡Sí! Algunos murciélagos ayudan a mover semillas por la selva.',bad:'Muchos murciélagos ayudan a la selva esparciendo semillas.'},{e:'🐢',q:'¿Qué protege a una tortuga?',choices:['Su caparazón','Sus alas','Su rugido'],a:'Su caparazón',ok:'¡Correcto! El caparazón funciona como protección.',bad:'La tortuga se protege principalmente con su caparazón.'},{e:'🌧️',q:'¿Por qué llueve tanto en muchas selvas?',choices:['Hay mucha humedad y plantas','Porque los animales cantan','Porque no existe sol'],a:'Hay mucha humedad y plantas',ok:'¡Sí! La humedad y las plantas ayudan al ciclo de lluvia.',bad:'La lluvia de la selva viene de humedad, calor y muchas plantas.'},{e:'🦟',q:'¿Qué lugar ayuda a crecer a muchos mosquitos?',choices:['Agua quieta','Rocas secas','Fuego fuerte'],a:'Agua quieta',ok:'¡Sí! El agua quieta puede atraer mosquitos.',bad:'Muchos mosquitos crecen cerca de agua quieta.'},{e:'🐝',q:'¿Qué hacen muchos insectos por las plantas?',choices:['Ayudan a polinizar','Les enseñan matemáticas','Las convierten en metal'],a:'Ayudan a polinizar',ok:'¡Sí! Algunos insectos ayudan a que las plantas produzcan frutos.',bad:'La polinización es una gran ayuda para muchas plantas.'},{e:'🪲',q:'¿Por qué son útiles algunos escarabajos?',choices:['Reciclan materia de la selva','Pintan las nubes','Apagan el sol'],a:'Reciclan materia de la selva',ok:'¡Correcto! Ayudan a descomponer y reciclar.',bad:'Algunos escarabajos limpian y reciclan materia natural.'},{e:'🦅',q:'¿Qué ventaja tiene un ave rapaz?',choices:['Vista fuerte desde arriba','Respirar bajo tierra','Dormir todo el día'],a:'Vista fuerte desde arriba',ok:'¡Sí! Ver desde arriba ayuda a encontrar comida.',bad:'Las aves rapaces tienen una vista muy fuerte.'},{e:'🌺',q:'¿Por qué algunas flores tienen colores fuertes?',choices:['Atraen polinizadores','Asustan a la lluvia','Pesan como rocas'],a:'Atraen polinizadores',ok:'¡Sí! Los colores pueden llamar a insectos y aves.',bad:'Los colores de flores pueden atraer polinizadores.'},{e:'🐾',q:'Si ves huellas en el barro, ¿qué puedes aprender?',choices:['Qué animal pasó por ahí','Cuántas estrellas hay','El sabor del río'],a:'Qué animal pasó por ahí',ok:'¡Sí! Las huellas cuentan una historia.',bad:'Las huellas ayudan a saber qué animal pasó.'},{e:'🪵',q:'¿Qué pasa con un tronco caído con el tiempo?',choices:['Se descompone y alimenta el suelo','Se vuelve teléfono','Nunca cambia'],a:'Se descompone y alimenta el suelo',ok:'¡Sí! La selva recicla lo que cae.',bad:'Un tronco caído puede descomponerse y nutrir el suelo.'}];const total=10;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}shuffle(qs);function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function updateHud(){stars.textContent=score;streakEl=document.getElementById('streak');streakEl.textContent=streak;gems.textContent=prizes.length;bar.style.width=(index/total*100)+'%';trail.innerHTML='';for(let i=0;i<total;i++){let d=document.createElement('div');d.className='dot '+(i<index?'on':'');d.textContent=i<index?'⭐':'';trail.appendChild(d)}}function render(){let s=qs[index];updateHud();emoji.textContent=s.e;question.textContent=s.q;story.textContent=s.prompt||'Elige el dato correcto.';reward.style.display='none';choices.innerHTML='';let opts=s.choices?s.choices.map((text,i)=>[text,text,i%2?'false':'true']):[['Verdadero',true,'true'],['Falso',false,'false']];opts.sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.className=x[2];b.onclick=()=>answer(x[1]);choices.appendChild(b)});speak(s.q+'. '+(s.prompt||'Elige el dato correcto.'))}function answer(v){let s=qs[index],right=v===s.a;flash();if(right){score++;streak++;sound('ding');popup('¡Correcto! ⭐');confetti();story.textContent=s.ok;speak('Correcto. '+s.ok)}else{streak=0;wrong.push(s);sound('wrong');popup('¡Ups! 😄');story.textContent=s.bad;speak(s.bad)}setTimeout(()=>{index++;if(index>=total)end();else render()},1150)}function end(){updateHud();bar.style.width='100%';let grade=score>=9?'A+':score>=7?'A':score>=5?'B':'C';let prize=score>=9?'🐆 Jaguar Real':score>=7?'🦜 Tucán Dorado':score>=5?'🐸 Rana Arcoíris':'🌱 Semilla Valiente';if(!prizes.includes(prize)){prizes.push(prize);localStorage.setItem(key,JSON.stringify(prizes))}sound('money');emoji.textContent='🎁';question.textContent='Cofre abierto: '+grade;story.textContent=score+'/'+total+' correctas. Ganaste '+prize+'.';popup('¡Premio! '+prize);confetti(34);speak('Juego terminado. Tu nota es '+grade+'. Ganaste '+prize+'.');choices.innerHTML='';let r=document.createElement('button');r.textContent='Jugar otra vez 🔁';r.className='restart';r.onclick=reset;choices.appendChild(r);let t=document.createElement('button');t.textContent='Ver errores 💬';t.className='talk';t.onclick=()=>{question.textContent='Errores';story.textContent=wrong.length?wrong.map(w=>w.q).join(' | '):'¡Ningún error!'};choices.appendChild(t);reward.style.display='block';reward.innerHTML='Colección:<div>'+prizes.join(' ')+'</div><div>Próximo reto: 9 estrellas para premio grande.</div>'}function reset(){score=0;streak=0;index=0;wrong=[];shuffle(qs);render()}function popup(t){let p=document.getElementById('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function flash(){let f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}function confetti(n=14){let p=['⭐','🌿','🌸','✨','🍃','🦋','🌈','💎'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=p[Math.floor(Math.random()*p.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}manualBtn.onclick=()=>{modal.classList.add('show');speak('Escucha la pregunta. Toca verdadero o falso. Gana estrellas. Abre el cofre al final.')};closeManual.onclick=()=>modal.classList.remove('show');voiceBtn.onclick=()=>{voiceOn=!voiceOn;voiceBtn.textContent=voiceOn?'🔊 Voz':'🔇 Voz';if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};repeatBtn.onclick=()=>{if(index<total)speak(qs[index].q+'. '+(qs[index].prompt||'Elige el dato correcto.'))};render();</script></body></html>
