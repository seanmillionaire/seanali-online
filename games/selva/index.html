<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Selva Verdadero o Falso</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,sans-serif;background:linear-gradient(180deg,#c9ffd4,#62c878);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;color:#12351d;-webkit-tap-highlight-color:transparent;overflow-x:hidden}.game{width:100%;max-width:560px;background:#fffbe8;border:5px solid #1f7a39;border-radius:28px;box-shadow:0 18px 34px rgba(0,0,0,.18);overflow:hidden;position:relative}.top{background:#1f7a39;color:white;padding:18px 14px;text-align:center}h1{margin:0;font-size:33px;line-height:1.05}.badge{margin-top:8px;font-size:20px;font-weight:bold}.scene{padding:22px 16px 18px;text-align:center}.emoji{font-size:92px;line-height:1;margin-bottom:10px;animation:wiggle 1.7s infinite ease-in-out}.question{font-size:31px;line-height:1.1;font-weight:900;background:#e9fbff;padding:18px;border-radius:22px;margin-bottom:14px;border:4px solid #aeeaff}.story{font-size:24px;line-height:1.2;font-weight:bold;margin:8px 0 18px;min-height:58px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{width:100%;border:0;border-radius:24px;padding:24px 12px;font-size:28px;line-height:1.05;font-weight:900;cursor:pointer;color:#12351d;box-shadow:0 8px 0 #bd8610;min-height:92px;touch-action:manipulation}.true{background:#83ff73;box-shadow:0 8px 0 #3f9b35}.false{background:#ffdf4d;box-shadow:0 8px 0 #bd8610}.restart{grid-column:1/-1;background:#ffd84d}.talk{grid-column:1/-1;background:#e7ffe8;box-shadow:0 8px 0 #7abf81}.score{padding:15px 14px;background:#f1ffe8;border-top:3px solid #bde7bf;display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:21px}.popup{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.7);background:#fff;color:#12351d;border:5px solid #ff9f1c;border-radius:28px;padding:22px 26px;font-size:34px;font-weight:900;box-shadow:0 18px 35px rgba(0,0,0,.25);z-index:10;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s ease forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:9;pointer-events:none}.flash{position:fixed;inset:0;background:rgba(255,255,255,.45);opacity:0;pointer-events:none;z-index:7}.flash.show{animation:flash .35s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65) rotate(-4deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(3deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.92)}}@keyframes fall{to{transform:translateY(105vh) rotate(250deg);opacity:0}}@keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}@keyframes wiggle{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}@media(max-width:390px){h1{font-size:29px}.emoji{font-size:82px}.question{font-size:27px}.story{font-size:22px}button{font-size:25px;min-height:84px}.score{font-size:18px}.popup{font-size:29px;width:82%}}</style></head><body><div class="flash" id="flash"></div><div class="game"><div class="top"><h1>🌿 Selva: ¿Verdad o Fake?</h1><div class="badge">Toca la respuesta</div></div><div class="scene"><div id="emoji" class="emoji">🐒</div><div id="question" class="question">¿Listo?</div><div id="story" class="story">¿Verdadero o falso?</div><div id="choices" class="choices"></div></div><div class="score"><div>Puntos: <span id="stars">0</span> ⭐</div><div><span id="step">1</span>/<span id="total">10</span></div></div></div><div id="popup" class="popup">¡Pum!</div><script>let score=0,index=0;let wrong=[];const qs=[{e:'🐒',q:'Los monos usan celulares.',a:false,ok:'¡No! No tienen Wi‑Fi.',bad:'¡Fake! Los monos no tienen celular.'},{e:'🦜',q:'El tucán tiene un pico grande.',a:true,ok:'¡Sí! Pico grandote.',bad:'Verdad. El pico es gigante.'},{e:'🐊',q:'Los cocodrilos manejan carros.',a:false,ok:'¡No! Prefieren nadar.',bad:'¡Fake! No tienen licencia.'},{e:'🐸',q:'Hay ranas de muchos colores.',a:true,ok:'¡Sí! Algunas son muy brillantes.',bad:'Verdad. Hay ranas coloridas.'},{e:'🦥',q:'El perezoso corre como moto.',a:false,ok:'¡No! Va leeeeento.',bad:'¡Fake! Es muy lento.'},{e:'🐜',q:'Las hormigas trabajan juntas.',a:true,ok:'¡Sí! Súper equipo.',bad:'Verdad. Trabajan en grupo.'},{e:'🐍',q:'Las serpientes tienen piernas.',a:false,ok:'¡No! Se arrastran.',bad:'¡Fake! Sin piernas.'},{e:'🦋',q:'La mariposa fue oruga.',a:true,ok:'¡Sí! Cambia mucho.',bad:'Verdad. Antes fue oruga.'},{e:'🌴',q:'Los árboles caminan a comprar agua.',a:false,ok:'¡No! Tienen raíces.',bad:'¡Fake! Los árboles no caminan.'},{e:'🐆',q:'Hay jaguares en Panamá.',a:true,ok:'¡Sí! Son fuertes y bellos.',bad:'Verdad. Hay jaguares.'}];const total=qs.length;document.getElementById('total').textContent=total;function render(){const s=qs[index];document.getElementById('emoji').textContent=s.e;document.getElementById('question').textContent=s.q;document.getElementById('story').textContent='¿Verdadero o falso?';document.getElementById('stars').textContent=score;document.getElementById('step').textContent=Math.min(index+1,total);const c=document.getElementById('choices');c.innerHTML='';[['Verdadero ✅',true,'true'],['Falso ❌',false,'false']].forEach(x=>{const b=document.createElement('button');b.textContent=x[0];b.className=x[2];b.onclick=()=>answer(x[1]);c.appendChild(b)})}function answer(val){const s=qs[index];const right=val===s.a;flash();if(right){score++;popup('¡Correcto! ⭐');confetti();document.getElementById('story').textContent=s.ok}else{wrong.push(s);popup('¡Ups! 😄');document.getElementById('story').textContent=s.bad}setTimeout(()=>{index++;if(index>=total)end();else render()},1050)}function end(){document.getElementById('stars').textContent=score;document.getElementById('step').textContent=total;let grade='';let msg='';if(score>=9){grade='A+';msg='¡Genia de la selva! 🏆'}else if(score>=7){grade='A';msg='¡Muy bien! 🌟'}else if(score>=5){grade='B';msg='¡Bien! Juega otra vez.'}else{grade='C';msg='¡Buen intento! Vamos otra vez.'}document.getElementById('emoji').textContent=score>=7?'🏆':'🌿';document.getElementById('question').textContent='Nota: '+grade;document.getElementById('story').textContent=score+'/'+total+' correctas. '+msg;popup('Nota '+grade);confetti(26);const c=document.getElementById('choices');c.innerHTML='';const r=document.createElement('button');r.textContent='Jugar otra vez 🔁';r.className='restart';r.onclick=()=>{score=0;index=0;wrong=[];render()};c.appendChild(r);const t=document.createElement('button');t.textContent='Ver errores 💬';t.className='talk';t.onclick=()=>{document.getElementById('question').textContent='Errores';document.getElementById('story').textContent=wrong.length?wrong.map(w=>w.q).join(' | '):'¡Ningún error!'};c.appendChild(t)}function popup(text){const p=document.getElementById('popup');p.textContent=text;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function flash(){const f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}function confetti(count=14){const pieces=['⭐','🌿','🌸','✨','🍃','🦋','🌈'];for(let i=0;i<count;i++){const el=document.createElement('div');el.className='confetti';el.textContent=pieces[Math.floor(Math.random()*pieces.length)];el.style.left=Math.random()*100+'vw';el.style.animationDelay=Math.random()*.22+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}}render();</script></body></html>
