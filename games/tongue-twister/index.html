ranslateY(6px);box-shadow:0 1px 0 #1d144b}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.small{border:0;border-radius:17px;padding:13px 8px;font-size:16px;font-weight:900;background:#e7ffe8;box-shadow:0 6px 0 #7abf81}.reward{display:none;background:#fff;border:4px solid #ffc83d;border-radius:22px;padding:14px;margin-top:14px;font-size:19px;font-weight:900;line-height:1.25}.unlock{background:#f1ffe8;border:3px solid #bde7bf;border-radius:16px;padding:10px;margin:8px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}.modal.show{display:flex}.manual{background:#fff6e6;border:5px solid #1d144b;border-radius:28px;max-width:500px;width:100%;padding:20px;text-align:center}.manual h2{margin:0 0 10px;font-size:30px}.manual ol{text-align:left;font-size:21px;font-weight:900;line-height:1.25}.manual button{border:0;border-radius:22px;padding:18px;font-size:25px;font-weight:900;background:#ffc83d;box-shadow:0 7px 0 #9b5d00;width:100%}.popup{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.75);background:white;border:5px solid #1d144b;border-radius:28px;padding:22px 28px;font-size:33px;font-weight:900;z-index:30;opacity:0;pointer-events:none;text-align:center}.popup.show{animation:pop .85s forwards}.confetti{position:fixed;top:-30px;font-size:30px;animation:fall 1.25s linear forwards;z-index:25}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes pop{20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes fall{to{transform:translateY(105vh) rotate(260deg);opacity:0}}@media(max-width:390px){h1{font-size:32px}.portal{font-size:74px}.question{font-size:24px}.twister{font-size:21px}.mind{font-size:18px}.letter{font-size:24px}.pill{font-size:14px}.small{font-size:14px}}</style></head><body><div class="modal" id="modal"><div class="manual"><h2 id="manualTitle">📘 How to Play</h2><ol id="manualList"></ol><button id="closeManual">Let’s go!</button></div></div><main class="game"><section class="top"><h1 id="gameTitle">🌀 Tongue Twister</h1><div class="sub" id="sub">Choose a letter. Open your mind.</div></section><section class="hud"><div class="pill">✨ <span id="score">0</span></div><div class="pill">🔥 <span id="streak">0</span></div><div class="pill">🧠 <span id="mindScore">0</span></div><div class="pill">🔤 <span id="round">0</span>/8</div></section><div class="xp"><div class="bar" id="bar"></div></div><div class="row" id="row"></div><section class="stage"><div class="portal" id="portal">🌀</div><div class="topic" id="topic">Letter Portal</div><div class="question" id="question">Pick a letter portal.</div><div class="scene" id="scene">✨ 🔤 ✨</div><div class="twister" id="twister">Your tongue twister will appear here.</div><div class="mind" id="mind">A mind-bender will unlock after each letter.</div><div class="letters" id="letters"></div><div class="controls"><button class="small" id="manualBtn">📘 How</button><button class="small" id="voiceBtn">🔊 Voice</button><button class="small" id="restartBtn">🔁 New</button></div><div class="reward" id="reward"></div></section></main><div class="popup" id="popup">Whoa!</div><script src="/games/voice.js"></script><script src="/games/sounds.js"></script><script>let score=0,streak=0,mindScore=0,round=0,voiceOn=true,lastLang=null,used=[];const total=8,key='twisterBadges';let badges=JSON.parse(localStorage.getItem(key)||'[]');const $=id=>document.getElementById(id);function lang(){return localStorage.getItem('seanGameLang')||'en'}function T(en,es){return lang()==='es'?es:en}function tx(v){return Array.isArray(v)?T(v[0],v[1]):v}const copy={title:['🌀 Tongue Twister','🌀 Trabalenguas'],sub:['Choose a letter. Open your mind.','Elige una letra. Abre tu mente.'],topic:['Letter Portal','Portal de Letras'],pick:['Pick a letter portal.','Elige un portal de letras.'],empty:['Your tongue twister will appear here.','Tu trabalenguas aparecerá aquí.'],mindEmpty:['A mind-bender will unlock after each letter.','Un giro mental se desbloquea con cada letra.'],manualTitle:['📘 How to Play','📘 Cómo jugar'],manual:[['Choose a letter.','Elige una letra.'],['Read the tongue twister out loud.','Lee el trabalenguas en voz alta.'],['Look at the emoji scene.','Mira la escena de emojis.'],['Think about the mind-bender.','Piensa en el giro mental.'],['Open all portals to win a badge.','Abre todos los portales para ganar un badge.']],go:['Let’s go!','¡Vamos!'],how:['📘 How','📘 Cómo'],voice:['🔊 Voice','🔊 Voz'],muted:['🔇 Voice','🔇 Voz'],new:['🔁 New','🔁 Nuevo'],open:['Portal opened!','¡Portal abierto!'],again:['Choose another letter.','Elige otra letra.'],done:['Mind opened!','¡Mente abierta!'],grade:['Grade ','Nota '],earned:['You earned ','Ganaste '],replay:['Open again 🔁','Abrir otra vez 🔁'],see:['See mind keys 💬','Ver llaves mentales 💬'],keys:['🔓 Mind keys unlocked:','🔓 Llaves mentales desbloqueadas:'],next:['Next prize: open all 8 letter portals again.','Próximo premio: abre los 8 portales otra vez.']};const cards=[{l:'B',e:'🐝 🥁 🌉',t:['Bouncy bees build bright bridges.','Bebés búhos brincan bajo burbujas brillantes.'],m:['A bridge is a thought that helps two ideas meet.','Un puente es un pensamiento que ayuda a dos ideas a encontrarse.']},{l:'C',e:'🌙 🐱 🏰',t:['Curious cats carry crystal crowns.','Cinco cocos curiosos cuentan cuentos cortos.'],m:['Curiosity is a tiny flashlight inside the mind.','La curiosidad es una linterna pequeña dentro de la mente.']},{l:'D',e:'🐉 🚪 💎',t:['Daring dragons dance through diamond doors.','Dulces dragones dibujan diamantes dorados.'],m:['A door is not only an exit. It can be an invitation.','Una puerta no solo es una salida. También puede ser una invitación.']},{l:'F',e:'🦊 🔥 🌸',t:['Fast foxes flip five flaming flowers.','Felices focas forman flores flotantes.'],m:['Speed is useful, but direction is the real magic.','La velocidad ayuda, pero la dirección es la magia real.']},{l:'L',e:'🦁 💡 🌙',t:['Little lions light lucky lanterns.','Lindos leones leen luces lunares.'],m:['A light can be small and still change the whole room.','Una luz puede ser pequeña y cambiar todo el cuarto.']},{l:'M',e:'🪄 🌊 🐒',t:['Magic monkeys mix moonlit music.','Monos mágicos mezclan música marina.'],m:['A mistake can be clay. Shape it into a lesson.','Un error puede ser barro. Dale forma de lección.']},{l:'P',e:'🦜 🥞 🚀',t:['Purple parrots pack pancake planets.','Pequeños pájaros pintan planetas perfectos.'],m:['A planet is a reminder: every world has its own rules.','Un planeta recuerda: cada mundo tiene sus propias reglas.']},{l:'S',e:'🐍 ⭐ 🌀',t:['Silly snakes spin silver stars.','Siete serpientes saltan sobre soles suaves.'],m:['A spiral looks confusing until you see it is still moving forward.','Una espiral parece confusa hasta que ves que sigue avanzando.']}];function speak(t){if(voiceOn&&window.SeanGameVoice)window.SeanGameVoice.speak(t)}function sound(n){if(window.SeanGameSounds&&window.SeanGameSounds[n])window.SeanGameSounds[n]()}function popup(t){let p=$('popup');p.textContent=t;p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}function confetti(n=14){let arr=['✨','🌀','🔤','⭐','🧠','💎'];for(let i=0;i<n;i++){let el=document.createElement('div');el.className='confetti';el.textContent=arr[Math.floor(Math.random()*arr.length)];el.style.left=Math.random()*100+'vw';document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}}function baseUi(){lastLang=lang();$('gameTitle').textContent=tx(copy.title);$('sub').textContent=tx(copy.sub);$('manualTitle').textContent=tx(copy.manualTitle);$('manualList').innerHTML=copy.manual.map(x=>'<li>'+tx(x)+'</li>').join('');$('closeManual').textContent=tx(copy.go);$('manualBtn').textContent=tx(copy.how);$('voiceBtn').textContent=voiceOn?tx(copy.voice):tx(copy.muted);$('restartBtn').textContent=tx(copy.new);document.documentElement.lang=lang()}function hud(){$('score').textContent=score;$('streak').textContent=streak;$('mindScore').textContent=mindScore;$('round').textContent=round;$('bar').style.width=(round/total*100)+'%';$('row').innerHTML='';for(let i=0;i<total;i++){let d=document.createElement('div');d.className='spark '+(i<round?'on':'');d.textContent=i<round?'✨':'';$('row').appendChild(d)}}function renderLetters(){let box=$('letters');box.innerHTML='';cards.forEach(c=>{let b=document.createElement('button');b.className='letter '+(used.includes(c.l)?'used':'');b.textContent=c.l;b.onclick=()=>openLetter(c,b);box.appendChild(b)})}function render(){baseUi();hud();$('topic').textContent=tx(copy.topic);if(round===0){$('portal').textContent='🌀';$('question').textContent=tx(copy.pick);$('scene').textContent='✨ 🔤 ✨';$('twister').textContent=tx(copy.empty);$('mind').textContent=tx(copy.mindEmpty);$('reward').style.display='none'}renderLetters()}function openLetter(c,b){if(used.includes(c.l))return;used.push(c.l);score++;streak++;mindScore++;round++;sound('ding');$('portal').textContent='🔤';$('topic').textContent='Letter '+c.l;$('question').textContent=T('Say it three times.','Dilo tres veces.');$('scene').textContent=c.e;$('twister').textContent=tx(c.t);$('mind').textContent='🧠 '+tx(c.m);popup(tx(copy.open));confetti();speak(tx(c.t)+'. '+tx(c.m));hud();renderLetters();if(round>=total)setTimeout(end,900)}function end(){let badge=lang()==='es'?'🏆 Maestro de Letras':'🏆 Letter Bender';if(!badges.includes(badge)){badges.push(badge);localStorage.setItem(key,JSON.stringify(badges))}sound('money');$('portal').textContent='🏆';$('topic').textContent=tx(copy.done);$('question').textContent=tx(copy.grade)+'A+';$('scene').textContent='🌀 🔤 🧠 ✨ 🏆';$('twister').textContent=T('You opened every letter portal.','Abriste todos los portales de letras.');$('mind').textContent=tx(copy.earned)+badge+'.';$('letters').innerHTML='';[['replay',reset,'🔁'],['see',showKeys,'💬']].forEach(x=>{let b=document.createElement('button');b.className='letter';b.innerHTML=x[2];b.title=tx(copy[x[0]]);b.onclick=x[1];$('letters').appendChild(b)});showKeys();popup(tx(copy.done));confetti(36);speak(tx(copy.done)+'. '+tx(copy.earned)+badge)}function showKeys(){$('reward').style.display='block';let list=cards.slice(0,used.length).map(c=>'<div class="unlock">'+c.e+' — '+tx(c.m)+'</div>').join('');$('reward').innerHTML='<div>'+tx(copy.keys)+'</div>'+list+'<div>'+badges.join(' ')+'</div><div>'+tx(copy.next)+'</div>'}function reset(){score=0;streak=0;mindScore=0;round=0;used=[];render()}$('manualBtn').onclick=()=>{$('modal').classList.add('show');speak(T('Choose a letter. Read the tongue twister. Think about the mind-bender.','Elige una letra. Lee el trabalenguas. Piensa en el giro mental.'))};$('closeManual').onclick=()=>$('modal').classList.remove('show');$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;baseUi();if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};$('restartBtn').onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script></body></html>
