;$('guide').innerHTML='👉 '+tx(copy.next);$('reward').style.display='block';$('reward').innerHTML='<button class="small" onclick="reset()">'+tx(copy.replay)+'</button><div style="margin-top:10px">'+badges.join(' ')+'</div>';popup(badge);confetti(34)}function reset(){score=0;streak=0;voiceScore=0;round=0;used=[];shuffle(cards);render()}manualBtn.onclick=()=>{baseUi();modal.classList.add('show')};closeManual.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};voiceBtn.onclick=()=>{voiceOn=!voiceOn;baseUi();if(!voiceOn&&window.SeanGameVoice)window.SeanGameVoice.stop()};restartBtn.onclick=reset;setInterval(()=>{if(lang()!==lastLang)render()},300);render();</script><script src="/games/guide-robot.js"></script>
