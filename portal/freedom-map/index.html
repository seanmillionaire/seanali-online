<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freedom Map | The Portal</title><meta name="description" content="Discover what freedom actually means to you."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/portal/freedom-map/"><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="ap-shell"><div class="ap-wrap"><section class="ap-card"><div class="ap-body"><div class="ap-topline"><a href="/portal/">← Portal</a><span>Freedom Map</span></div><h1 class="ap-question">What kind of freedom are you really chasing?</h1><div class="ap-answers"><button class="portal-choice" data-r="time"><b>A</b><span>I want control of my day.</span></button><button class="portal-choice" data-r="money"><b>B</b><span>I want money pressure gone.</span></button><button class="portal-choice" data-r="location"><b>C</b><span>I want to live and move where I want.</span></button><button class="portal-choice" data-r="creative"><b>D</b><span>I want to build what I actually care about.</span></button><button class="portal-choice" data-r="peace"><b>E</b><span>I want peace in my nervous system.</span></button></div><div class="portal-output" id="out"><div class="portal-card"><div class="ap-mini">Freedom type</div><h2 id="title"></h2><p id="line"></p><p class="ap-reset" id="reset"></p></div></div></div></section><footer class="ap-footer">The Portal · Freedom Map</footer></div></main><script>const map={time:['Time Freedom','Your freedom starts with owning your hours. The old pattern is letting other people spend your life.','My day belongs to the life I am building.'],money:['Money Freedom','Your freedom starts with numbers. Vague money desire keeps the cage vague too.','I make the number clear so I can build toward it.'],location:['Location Freedom','Your freedom starts with environment. Some places pull out a bigger version of you.','I am allowed to choose the place that matches my future.'],creative:['Creative Freedom','Your freedom starts with expression. You are tired of building only what keeps you safe.','My real work deserves to be seen.'],peace:['Peace Freedom','Your freedom starts inside the body. More success without peace becomes another prison.','I do not build a bigger life with the same inner chaos.']};document.querySelectorAll('.portal-choice').forEach(b=>b.onclick=()=>{const r=map[b.dataset.r];title.textContent=r[0];line.textContent=r[1];reset.textContent='“'+r[2]+'”';out.classList.add('show')});</script></body></html>
