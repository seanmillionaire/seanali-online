<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Spa | The Portal</title><meta name="description" content="Reset your state in 60 seconds."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/portal/spa/"><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="ap-shell"><div class="ap-wrap"><section class="ap-card"><div class="ap-body"><div class="ap-topline"><a href="/portal/">← Portal</a><span>The Spa</span></div><h1 class="ap-question">Reset your state in 60 seconds.</h1><div class="breath-circle" id="circle"><span id="cue">Press start</span></div><button class="ap-cta" id="start">Start 60-Second Reset</button><div class="portal-card"><div class="ap-mini">Reset script</div><p id="script">Drop the shoulders. Unclench the jaw. Slow the breath. You are not behind. You are returning to command.</p><p class="ap-reset">“I come back to power now.”</p></div></div></section><footer class="ap-footer">The Portal · The Spa</footer></div></main><script>const cues=['Inhale','Hold','Exhale','Drop shoulders','Unclench jaw','Receive calm','Choose power'];let timer=null;start.onclick=()=>{clearInterval(timer);let t=60,i=0;start.textContent='Reset running: 60';cue.textContent=cues[0];timer=setInterval(()=>{t--;if(t%8===0){i=(i+1)%cues.length;cue.textContent=cues[i];circle.classList.toggle('grow')}start.textContent='Reset running: '+t;if(t<=0){clearInterval(timer);cue.textContent='Reset complete';start.textContent='Run It Again';circle.classList.remove('grow')}},1000)};</script></body></html>
