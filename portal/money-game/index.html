<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Game | The Portal</title><meta name="description" content="Find the number your identity is currently capped at."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/portal/money-game/"><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="ap-shell"><div class="ap-wrap"><section class="ap-card"><div class="ap-body"><div class="ap-topline"><a href="/portal/">← Portal</a><span>Money Game</span></div><h1 class="ap-question">Find the number your identity rejects.</h1><div class="portal-input-grid"><div class="portal-field"><label>Freedom income / month</label><input id="freedom" type="number" value="25000" min="0"></div><div class="portal-field"><label>Number that feels realistic</label><input id="realistic" type="number" value="10000" min="0"></div><div class="portal-field"><label>Number that makes you tense</label><input id="tense" type="number" value="50000" min="0"></div></div><button class="ap-cta" id="calc">Reveal My Money Ceiling</button><div class="portal-output" id="out"><div class="portal-card"><div class="ap-mini">Your money pattern</div><h2 id="title"></h2><p id="line"></p><p class="ap-reset" id="reset"></p><div class="portal-pill-row"><a class="portal-pill" href="/portal/money-blocks/">Find the belief →</a><a class="portal-pill" href="/portal/spa/">Calm the body →</a><a class="portal-pill" href="/portal/quiz/">Take abundance quiz →</a></div></div></div></div></section><footer class="ap-footer">The Portal · Money Game</footer></div></main><script>function money(n){return '$'+Number(n||0).toLocaleString()}document.getElementById('calc').onclick=()=>{const f=+freedom.value,r=+realistic.value,t=+tense.value;let title='Your current ceiling is '+money(r);let line='You say you want '+money(f)+', but '+money(r)+' is the number your identity accepts without fighting you.';let reset='I do not negotiate with the old ceiling anymore.';if(t<=f&&t>r){title='Your body rejects '+money(t);line='That number is not too big. It is just unfamiliar. This is where the work starts.';reset='It is safe for me to normalize bigger numbers.'}if(r>=f){title='Your next gap is execution';line='Your identity can accept the number. Now the game is building the system that produces it.';reset='I move like the number is already normal.'}document.getElementById('title').textContent=title;document.getElementById('line').textContent=line;document.getElementById('reset').textContent='“'+reset+'”';out.classList.add('show')};</script></body></html>
