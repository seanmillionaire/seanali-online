<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Game | The Portal</title><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="wrap"><p><a href="/portal/" style="color:white;font-weight:900">← Portal</a></p><section class="card"><h1 class="title">Money Game</h1><p class="sub">Move the number. Watch the meter. Find the stretch point.</p><div class="money" id="num">$10,000</div><input class="range" id="slider" type="range" min="1000" max="100000" step="1000" value="10000"><p><b>Stretch meter</b></p><div class="meter"><div class="fill" id="fill"></div></div><button class="btn gold" id="reveal" style="margin-top:18px">Reveal</button><div class="out" id="out"><div class="box"><h2 id="headline"></h2><p id="copy"></p><div class="reset" id="reset"></div></div></div></section></main><script>const s=document.getElementById('slider'),n=document.getElementById('num'),f=document.getElementById('fill');function m(v){return '$'+Number(v).toLocaleString()}function d(){let v=+s.value;n.textContent=m(v);f.style.width=Math.min(100,Math.max(8,v/1000))+'%'}s.oninput=d;d();document.getElementById('reveal').onclick=function(){let v=+s.value;out.classList.add('show');if(v<15000){headline.textContent='Small room';copy.textContent='This number still belongs to the old level.';reset.textContent='I stop choosing from the old ceiling.'}else if(v<50000){headline.textContent='Stretch point';copy.textContent='This number asks for a new version of you.';reset.textContent='Bigger numbers can become normal.'}else{headline.textContent='Edge number';copy.textContent='This is where the game gets real.';reset.textContent='I can meet the number before life proves it.'}};</script></body></html>
