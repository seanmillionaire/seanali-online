<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laws Of The Universe | The Portal</title><meta name="description" content="See which law you are violating today."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/portal/laws/"><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="ap-shell"><div class="ap-wrap"><section class="ap-card"><div class="ap-body"><div class="ap-topline"><a href="/portal/">← Portal</a><span>Laws</span></div><h1 class="ap-question">Which law are you violating today?</h1><div class="ap-answers"><button class="portal-choice" data-r="assumption"><b>A</b><span>I keep assuming the old outcome.</span></button><button class="portal-choice" data-r="cause"><b>B</b><span>I want results without changing causes.</span></button><button class="portal-choice" data-r="receiving"><b>C</b><span>I ask for more, then resist receiving it.</span></button><button class="portal-choice" data-r="detachment"><b>D</b><span>I keep gripping the outcome.</span></button></div><div class="portal-output" id="out"><div class="portal-card"><div class="ap-mini">Law revealed</div><h2 id="title"></h2><p id="line"></p><p class="ap-reset" id="reset"></p></div></div></div></section><footer class="ap-footer">The Portal · Laws Of The Universe</footer></div></main><script>const laws={assumption:['Law Of Assumption','You cannot keep assuming the old level and then act shocked when life repeats it.','I assume from the level I am entering.'],cause:['Law Of Cause And Effect','A new result needs a new cause. New causes are choices, offers, actions, identity, and repetition.','I become the cause of the result I want.'],receiving:['Law Of Receiving','Asking is easy. Receiving exposes the identity.','I let more good reach me without pushing it away.'],detachment:['Law Of Detachment','Grip is fear wearing a strategy costume.','I move cleanly without choking the outcome.']};document.querySelectorAll('.portal-choice').forEach(b=>b.onclick=()=>{const r=laws[b.dataset.r];title.textContent=r[0];line.textContent=r[1];reset.textContent='“'+r[2]+'”';out.classList.add('show')});</script></body></html>
