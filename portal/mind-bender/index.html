<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Bender</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% -10%,#ffe9a6 0,#7a4714 8%,#35104b 24%,#08050b 58%,#030204 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0 8%,rgba(255,215,112,.08) 9%,transparent 13% 87%,rgba(255,215,112,.08) 91%,transparent 92%),radial-gradient(circle at 50% 22%,rgba(255,219,112,.45),transparent 24%),radial-gradient(circle at 50% 58%,rgba(255,198,67,.22),transparent 34%)}body:after{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffd978 1px,transparent 1px);background-size:38px 38px;opacity:.1}.wrap{width:min(980px,100%);margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#ffe8a4;font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:12px}.top a{color:#ffe8a4;text-decoration:none}.temple{text-align:center;padding:14px 0 28px}.kicker{display:inline-flex;border:1px solid #ffe8a488;background:#1a0d22cc;color:#ffe8a4;border-radius:999px;padding:8px 13px;font-weight:900;font-size:12px;letter-spacing:.08em}.title{font-size:clamp(46px,11vw,116px);line-height:.78;letter-spacing:-.085em;margin:18px 0 6px;font-weight:1000;text-shadow:0 0 22px #f6c85a77,0 10px 55px #000}.sub{font-size:clamp(18px,4vw,34px);line-height:1;font-weight:900;color:#ffe8a4;margin:0 auto;max-width:700px}.stage{position:relative;min-height:620px;display:grid;place-items:center}.halo{position:absolute;width:min(620px,92vw);height:min(620px,92vw);border-radius:50%;background:radial-gradient(circle,rgba(255,235,160,.42),rgba(255,198,67,.12) 34%,transparent 66%);filter:blur(2px);animation:pulse 3s infinite alternate}.altar{position:absolute;bottom:34px;width:min(620px,88vw);height:120px;border-radius:50%;background:radial-gradient(ellipse,#ffe8a4,#c58b21 38%,#4d2709 70%,transparent 71%);box-shadow:0 0 70px #f6c85a77,0 30px 80px #000}.deck{position:relative;width:min(440px,90vw);min-height:560px;border-radius:34px;padding:22px;background:linear-gradient(145deg,#fff3b8,#c98d25 28%,#6d380b 30%,#17091d 34%,#2e1042 100%);border:4px solid #ffefaa;box-shadow:0 0 0 8px #7a4a10,0 0 48px #ffd86b,0 38px 100px #000;animation:float 4s ease-in-out infinite}.face{min-height:410px;border-radius:26px;background:linear-gradient(180deg,#fff7d8,#efc76b 58%,#d69a2d);color:#211207;border:2px solid #fff0a7;box-shadow:inset 0 0 0 7px #8b5713,inset 0 0 40px #fff6c4,0 0 45px #ffdc6a88;padding:24px;display:grid;align-content:center;text-align:center}.sig{font-size:70px;filter:drop-shadow(0 0 14px #fff)}.face h2{font-size:clamp(42px,9vw,76px);line-height:.78;letter-spacing:-.08em;margin:14px 0 10px;font-weight:1000}.face p{font-size:20px;line-height:1.08;font-weight:900;margin:8px 0}.move{padding-top:12px;border-top:1px solid #7c4a12;color:#3b2108}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.mode{border:1px solid #ffe8a488;background:#100816;color:#ffe8a4;border-radius:14px;padding:10px 6px;font-weight:1000;cursor:pointer}.mode.on{background:linear-gradient(#fff2ad,#f1c76a);color:#160b1e;box-shadow:0 0 26px #f1c76a88}.btn{width:100%;min-height:62px;border:0;border-radius:18px;background:linear-gradient(#fff2ad,#f1c76a);color:#160b1e;font-size:21px;font-weight:1000;box-shadow:0 0 28px #f1c76a66,0 8px 0 #8a5611;cursor:pointer}.btn.dark{margin-top:12px;background:#130918;color:#ffe8a4;border:1px solid #ffe8a488;box-shadow:none}.stats{font-size:13px;color:#fbe7ab;font-weight:900;margin-top:14px;text-transform:uppercase;letter-spacing:.05em}@keyframes float{from{transform:translateY(0)}50%{transform:translateY(-10px)}to{transform:translateY(0)}}@keyframes pulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}@media(max-width:520px){.stage{min-height:590px}.deck{min-height:530px}.face{min-height:380px}.modes{font-size:12px}.btn{min-height:58px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a href="/portal/">← Portal</a><span>Mind Bender Temple</span></div>
  <section class="temple"><div class="kicker">Hyper Gold Temple</div><h1 class="title">Mind Bender</h1><p class="sub">Pull a sacred card. Bend the frame. Move from the higher room.</p></section>
  <section class="stage">
    <div class="halo"></div><div class="altar"></div>
    <div class="deck">
      <div class="modes"><button class="mode on" data-mode="quick">Quick</button><button class="mode" data-mode="money">Money</button><button class="mode" data-mode="god">God</button><button class="mode" data-mode="reality">Reality</button></div>
      <div class="face"><div class="sig" id="sig">🜂</div><h2 id="title">Pull A Card</h2><p id="bend">The old frame is waiting to be broken.</p><p class="move" id="move">Tap the gold button.</p></div>
      <button class="btn" id="pull">PULL CARD</button><button class="btn dark" id="save">SAVE CARD</button>
      <div class="stats"><span id="count">0</span> pulls today · <span id="saved">0</span> saved</div>
    </div>
  </section>
</main>
<script>
const cards={quick:[['🜂','ATTENTION IS CURRENCY','Your life follows what you keep feeding.','Withdraw attention from the old frame.'],['⚡','MOVE FIRST','Proof usually appears after movement.','Take one clean action now.'],['👁','REALITY VOTES','Every action votes for a version of you.','Cast one vote for the bigger life.']],money:[['💰','THE CEILING','The number feels big because the identity is old.','Normalize the bigger number.'],['🔱','SAME LEVEL TAX','The old belief keeps charging you through behavior.','Stop paying with delay.'],['🏛','RECEIVING GATE','Receiving exposes the identity.','Let more come close.']],god:[['☀️','THE DELAY','The delay may be protection, not denial.','Do not force the wrong door.'],['⚠️','THE WARNING','Peace leaving is information.','Listen before you move.'],['🕊','THE ASSIGNMENT','The vision is instruction, not decoration.','Move with obedience.']],reality:[['🪞','THE MIRROR IS LATE','Life reflects after identity changes.','Hold the new frame longer.'],['⏳','TIMELINE ECHO','The old timeline gets loud before it fades.','Do not re-enter it.'],['🧲','FUTURE PULL','Your future keeps pulling on your attention.','Answer it with action.']]};
let mode='quick',last=null,today=new Date().toDateString(),data=JSON.parse(localStorage.mbTemple||'{}');if(data.day!==today)data={day:today,pulls:0,saved:[]};function stats(){count.textContent=data.pulls||0;saved.textContent=(data.saved||[]).length}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode});pull.onclick=()=>{let list=cards[mode];last=list[Math.floor(Math.random()*list.length)];sig.textContent=last[0];title.textContent=last[1];bend.textContent=last[2];move.textContent=last[3];data.pulls=(data.pulls||0)+1;localStorage.mbTemple=JSON.stringify(data);stats()};save.onclick=()=>{if(last){data.saved=data.saved||[];data.saved.push(last[1]);localStorage.mbTemple=JSON.stringify(data);stats()}};stats();
</script>
</body></html>
