<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Bender</title>
<meta name="description" content="Pull a personalized premium Mind Bender card.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% -8%,#fff1bb 0,#9d5b12 8%,#3b1451 25%,#08050b 60%,#020103 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 33%,rgba(255,214,98,.34),transparent 28%),linear-gradient(90deg,rgba(255,215,112,.08),transparent 13% 87%,rgba(255,215,112,.08));opacity:.9}body:after{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffd978 1px,transparent 1px);background-size:34px 34px;opacity:.13}.app{position:relative;width:min(980px,100%);margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.back{color:#ffe8a4;text-decoration:none;font-size:13px;font-weight:1000;text-transform:uppercase;letter-spacing:.07em}.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#14091c;border:1px solid #ffe8a488;color:#ffe8a4;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:1000}.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:10px auto 12px;width:min(720px,100%)}input{width:100%;border:1px solid #ffe8a488;background:#120717;color:#ffe8a4;border-radius:16px;padding:14px;font-size:16px;font-weight:900;outline:none}.save-profile{border:0;border-radius:16px;padding:0 18px;background:linear-gradient(#fff6c7,#f1c76a);color:#160b1e;font-size:15px;font-weight:1000;box-shadow:0 6px 0 #8a5611;cursor:pointer}.realm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(720px,100%);margin:0 auto 12px}.realm button{border:2px solid #f1c76a;background:#100816;color:#ffe8a4;border-radius:18px;padding:12px 7px;font-size:14px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 #000}.realm button.on{background:linear-gradient(#fff6c7,#f1c76a);color:#160b1e;box-shadow:0 0 26px #f1c76a88,0 5px 0 #8a5611}.stage{position:relative;display:grid;place-items:center;min-height:680px}.halo{position:absolute;width:min(690px,96vw);height:min(690px,96vw);border-radius:50%;background:radial-gradient(circle,rgba(255,235,160,.52),rgba(255,198,67,.14) 36%,transparent 68%);animation:pulse 3s infinite alternate}.altar{position:absolute;bottom:28px;width:min(680px,92vw);height:124px;border-radius:50%;background:radial-gradient(ellipse,#ffe8a4,#c58b21 38%,#4d2709 70%,transparent 71%);box-shadow:0 0 85px #f6c85a88,0 30px 90px #000}.card{position:relative;width:min(470px,93vw);min-height:620px;border-radius:36px;padding:18px;background:linear-gradient(145deg,#fff8d5,#f2ca70 24%,#b87916 27%,#351044 32%,#120717 100%);border:4px solid #ffefaa;box-shadow:0 0 0 8px #7a4a10,0 0 70px #ffd86b,0 40px 110px #000;transition:.45s;overflow:hidden}.card.tilt{transform:rotateY(7deg) rotateX(4deg)}.card:before{content:"";position:absolute;inset:12px;border-radius:28px;border:1px solid #fff1af88;box-shadow:inset 0 0 38px #fff6c488}.card:after{content:"";position:absolute;inset:0;border-radius:36px;background:linear-gradient(120deg,transparent 0 30%,rgba(255,255,255,.52) 45%,transparent 62%);mix-blend-mode:screen;opacity:.52;animation:shine 3.5s infinite}.face{position:relative;z-index:1;min-height:580px;border-radius:28px;background:linear-gradient(180deg,#fffbe8,#efc76b 62%,#d69a2d);color:#211207;border:2px solid #fff0a7;box-shadow:inset 0 0 0 8px #8b5713,inset 0 0 46px #fff6c4,0 0 54px #ffdc6a88;padding:22px;text-align:center;display:grid;align-content:start}.icon{font-size:82px;line-height:1;margin:18px 0 8px;filter:drop-shadow(0 0 16px #fff)}.family{font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.16em;color:#6b3d07}.card h1{font-size:clamp(42px,9vw,72px);line-height:.78;letter-spacing:-.08em;margin:14px 0 8px;font-weight:1000}.person{font-size:14px;font-weight:1000;color:#6b3d07;border-top:1px solid #7c4a1233;border-bottom:1px solid #7c4a1233;padding:8px 0;margin:10px 0 16px}.message{font-size:clamp(21px,5vw,30px);line-height:1.02;font-weight:1000;margin:0;color:#2f1905}.pull{display:block;width:min(470px,93vw);margin:16px auto 0;min-height:68px;border:0;border-radius:22px;background:linear-gradient(#fff6c7,#f1c76a);color:#160b1e;font-size:22px;font-weight:1000;text-transform:uppercase;box-shadow:0 9px 0 #8a5611,0 0 30px #f1c76a66;cursor:pointer}.pull:active,.save-profile:active,.realm button:active{transform:translateY(4px)}@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}@keyframes pulse{from{opacity:.58;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}@media(max-width:620px){.setup{grid-template-columns:1fr}.realm{grid-template-columns:1fr}.stage{min-height:650px}.card{min-height:565px}.face{min-height:525px}.icon{font-size:68px}.top{align-items:flex-start}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><a class="back" href="/portal/">← Portal</a><div class="hud"><div class="chip"><span id="sign">Sign</span></div><div class="chip"><span id="deckLeft">0</span> Left</div><div class="chip"><span id="pulls">0</span> Pulls</div></div></div>
  <div class="setup"><input id="first" placeholder="First name"><input id="birthday" type="date"><button class="save-profile" id="profileBtn">Use</button></div>
  <div class="realm"><button class="on" data-realm="money">Money Gems</button><button data-realm="grace">God’s Grace</button><button data-realm="reality">Reality Shifters</button></div>
  <section class="stage"><div class="halo"></div><div class="altar"></div><article class="card tilt" id="card"><div class="face"><div class="icon" id="icon">💎</div><div class="family" id="family">Money Gem</div><h1 id="cardName">The Invisible Ceiling</h1><div class="person" id="person">Enter your name + birthday to personalize this pull.</div><p class="message" id="message">Money is not only counted in numbers. It is also measured by the version of you that can hold more without shrinking.</p></div></article></section>
  <button class="pull" id="pull">✨ Pull Premium Card ✨</button>
</main>
<script>
const zodiac=[['Capricorn',1,19],['Aquarius',2,18],['Pisces',3,20],['Aries',4,19],['Taurus',5,20],['Gemini',6,20],['Cancer',7,22],['Leo',8,22],['Virgo',9,22],['Libra',10,22],['Scorpio',11,21],['Sagittarius',12,21],['Capricorn',12,31]];
const flavors={Aquarius:'visionary future signal',Pisces:'dream current',Aries:'fire of first movement',Taurus:'steady receiving body',Gemini:'mental switchboard',Cancer:'emotional safety gate',Leo:'radiant visibility field',Virgo:'precision pattern',Libra:'harmony mirror',Scorpio:'deep transformation engine',Sagittarius:'expansion arrow',Capricorn:'mountain builder code'};
const order=['money','grace','reality'];
const decks={money:{label:'Money Gem',icon:'💎',cards:[['The Invisible Ceiling','Money is not only blocked by lack. Sometimes it stops at the amount your body still treats like danger. The ceiling is invisible because it is emotional before it is financial.'],['The Overflow Vault','Wealth does not always arrive as a bigger chase. Sometimes it appears when your inner room becomes large enough that more can enter without making you panic.'],['The Gold Orchard','Money is not a single tree you shake harder. It is an orchard planted by repeated identity, clean offers, and the patience to let value multiply.'],['The Higher Price Door','A higher price is not only a number. It is a doorway that asks whether your self-image can stand beside your value without apologizing.']]},grace:{label:'God’s Grace',icon:'☀️',cards:[['The Protected Delay','What feels late is not always loss. Sometimes grace slows the door so you do not enter it with the same nervous system that would have ruined the blessing.'],['The Provision Gate','God does not only provide by adding. Sometimes provision begins by removing the appetite for what was draining you.'],['The Open Hand','A closed fist can hold fear or money, but not grace. Some doors open when the hand stops gripping the old outcome.'],['The Holy Detour','The detour is not proof you are lost. Sometimes it is the route that keeps your assignment alive long enough to meet you ready.']]},reality:{label:'Reality Shifter',icon:'🌀',cards:[['The Mirror of Becoming','Reality is not refusing you. It is waiting for your repeated self to become louder than your temporary mood.'],['The Assumption Lens','You do not see life as it is. You see it through the identity you keep rehearsing. Change the lens and the same world starts answering differently.'],['The Future Pull','The future is not far away. It is already tugging on your attention, waiting to see if your choices will answer the signal.'],['The Reality Vote','Your future does not come only from what you want. It comes from what your repeated choices keep voting for. Every tolerance is a ballot.']]}};
let realm='money',data=JSON.parse(localStorage.mbLuxury||'{}');
function getSign(date){if(!date)return 'Sign';let d=new Date(date+'T00:00:00'),m=d.getMonth()+1,day=d.getDate();for(let z of zodiac){if(m<z[1]||(m===z[1]&&day<=z[2]))return z[0]}return 'Capricorn'}
function profile(){data.name=first.value.trim()||data.name||'';data.birthday=birthday.value||data.birthday||'';localStorage.mbLuxury=JSON.stringify(data);renderPerson()}
function seen(){data.seen=data.seen||{money:[],grace:[],reality:[]};return data.seen}
function remaining(r){let s=seen()[r]||[];return decks[r].cards.map((_,i)=>i).filter(i=>!s.includes(i))}
function allDone(){return order.every(r=>remaining(r).length===0)}
function setRealm(r){realm=r;document.querySelectorAll('.realm button').forEach(b=>b.classList.toggle('on',b.dataset.realm===realm));let d=decks[realm];icon.textContent=d.icon;family.textContent=d.label;deckLeft.textContent=remaining(realm).length}
function nextRealm(){let start=order.indexOf(realm);for(let n=1;n<=order.length;n++){let r=order[(start+n)%order.length];if(remaining(r).length>0)return r}return order[0]}
function renderPerson(){if(data.name)first.value=data.name;if(data.birthday)birthday.value=data.birthday;let s=getSign(data.birthday);sign.textContent=s;person.textContent=data.name?`${data.name} · ${s} · ${flavors[s]||'personal signal'}`:'Enter your name + birthday to personalize this pull.';pulls.textContent=data.pulls||0;deckLeft.textContent=remaining(realm).length}
function pullCard(){if(allDone()){data.seen={money:[],grace:[],reality:[]};setRealm('money')}else if(remaining(realm).length===0){setRealm(nextRealm())}let left=remaining(realm),pick=left[Math.floor(Math.random()*left.length)],deck=decks[realm],c=deck.cards[pick],s=getSign(data.birthday),name=data.name||'You',fl=flavors[s]||'personal signal';seen()[realm].push(pick);icon.textContent=deck.icon;family.textContent=deck.label;cardName.textContent=c[0];message.textContent=`${name}, your ${fl} changes this card: ${c[1]}`;data.pulls=(data.pulls||0)+1;localStorage.mbLuxury=JSON.stringify(data);pulls.textContent=data.pulls;deckLeft.textContent=remaining(realm).length;card.classList.toggle('tilt');if(remaining(realm).length===0&&!allDone()){let nr=nextRealm();pull.textContent=`✨ Next: ${decks[nr].label} ✨`}else{pull.textContent='✨ Pull Premium Card ✨'}}
document.querySelectorAll('.realm button').forEach(b=>b.onclick=()=>{setRealm(b.dataset.realm);let d=decks[realm];cardName.textContent=d.cards[0][0];message.textContent=d.cards[0][1];pull.textContent=remaining(realm).length?'✨ Pull Premium Card ✨':`✨ Next: ${decks[nextRealm()].label} ✨`});
profileBtn.onclick=profile;pull.onclick=()=>{profile();pullCard()};setRealm(realm);renderPerson();
</script>
</body>
</html>
