<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Bender</title><link rel="stylesheet" href="/portal/assets/portal.css"><style>body{background:radial-gradient(circle at top,#3b2154,#09060d 48%)}.mb{min-height:100vh;display:grid;place-items:center}.deck{width:min(420px,92vw);min-height:570px;border-radius:32px;background:linear-gradient(#281537,#120917);border:3px solid #f1c76a;box-shadow:0 20px 0 #58370e,0 35px 90px #0009;padding:22px;color:white;text-align:center}.face{min-height:360px;border-radius:26px;background:linear-gradient(#fff8d8,#e5b94f);color:#21120a;padding:22px;display:grid;align-content:center;box-shadow:inset 0 0 0 2px #fff3bf}.sig{font-size:62px}.face h1{font-size:46px;line-height:.9;letter-spacing:-.06em;margin:12px 0}.face p{font-size:20px;font-weight:900;line-height:1.12}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.mode{border:1px solid #f1c76a;background:#20102c;color:white;border-radius:12px;padding:9px;font-weight:900}.mode.on{background:#f1c76a;color:#151019}.stats{font-size:13px;color:#d9c6ef;font-weight:900;margin-top:10px}</style></head><body><main class="wrap mb"><section class="deck"><a href="/portal/" style="color:#f1c76a;font-weight:900;text-decoration:none">← THE PORTAL</a><div class="modes"><button class="mode on" data-mode="quick">Quick</button><button class="mode" data-mode="money">Money</button><button class="mode" data-mode="god">God</button><button class="mode" data-mode="reality">Reality</button></div><div class="face" id="card"><div class="sig">🌀</div><h1 id="title">Pull A Card</h1><p id="bend">Tap the deck and bend the old frame.</p><p id="move"></p></div><button class="btn gold" id="pull" style="margin-top:18px">Pull Card</button><button class="btn" id="save" style="margin-top:10px">Save Card</button><div class="stats"><span id="count">0</span> pulls today · <span id="saved">0</span> saved</div></section></main><script>const cards={quick:[['Attention Is Currency','Your life follows what you keep feeding.','Withdraw attention from the old frame.'],['Move First','Proof usually appears after movement.','Take one clean action now.'],['Reality Votes','Every action votes for a version of you.','Cast one vote for the bigger life.']],money:[['The Ceiling','The number feels big because the identity is old.','Normalize the bigger number.'],['Same Level Tax','The old belief keeps charging you through behavior.','Stop paying with delay.'],['Receiving Gate','Asking is easy. Receiving exposes identity.','Let more come close.']],god:[['The Delay','The delay may be protection, not denial.','Do not force the wrong door.'],['The Warning','Peace leaving is information.','Listen before you move.'],['The Assignment','The vision is instruction, not decoration.','Move with obedience.']],reality:[['Matter Is Slow Belief','Old evidence is delayed feedback.','Stop asking it for permission.'],['The Mirror Is Late','Life reflects after identity changes.','Hold the new frame longer.'],['Timeline Echo','The old timeline gets loud before it fades.','Do not re-enter it.']]};let mode='quick',last=null;let today=new Date().toDateString();let data=JSON.parse(localStorage.mb||'{}');if(data.day!==today)data={day:today,pulls:0,saved:[]};function showStats(){count.textContent=data.pulls||0;saved.textContent=(data.saved||[]).length}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode});pull.onclick=()=>{let list=cards[mode];last=list[Math.floor(Math.random()*list.length)];title.textContent=last[0];bend.textContent=last[1];move.textContent=last[2];data.pulls=(data.pulls||0)+1;localStorage.mb=JSON.stringify(data);showStats()};save.onclick=()=>{if(last){data.saved=data.saved||[];data.saved.push(last[0]);localStorage.mb=JSON.stringify(data);showStats()}};showStats();</script></body></html>
