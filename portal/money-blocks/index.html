<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Blocks | The Portal</title><meta name="description" content="Expose the belief that has been taxing your life."><meta name="robots" content="index,follow"><link rel="canonical" href="https://seanali.online/portal/money-blocks/"><link rel="stylesheet" href="/portal/assets/portal.css"></head>
<body><main class="ap-shell"><div class="ap-wrap"><section class="ap-card"><div class="ap-body"><div class="ap-topline"><a href="/portal/">← Portal</a><span>Money Blocks</span></div><h1 class="ap-question">Which belief has been taxing your life?</h1><div class="ap-answers"><button class="portal-choice" data-r="struggle"><b>A</b><span>I must struggle to earn.</span></button><button class="portal-choice" data-r="leave"><b>B</b><span>Money leaves fast.</span></button><button class="portal-choice" data-r="judged"><b>C</b><span>Rich people get judged.</span></button><button class="portal-choice" data-r="spiritual"><b>D</b><span>I cannot be spiritual and rich.</span></button><button class="portal-choice" data-r="charge"><b>E</b><span>If I charge more, people leave.</span></button></div><div class="portal-output" id="out"><div class="portal-card"><div class="ap-mini">Belief exposed</div><h2 id="title"></h2><p id="line"></p><p class="ap-reset" id="reset"></p><div class="portal-pill-row"><a class="portal-pill" href="/portal/money-game/">Test the number →</a><a class="portal-pill" href="/portal/spa/">Calm the body →</a></div></div></div></div></section><footer class="ap-footer">The Portal · Money Blocks</footer></div></main><script>const blocks={struggle:['Struggle Contract','This belief makes ease feel suspicious. It turns money into punishment.','Money can come through value, not suffering.'],leave:['Money Leak Story','If you expect money to leave, you will keep finding reasons to release it.','I can receive, hold, direct, and multiply money.'],judged:['Visibility Tax','You are making imaginary judgment more expensive than staying stuck.','I can be seen and still be safe.'],spiritual:['False Split','This belief divides God, purpose, money, and capacity when they can work together.','More money can serve a cleaner assignment.'],charge:['Undercharging Pattern','This belief makes your value depend on other people staying comfortable.','The right people can meet my new price.']};document.querySelectorAll('.portal-choice').forEach(b=>b.onclick=()=>{const r=blocks[b.dataset.r];title.textContent=r[0];line.textContent=r[1];reset.textContent='“'+r[2]+'”';out.classList.add('show')});</script></body></html>
