</head>

        // Slide 6

                <li><span class="bullet-icon">💰</span> Money was stressful.</li>

        // Slide 7
        `<div class="fade-transition">
            <h2>💡 The Goal Isn't To Get Rich</h2>
            <ul class="bullet-list">
                <li><span class="bullet-icon">👤</span> The goal is to become the person who naturally creates results.</li>

            </ul>
            <div class="reveal-box">

                <p style="font-weight: 700; font-size:1.1rem; color:#F5C842;">Identity shift first. Results second.</p>
            </div>
        </div>`,
        // Slide 8
        `<div class="fade-transition">
            <h2>🚀 When Success Feels Normal</h2>
            <ul class="bullet-list">
                <li><span class="bullet-icon">⏸️</span> You stop hesitating.</li>
                <li><span class="bullet-icon">🤔</span> You stop overthinking.</li>
                <li><span class="bullet-icon">🚪</span> You stop talking yourself out of opportunities.</li>
            </ul>
        </div>`,
        // Slide 9
        `<div class="fade-transition">
            <h2>🌴 Look Around Your Life</h2>
            <ul class="bullet-list">
                <li><span class="bullet-icon">💡</span> Everything started as a thought.</li>
                <li><span class="bullet-icon">🔄</span> Then a pattern.</li>
                <li><span class="bullet-icon">🔁</span> Then repeated behavior.</li>
                <li><span class="bullet-icon">🌍</span> Then reality.</li>

        </div>`,
        // Slide 10
        `<div class="fade-transition">
            <div class="quote-block" style="text-align:center;">📖 Neville called it <strong>"living from the end"</strong>.</div>
            <div class="reveal-box">
                <span class="icon-big">🎭</span>
                <p style="font-size: 1.3rem; font-weight: 700; color:#FFFFFF;">I call it:<br><span style="color:#F5C842;">Rehearsing your future before it arrives.</span></p>
            </div>
            <div style="margin-top: 0.75rem; text-align: center; color:#6b5fa8; font-size:0.9rem; font-style:italic;">— Sean Ali</div>
        </div>`,
        // Slide 11
        `<div class="fade-transition">
            <div class="reveal-box" style="background: linear-gradient(135deg, rgba(123,63,228,0.25), rgba(245,200,66,0.1)); border-color: rgba(245,200,66,0.4);">
                <span class="icon-big">🌙</span>
                <div class="big-number">Tonight</div>
                <ul class="bullet-list" style="color: #c4b8e8; text-align: left; margin-top:0.5rem;">
                    <li><span class="bullet-icon">⏱️</span> Spend 60 seconds imagining one thing going right.</li>
                    <li><span class="bullet-icon">✨</span> Not perfectly. Just better.</li>
                </ul>
            </div>
        </div>`,
        // Slide 12
        `<div class="fade-transition">
            <h1 style="font-size: 2.4rem;">✨ The Wealth Secret Most People Miss</h1>
            <ul class="bullet-list">
                <li><span class="bullet-icon">🧠</span> Your mind is practicing something all day.</li>
                <li><span class="bullet-icon">❓</span> The question is:</li>
            </ul>
            <div class="big-number">What are you rehearsing?</div>
            <div class="quote-block" style="text-align:center;">That's the only question that matters.</div>
        </div>`,
        // Slide 13 — GENIE CTA
        `<div class="fade-transition">
            <div class="genie-card">
                <div style="display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 1rem;">
                    <span style="font-weight: 800; font-size: 1.2rem; color:#FFFFFF;">🧞 Manifestation Genie</span>
                    <span style="background: rgba(123,63,228,0.2); padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; color:#a78bfa; border:1px solid rgba(123,63,228,0.3);">0 days</span>
                </div>
                <div class="genie-prompt">
                    <p style="font-weight: 600; color:#e8e2ff;">Sean, what's stressing you out right now?</p>
                    <p style="font-size: 0.8rem; margin-top: 0.5rem; color:#8a7dbf;">Manifestation works better when your mind is clear.</p>
                    <input type="text" class="genie-input" placeholder="e.g., Money feels tight again..." id="stressInput">
                    <a href="https://manifestationgenie.ai/" target="_blank" class="genie-button">Talk To The Genie →</a>
                    <p style="font-size: 0.7rem; margin-top: 0.5rem; color:#6b5fa8;">or <a href="#" style="color:#F5C842;">Scan what's stressing me →</a></p>
                </div>
                <div class="alignment-badge">✨ Your manifestation is 44% aligned today</div>
                <div style="margin-top: 1rem; text-align: left; font-size: 0.75rem; color: #6b5fa8;">
                    <p style="color:#a78bfa; font-weight:600; margin-bottom:0.4rem;">How the Genie helps</p>
                    <p>1. Clear what's stressing you</p>
                    <p>2. Find what's getting in the way</p>
                    <p>3. Focus on what you want next</p>
                </div>
                <div style="margin-top: 1rem; text-align: center;">
                    <a href="https://manifestationgenie.ai/" target="_blank" style="color:#F5C842; font-weight: 600; text-decoration: none;">✨ Tap to get started instantly →</a>
                </div>
                <div style="margin-top: 0.8rem; font-size: 0.7rem; color: #7B3FE4; font-weight:600;">4.9/5 · Rated from our community</div>
            </div>
        </div>`
    ];

    let currentIdx = 0;
    const total = slides.length;
    const container = document.getElementById('slideContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterSpan = document.getElementById('counter');
    const dotsPanel = document.getElementById('dotsPanel');

    function renderSlide() {
        container.style.opacity = '0';
        setTimeout(() => {
            container.innerHTML = slides[currentIdx];
            const fadeDiv = container.querySelector('.fade-transition');
            if (fadeDiv) {
                fadeDiv.style.animation = 'none';
                fadeDiv.offsetHeight;
                fadeDiv.style.animation = 'fadeSlide 0.35s ease-out';
            }
            container.style.opacity = '1';
        }, 20);
        counterSpan.innerText = `Slide ${currentIdx+1} / ${total}`;
        updateDots();
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, i) => {
            if (i === currentIdx) dot.classList.add('active');
            else dot.classList.remove('active');
        });
    }

    function buildDots() {
        dotsPanel.innerHTML = '';
        for (let i = 0; i < total; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === currentIdx) dot.classList.add('active');
            dot.addEventListener('click', () => {
                currentIdx = i;
                renderSlide();
            });
            dotsPanel.appendChild(dot);
        }
    }

    function next() {
        if (currentIdx < total - 1) {
            currentIdx++;
            renderSlide();
        } else {
            nextBtn.style.transform = 'scale(0.95)';
            setTimeout(() => nextBtn.style.transform = '', 150);
        }
    }

    function prev() {
        if (currentIdx > 0) {
            currentIdx--;
            renderSlide();
        } else {
            prevBtn.style.transform = 'scale(0.95)';
            setTimeout(() => prevBtn.style.transform = '', 150);
        }
    }

    function keyHandler(e) {
        if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    }

    buildDots();
    renderSlide();

    prevBtn.addEventListener('click', prev);
    nextBtn.addEventListener('click', next);
    window.addEventListener('keydown', keyHandler);

    let touchStart = 0;
    container.addEventListener('touchstart', (e) => {
        touchStart = e.changedTouches[0].screenX;
    });
    container.addEventListener('touchend', (e) => {
        const touchEnd = e.changedTouches[0].screenX;
        const diff = touchEnd - touchStart;
        if (Math.abs(diff) > 55) {
            if (diff > 0) prev();
            else next();
        }
    });
</script>
</body>
</html>
